  <style>/* Speak Studio — カスタムスタイル（Tailwind CDN 併用） */
:root {
  --brand: #6d28d9;      /* violet-700 */
  --brand2: #ec4899;     /* pink-500 */
  --brand-soft: #f5f3ff; /* violet-50 */
  --ok: #16a34a;
  --warn: #f59e0b;
  --bad: #ef4444;
  --ink: #1f2937;
}
* { -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior-y: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Segoe UI', sans-serif;
  color: var(--ink);
  background: #faf5ff;
  padding-bottom: 84px; /* bottom nav 分 */
}
.brand-grad { background: linear-gradient(135deg, var(--brand) 0%, var(--brand2) 100%); }
.text-brand { color: var(--brand); }

/* 画面切替 */
.view { display: none; animation: fade .25s ease; }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ボトムナビ */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
  border-top: 1px solid #eee; box-shadow: 0 -4px 20px rgba(0,0,0,.05);
  max-width: 560px; margin: 0 auto;
}
.bottom-nav button {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 10px; font-size: 11px; color: #9ca3af; font-weight: 600;
}
.bottom-nav button.active { color: var(--brand); }
.bottom-nav button svg { width: 24px; height: 24px; }

/* マイクボタン */
.mic-btn {
  width: 96px; height: 96px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; box-shadow: 0 10px 30px rgba(109,40,217,.35);
  transition: transform .1s;
}
.mic-btn:active { transform: scale(.94); }
.mic-btn.listening { animation: pulse 1.2s infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(236,72,153,.5); }
  70% { box-shadow: 0 0 0 22px rgba(236,72,153,0); }
  100% { box-shadow: 0 0 0 0 rgba(236,72,153,0); }
}

/* スコアの単語ハイライト */
.wtok { padding: 1px 3px; border-radius: 5px; }
.wtok.ok { color: var(--ok); background: #dcfce7; }
.wtok.ng { color: var(--bad); background: #fee2e2; }

/* カードめくり */
.flip { perspective: 1200px; }
.flip-inner { position: relative; transform-style: preserve-3d; transition: transform .5s; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; backface-visibility: hidden; display: flex; flex-direction: column; }
.flip-back { transform: rotateY(180deg); }

/* リング（プログレス） */
.ring { transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }

/* チップ */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }

/* スクロールバー控えめ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #ddd; border-radius: 6px; }

/* リスト行 */
.row { transition: background .15s; }
.row:active { background: #f3f4f6; }

.hidden-x { display: none !important; }

/* クイズ等の正誤フィードバック（テーマ対応） */
.opt-correct { background: #dcfce7 !important; border-color: #4ade80 !important; color: #166534 !important; }
.opt-wrong { background: #fee2e2 !important; border-color: #fca5a5 !important; color: #991b1b !important; }

/* =========================
   ダークモード
   ========================= */
html.dark body { background: #0f0d17; color: #e5e7eb; }
html.dark .bg-white { background: #1b1826 !important; }
html.dark .bg-gray-50 { background: #161320 !important; }
html.dark .bg-gray-100 { background: #242031 !important; }
html.dark .bg-gray-800,
html.dark .bg-gray-900 { background: #322c44 !important; }
html.dark .text-gray-800 { color: #e7e8ec !important; }
html.dark .text-gray-700 { color: #d6d9df !important; }
html.dark .text-gray-600 { color: #c2c6cf !important; }
html.dark .text-gray-500 { color: #9aa0ab !important; }
html.dark .text-gray-400 { color: #7f8591 !important; }
html.dark .text-gray-300 { color: #5f6570 !important; }
html.dark .border-gray-100 { border-color: #2a2637 !important; }
html.dark .border-gray-200 { border-color: #332e42 !important; }
html.dark .border-dashed { border-color: #3a3550 !important; }
html.dark .bg-violet-50 { background: #241b3a !important; }
html.dark .bg-pink-50 { background: #321a2a !important; }
html.dark .bg-blue-50 { background: #16233a !important; }
html.dark .bg-green-50 { background: #12271b !important; }
html.dark .bg-red-50 { background: #2c1719 !important; }
html.dark .bg-orange-50 { background: #2a1f12 !important; }
html.dark .bg-amber-50 { background: #2a2213 !important; }
html.dark .text-brand { color: #a78bfa !important; }
html.dark .bottom-nav { background: rgba(20, 17, 28, .93) !important; border-top-color: #2a2637; }
html.dark .bottom-nav button { color: #6b7280; }
html.dark .bottom-nav button.active { color: #a78bfa; }
html.dark input, html.dark textarea { background: #1b1826; border-color: #332e42 !important; color: #e5e7eb; }
html.dark input::placeholder, html.dark textarea::placeholder { color: #6b7280; }
html.dark .max-w-\[560px\].bg-white { background: #12101a !important; }
html.dark ::-webkit-scrollbar-thumb { background: #333; }
/* ダーク時の正誤色 */
html.dark .opt-correct { background: #14361f !important; border-color: #2f7d4d !important; color: #86efac !important; }
html.dark .opt-wrong { background: #3a1a1c !important; border-color: #a14a4a !important; color: #fca5a5 !important; }
html.dark .wtok.ok { color: #86efac; background: #14361f; }
html.dark .wtok.ng { color: #fca5a5; background: #3a1a1c; }

/* 聞き流し: 再生中の行・文のハイライト */
.ls-row.ls-now { border-color: var(--brand); background: var(--brand-soft); }
.ls-sent.ls-now { background: #fde68a; color: #111827; }
</style>

</head>
<body>
  <div class="max-w-[560px] mx-auto min-h-screen bg-white shadow-sm relative">

    <!-- ヘッダー -->
    <header class="brand-grad text-white px-5 pt-5 pb-4 rounded-b-3xl sticky top-0 z-30">
      <div class="flex items-center justify-between">
        <div>
          <div class="text-[11px] opacity-80 font-semibold tracking-wide">SPEAK STUDIO</div>
          <h1 id="hdr-title" class="text-xl font-bold leading-tight">ホーム</h1>
        </div>
        <div class="flex items-center gap-2">
          <div class="text-right">
            <div class="text-[10px] opacity-80">レベル</div>
            <div id="hdr-level" class="text-lg font-bold leading-none">1</div>
          </div>
          <div class="flex items-center gap-1 bg-white/20 rounded-full px-3 py-1">
            <span>🔥</span><span id="hdr-streak" class="font-bold text-sm">0</span>
          </div>
          <button id="hdr-menu" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center" aria-label="メニュー">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
      </div>
      <!-- XPバー -->
      <div class="mt-3">
        <div class="flex justify-between text-[10px] opacity-80 mb-1">
          <span id="hdr-xp">0 XP</span>
          <span id="hdr-xpnext"></span>
        </div>
        <div class="h-2 rounded-full bg-white/25 overflow-hidden">
          <div id="hdr-xpbar" class="h-full bg-white rounded-full transition-all" style="width:0%"></div>
        </div>

  <script>window.__DATA__={"dialogues":[{"id":1,"a":"Are there any tickets left?","aJa":"チケットはまだありますか?","b":"We're sold out.","bJa":"完売です。","note":"tickets left=残りのチケット / sold out=売り切れ"},{"id":2,"a":"It's my treat.","aJa":"ここは私がおごるよ。","b":"Thank you. But let's split the bill.","bJa":"ありがとう。でも割り勘でいいよ。","note":"It's my treat=私のおごり / split the bill=割り勘にする"},{"id":3,"a":"Do you have a bigger one?","aJa":"もっと大きいサイズはありますか?","b":"I think so. I'll check.","bJa":"あると思いますが、確認してみますね。","note":"bigger one=もっと大きいもの"},{"id":4,"a":"Can I use e-money here?","aJa":"電子マネーは使えますか?","b":"Sorry. We only accept cash.","bJa":"すみません。現金のみの取り扱いです。","note":"e-money=電子マネー / accept cash=現金を受け付ける"},{"id":5,"a":"What time does the concert start?","aJa":"コンサートは何時に開演だっけ?","b":"It starts at 7 pm, I think.","bJa":"7時だったと思う。","note":"concert=コンサート / start=始まる"},{"id":6,"a":"I've cleaned the toilet.","aJa":"トイレ掃除をしておいたよ。","b":"Thanks for helping out. I really appreciate it.","bJa":"手伝ってくれてありがとう。助かったよ。","note":"help out=手伝う / appreciate=感謝する"},{"id":7,"a":"What's the score now?","aJa":"スコアは?","b":"It's a 3-3 tie. Can we come back from this?","bJa":"3対3の引き分けだよ。逆転できるかな?","note":"tie=引き分け / come back=逆転する"},{"id":8,"a":"I want to ride a roller coaster.","aJa":"ジェットコースターに乗りたい。","b":"No way, I'm afraid of heights.","bJa":"絶対ヤダ、高所恐怖症なんだから。","note":"No way=絶対いや / afraid of heights=高所恐怖症"},{"id":9,"a":"Why don't you take your shirt off?","aJa":"どうしてシャツを脱がないの?","b":"I don't want to get sunburned.","bJa":"日焼けが嫌なのよ。","note":"take off=脱ぐ / get sunburned=日焼けする"},{"id":10,"a":"How much longer can you play?","aJa":"あとどれくらいゲームできる?","b":"I want to go to bed by 11 pm.","bJa":"11時には寝たいかな。","note":"How much longer=あとどれくらい / go to bed=寝る"},{"id":11,"a":"What do you do in your free time?","aJa":"ひまなときは何をしてるの?","b":"I usually watch YouTube for hours.","bJa":"ずっとYouTube動画を見てるよ。","note":"free time=ひまな時間 / for hours=何時間も"},{"id":12,"a":"Have you read any books lately?","aJa":"最近何か本は読んでる?","b":"Not really. I don't have time to read.","bJa":"あんまりかな。読む時間がないんだ。","note":"lately=最近 / not really=あんまり"},{"id":13,"a":"Did you add the next song?","aJa":"次の曲は入れた?","b":"Let's see. I'm searching for that anime song.","bJa":"ええとね、あのアニソンを探しているんだけど…。","note":"add=追加する / search for=探す"},{"id":14,"a":"Oh no, the laundry is soaked.","aJa":"大変!洗濯物がびしょびしょになっちゃった。","b":"The weather forecast can never be relied on.","bJa":"天気予報は全然当てにならないね。","note":"soaked=びしょ濡れ / rely on=当てにする"},{"id":15,"a":"Shall we exchange LINE IDs?","aJa":"LINEのIDを交換しない?","b":"Sure. Please scan the QR code with your smartphone.","bJa":"いいよ。スマホカメラでQRコードを読み込んで。","note":"exchange=交換する / scan=読み取る"},{"id":16,"a":"Do you have any recommendations for Korean dramas?","aJa":"おすすめの韓国ドラマを教えて。","b":"I was really into \"Itaewon Class\".","bJa":"私は『梨泰院クラス』にどハマりしたよ。","note":"recommendation=おすすめ / be into ~=〜にハマる"},{"id":17,"a":"What would you like to eat?","aJa":"何食べたい?","b":"A salad! But we have to go shopping first.","bJa":"サラダかな。でもまずは買い物に行かなきゃ。","note":"would like to ~=〜したい(丁寧)"},{"id":18,"a":"Let's set up a tent here.","aJa":"ここにテントを張ろうか。","b":"Okay, I'll bring the tarp and chairs as well.","bJa":"オーケー、タープとイスも持ってくるよ。","note":"set up a tent=テントを張る / tarp=タープ"},{"id":19,"a":"Can I send you a friend request?","aJa":"友達申請していい?","b":"Sure. I'll approve it once you send it.","bJa":"もちろん。申請してくれたら承認するよ。","note":"friend request=友達申請 / approve=承認する / once=〜したら"},{"id":20,"a":"Who is your favorite member of the group?","aJa":"グループでの推しは誰ですか?","b":"I'm a fan of the whole group.","bJa":"箱推しです。","note":"favorite member=推し / the whole group=グループ全体(箱推し)"},{"id":21,"a":"How should I cut the meat? What size?","aJa":"お肉はどれくらいに切ればいいの?","b":"Please cut it into bite-sized pieces.","bJa":"一口サイズに切って。","note":"bite-sized=一口サイズの"},{"id":22,"a":"I found a delivery notice slip in the mailbox.","aJa":"ポストに宅配便の不在票が入っていたよ。","b":"I should request redelivery for tomorrow.","bJa":"明日再配達してもらえばいいね。","note":"delivery notice slip=不在票 / redelivery=再配達"},{"id":23,"a":"Would you consider this burnable trash?","aJa":"これは燃えるごみかな?","b":"I think it's non-burnable trash. Maybe it's recyclable.","bJa":"燃えないごみだと思う。いや、資源ごみかも。","note":"burnable=燃える / recyclable=リサイクル可能な"},{"id":24,"a":"Can you turn down the TV?","aJa":"テレビのボリュームを下げてくれる?","b":"Sure. I was worried the sound might be too loud.","bJa":"わかった。私も音が大き過ぎるかなと思ってたんだ。","note":"turn down=(音量を)下げる / too loud=うるさすぎる"},{"id":25,"a":"We are running out of Kleenex and milk.","aJa":"ティッシュペーパーと牛乳がなくなりそうだよ。","b":"Okay, I'm going to get them this afternoon.","bJa":"わかった、午後に買ってくるよ。","note":"run out of ~=〜が切れそう / Kleenex=ティッシュ"},{"id":26,"a":"Did you watch this video on YouTube?","aJa":"YouTubeのこの動画は見た?","b":"Yeah, the comments on that were pretty lively too.","bJa":"見たよ。コメント欄も盛り上がってたね。","note":"comments=コメント / lively=盛り上がった・活発な"},{"id":27,"a":"How can I remove this grease stain?","aJa":"この油汚れはどうすれば落とせるだろう?","b":"You could try scrubbing the stain with a toothbrush.","bJa":"歯ブラシでゴシゴシこすってみたらどうだろう。","note":"grease stain=油汚れ / scrub=ゴシゴシこする"},{"id":28,"a":"Whenever I come, Disneyland is the best place.","aJa":"ディズニーランドっていつ来ても最高だよね。","b":"That's because Disneyland is called a magical wonderland.","bJa":"それはディズニーランドが夢の国だからだよ。","note":"whenever=いつ〜しても / magical wonderland=夢の国"},{"id":29,"a":"What a mess this room is!","aJa":"なんて汚い部屋なの!","b":"I know, I'm going to tidy up the room right now.","bJa":"わかってる、今片付けるよ。","note":"What a mess!=なんて散らかりよう / tidy up=片付ける"},{"id":30,"a":"I have so many unread messages on LINE.","aJa":"LINEに未読がいっぱいだ。","b":"Read it. It feels bad to be left unread.","bJa":"読んでよ。未読のままにされるのは気分が悪いよ。","note":"unread=未読の / left unread=未読のままにされる"},{"id":31,"a":"It's tough to decide on the menu daily, right?","aJa":"毎日のメニューを決めるのって大変だよね?","b":"I feel you. They often say \"whatever!\", though.","bJa":"わかるよ。すぐに「なんでもいい」って言うけどさ。","note":"I feel you=わかるよ(共感) / whatever=なんでもいい"},{"id":32,"a":"My child has been talking back a lot lately.","aJa":"最近子どもがよく口答えするの。","b":"That's probably just a sign he's growing up.","bJa":"それだけ成長してるってことじゃない?","note":"talk back=口答えする / a sign=兆候"},{"id":33,"a":"Did you get the same pattern cushion again?","aJa":"また同じ柄のクッションを買ったの?","b":"Because I thought it would match my new chair.","bJa":"新しく買ったイスにも合うと思って。","note":"pattern=柄 / match=(色や柄が)合う"},{"id":34,"a":"How long should I put the pot on the stove for?","aJa":"火にかける時間は何分?","b":"Simmer for ten minutes on low heat.","bJa":"とろ火で10分。","note":"simmer=とろ火で煮る / low heat=弱火"},{"id":35,"a":"The bathroom is stuffy. How is the ventilation?","aJa":"浴室がこもってるよ。換気はどうなってるの?","b":"Okay. Sorry, but can you open the window a crack?","bJa":"ああ、悪いけど窓を少し開けてくれる?","note":"stuffy=空気がこもった / ventilation=換気 / a crack=少しだけ"},{"id":36,"a":"I want him to work at the office not from home, actually.","aJa":"正直、旦那は在宅じゃなくて会社で仕事してほしい。","b":"True. It just makes more chores for me.","bJa":"確かに。余計な家事が増えるのよね。","note":"work from home=在宅勤務 / chores=家事"},{"id":37,"a":"I heard a mom friend of mine got slim with supplements.","aJa":"ママ友がさ、サプリで痩せたらしいよ。","b":"I wanna get slim! But I don't like taking supplements.","bJa":"私も痩せたいけど、サプリを飲むのが苦手なんだよね。","note":"get slim=痩せる / supplements=サプリ"},{"id":38,"a":"The Impressionist exhibition is held at the Tokyo Metropolitan Art Museum now.","aJa":"今、東京都美術館で印象派展をやってるんだって。","b":"I heard! Do you want to go there together?","bJa":"知ってる!一緒に行かない?","note":"Impressionist=印象派 / exhibition=展覧会"},{"id":39,"a":"What do you think? Does this suit me?","aJa":"どう、似合う?","b":"I think the size fits you, but it might be a bit too flashy.","bJa":"サイズはいいね。でもちょっと派手かな。","note":"suit=似合う / fit=(サイズが)合う / flashy=派手な"},{"id":40,"a":"Her new song is really good. Have you listened to it yet?","aJa":"彼女の新曲はすごくいいよ。もう聴いた?","b":"Yeah, I downloaded that song from the iTunes Store too.","bJa":"うん。その曲ならiTunes Storeでダウンロードしたよ。","note":"new song=新曲 / download=ダウンロードする"},{"id":41,"a":"How do you want to get your hair cut today?","aJa":"今日はどうしますか?","b":"I'll leave it up to you. But just leave my bangs the way they are.","bJa":"お任せでお願いします。でも前髪だけはそのままにしてください。","note":"leave it up to you=お任せする / bangs=前髪"},{"id":42,"a":"You put your socks into the washing machine inside out again, didn't you?","aJa":"また靴下を裏返しのまま洗濯機に入れたね?","b":"Oh, dear. Sorry. I didn't realize. It's your pet peeve, isn't it?","bJa":"あー、ごめんね。気づかなかった。イラッとしたよね?","note":"inside out=裏返し / pet peeve=(個人的に)イラッとすること"},{"id":43,"a":"Can you tell me how to return the product I bought?","aJa":"購入品の返品方法を教えてください。","b":"Please put it in the box with the receipt, and then ship it at the post office.","bJa":"商品とレシートを一緒に箱に入れて返送してください。","note":"return=返品する / receipt=レシート / ship=発送する"}],"notes":[{"id":1,"date":"2025/9/1","en":"Theme","ja":"テーマ","note":"発音メモ: シーム（テーマ）"},{"id":2,"date":"2025/6/20","en":"crunchy","ja":"パリパリ","note":"語彙: パリパリ=crunchy"},{"id":3,"date":"2025/10/3","en":"14 million","ja":"1400万","note":"語彙メモ: ※a million＝100万"},{"id":4,"date":"2025/10/3","en":"Tactics","ja":"具体的な方法、手段","note":"語彙メモ"},{"id":5,"date":"2025/10/3","en":"Strategy","ja":"全体的な方針、戦略","note":"語彙メモ"},{"id":6,"date":"2025/6/4","en":"daughters","ja":"娘たち","note":"※発音（daughtersの発音注意）"},{"id":7,"date":"2025/6/20","en":"I'll go!","ja":"じゃあ行きます！","note":"ヒント: じゃあ行きます！=今決めた（will はその場での決定）"},{"id":8,"date":"2025/10/3","en":"a client","ja":"取引先","note":"語彙メモ: 取引先＝a client"},{"id":9,"date":"2025/11/28","en":"Common food","ja":"一般的な食べ物","note":"ヒント: common = 一般的な（語句）"},{"id":10,"date":"2026/3/6","en":"I'm married.","ja":"結婚している。","note":"状態"},{"id":11,"date":"2026/3/6","en":"I'm frustrated.","ja":"イライラしている。","note":"不満が溜まってイライラする"},{"id":12,"date":"2026/1/23","en":"compound fracture","ja":"複雑骨折","note":"語彙: 複雑骨折"},{"id":13,"date":"2026/3/6","en":"I got sick.","ja":"風邪を引いた。","note":"get＋形容詞→動作／be動詞＋形容詞→状態（動作）"},{"id":14,"date":"2026/7/18","en":"Yes, I have.","ja":"はい、あります。","note":""},{"id":15,"date":"2026/4/23","en":"He said yes.","ja":"彼は「はい」と言いました。","note":""},{"id":16,"date":"2026/1/23","en":"I'm in Nagoya.","ja":"私は名古屋にいます。","note":""},{"id":17,"date":"2026/3/6","en":"We are married.","ja":" ng down the hill again and again.","ja":"何度も繰り返し坂を滑り降りる練習をしなければなりません。","note":""},{"id":781,"date":"2026/1/23","en":"I'm thinking about whether I should tell this to my son.","ja":"これを息子に伝えるべきかどうか悩んでいます。","note":"〜するかどうか悩んでいる = whether I should 〜"},{"id":782,"date":"2026/5/29","en":"Third (Finally), I want to introduce my mentor to Mr. Chiba.","ja":"第三に(最後に)、私のメンターを千葉さんに紹介したいです。","note":""},{"id":783,"date":"2025/7/25","en":"You have to practice a lot to become a national champion.","ja":"全国チャンピオンになるにはたくさん練習しなければなりません。","note":""},{"id":784,"date":"2025/12/5","en":"We have to keep receipts and order forms for seven years.","ja":"領収書と注文書は7年間保管しなければなりません。","note":""},{"id":785,"date":"2026/2/26","en":"He said that he needed the money for a surgery(operation).","ja":"彼は手術のためにそのお金が必要だと言いました。","note":"surgery/operation＝手術"},{"id":786,"date":"2026/2/26","en":"The money I lent was not updated(recorded) in his bankbook.","ja":"貸したお金が彼の通帳に記入されていませんでした。","note":"貸したお金が通帳に記入されていなかった"},{"id":787,"date":"2025/6/20","en":"He's going to join a triathlon race in Gamagori on Sunday.","ja":"彼は日曜日に蒲郡のトライアスロン大会に参加する予定です。","note":""},{"id":788,"date":"2026/3/12","en":"The house was already renovated, so all the rooms look new.","ja":"その家はすでにリノベーション済みなので、部屋は全部新しく見えます。","note":""},{"id":789,"date":"2026/3/12","en":"The number of people who live on the street is increasing.","ja":"路上で生活する人の数が増えています。","note":"the number of ~＝~の数（単数扱い）／who＝関係代名詞（原文で下線）"},{"id":790,"date":"2025/11/28","en":"In general, people don't buy bone-in meat at a supermarket.","ja":"一般的には、人々はスーパーで骨付き肉を買いません。","note":"ヒント: 一般的には = in general"},{"id":791,"date":"2025/7/25","en":"You have to practice a lot to win a national championship.","ja":"全国選手権で優勝するにはたくさん練習しなければなりません。","note":""},{"id":792,"date":"2025/12/12","en":"I think that business partners have to share the same goal.","ja":"ビジネスパートナーは同じ目標を共有しなければならないと思います。","note":""},{"id":793,"date":"2026/4/16","en":"These earrings were made 30 years ago. They are kind of a im faster. This is my goal this time.","ja":"第二に、もっと速く泳ぎたいです。これが今回の目標です。","note":""},{"id":820,"date":"2026/3/12","en":"It (=the house) was built 40 years ago. = The house is 40 years old.","ja":"その家は40年前に建てられました（＝築40年です）。","note":"建てられた＝受動態"},{"id":821,"date":"2025/10/31","en":"She has to sell her second house her father told her to.","ja":"彼女は父親に言われたので、セカンドハウスを売らなければなりません。","note":"原文ママ（She has to sell her second house because her father told her to. の意と思われる）"},{"id":822,"date":"2026/7/24","en":"I went cycling for 50 km, running for 10 km, and swimming for 1,000 m.","ja":"50キロのサイクリング、10キロのランニング、1,000メートルの水泳をしました。","note":"go ~ing for 距離"},{"id":823,"date":"2025/6/11","en":"I told him that the taxi was coming in about ten minutes.","ja":"タクシーが10分ほどで来ると彼に伝えました。","note":"時制の一致"},{"id":824,"date":"2026/4/23","en":"I do strength training twice a week. (I work out every day)","ja":"週2回筋トレをします。(毎日運動します)","note":"strength training=筋トレ / twice a week=週2回"},{"id":825,"date":"2026/6/4","en":"Long time ago, I drove to Kagoshima alone. It was about 900 km.","ja":"ずっと前、一人で鹿児島まで運転しました。約900キロでした。","note":""},{"id":826,"date":"2025/9/1","en":"Mr. Fujimura said he wanted to go out for a drink together.","ja":"藤村さんは、一緒に飲みに行きたいと言いました。","note":""},{"id":827,"date":"2025/12/12","en":"He wants to dominate 30% of the market. This is a good balance.","ja":"彼は市場の30％を占めたいと考えています。これは良いバランスです。","note":""},{"id":828,"date":"2025/6/4","en":"What is the first thing to learn? (What should I learn first?)","ja":"最初に学ぶべきことは何ですか？","note":"括弧内は言い換え表現"},{"id":829,"date":"2026/2/6","en":"We cannot buy guts anymore. They are sold out in the market.","ja":"もうホルモン（内臓肉）が買えません。市場で売り切れています。","note":"guts＝内臓肉・ホルモン"},{"id":830,"date":"2026/5/14","en":"I told her that I would prepare special food for her child.","ja":"彼女の子どものために特別な食事を用意すると伝えました。","note":"prepare=準備する"},{"id":831,"date":"2026/1/16","en":"They want profits, but I want them to be helpful for clients.","ja":"彼らは利益を求めますが、私は彼らにお客様の役に立ってほしいのです。","note":""},{"id":832,"date":"2026/2/20","en":"He said AI would develop more quickly in the next two years.","ja":"彼は、AIは今後2年でさらに急速に発展するだろうと言いました。","note":"時制の一致（will→would）"},{"id":833,"date":"2026/5/14","en":"He might have a problem with his bladder because of his DNA.","ja":"彼は遺伝のせいで膀胱に問題があるかもしれません。","note":"bladder=膀胱 / 原文の my は his が正しい"},{"id":834,"date":"2025/12/12","en":"I want to develop my employees. This is very important to me.","ja":"私は従業員を育てたいです。これは私にとってとても大切なことです。","note":"画像内ヒント：人を育てる（develop my employees）"},{"id":835,"date":"2025/10/10","en":"Mr. Komaki came to Gamagori by Porsche and Daiki saw it there.","ja":"小牧さんはポルシェで蒲郡に来て、ダイキはそこでそれを見ました。","note":"原文の Porshe は Porsche のタイプミスを修正"},{"id":836,"date":"2025/11/21","en":"Mr. Komaki came to Gamagori by Porsche and Daiki saw it there.","ja":"小牧さんはポルシェで蒲郡に来て、ダイキはそこでそれを見ました。","note":"原文の Porshe は Porsche のタイプミス"},{"id":837,"date":"2025/11/28","en":"Mr. Komaki came to Gamagori by Porsche and Daiki saw it there.","ja":"小牧さんはポルシェで蒲郡に来て、大輝はそこでそれを見ました。","note":"原文の Porshe は Porsche の誤記を修正"},{"id":838,"date":"2026/2/26","en":"I think it's too late to start studying for an entrance exam.","ja":"入試の勉強を始めるには遅すぎると思います。","note":"■ダイキくんの話／entrance exam＝入試"},{"id":839,"date":"2026/4/2","en":"She was so cute that I couldn't stop buying presents for her.","ja":"あまりに可愛かったので、プレゼントを買うのを止められませんでした。","note":"so ~ that …構文／stop ~ing＝~するのをやめる"},{"id":840,"date":"2026/7/2","en":"He tried to hit fast balls and ended up making many mistakes.","ja":"速いボールを打とうとして、結局多くのミスをしてしまいました。","note":"end up ~ing=結局~になる"},{"id":841,"date":"2025/7/25","en":"People shouldn't be afraid to stop and look back at the past.","ja":"人は立ち止まって過去を振り返ることを恐れるべきではありません。","note":"セクション: ■過去を振り返ることを恐れない"},{"id":842,"date":"2026/2/6","en":"I created a menu idea for duck prosciutto soaked in red wine.","ja":"赤ワインに漬けた鴨の生ハムのメニュー案を作りました。","note":"原文は文末のピリオドなし（補った）"},{"id":843,"date":"2026/3/6","en":"My client came to the restaurant before he decided to buy it.","ja":"顧客は購入を決める前にそのレストランに来ました。","note":"訂正：went→came、when→before"},{"id":844,"date":"2026/6/4","en":"Also, I want to learn about the history and eat Kitakata ramen.","ja":"また、歴史を学び、喜多方ラーメンを食べたいです。","note":"原文: lean は learn の打ち間違い"},{"id":845,"date":"2026/5/29","en":"First, I can show a good example for my children and employees.","ja":"第一に、子どもたちや従業員に良い手本を示すことができます。","note":""},{"id":846,"date":"2025/10/10","en":"I changed my mind, and I'll try to manage the restaurant again.","ja":"私は考えを変えて、もう一度レストランの経営に挑戦するつもりです。","note":"change one's mind = 考えを変える"},{"id":847,"date":"2025/11/21","en":"I changed my mind, and I'll try to manage the restaurant again.","ja":"考えを変えて、もう一度レストランの経営に挑戦するつもりです。","note":""},{"id":848,"date":"2025/11/28","en":"I changed my mind, and I'll try to manage the restaurant again.","ja":"気が変わって、もう一度レストランの経営を頑張ってみるつもりです。","note":"change one's mind＝気が変わる"},{"id":849,"date":"2026/4/9","en":"The park has an athletic area. We will also enjoy drinking sake.","ja":"公園にはアスレチックエリアがあります。日本酒も楽しむつもりです。","note":""},{"id":850,"date":"2026/2/20","en":"We cannot decide which junior-high school he(Daiki) should go to.","ja":"彼（ダイキくん）がどの中学に行くべきか決められません。","note":"Private school / Public school"},{"id":851,"date":"2025/7/4","en":"How many times have you joined a triathlon race? More than 100 times.","ja":"トライアスロンの大会には何回出たことがありますか。― 100回以上です。","note":""},{"id":852,"date":"2026/1/9","en":"I studied English for an hour every day during a winter vacation.","ja":"冬休みの間、毎日1時間英語を勉強しました。","note":""},{"id":853,"date":"2026/4/23","en":"I am studying English. / I have been studying English for two years.","ja":"今、英語を勉強しています。/2年間ずっと英語を勉強し続けています。","note":"現在完了進行形=継続"},{"id":854,"date":"2026/3/6","en":"I'm going to join a marathon race with my employees this weekend.","ja":"今週末、従業員と一緒にマラソン大会に参加する予定です。","note":"be going to＝決まった未来"},{"id":855,"date":"2026/4/23","en":"beautiful flowers / run fast / get up early / I study English every day.","ja":"(文法メモ)形容詞は名詞を説明、副詞は名詞以外(主に動詞)を説明します。","note":"品詞: る"},{"id":879,"date":"2025/10/31","en":"I asked Mr. Fujimura to help my friend who has a second house.","ja":"私は、セカンドハウスを持っている友人を助けてくれるよう藤村さんに頼みました。","note":"この後に見出し「■伝えたいことを最初に伝えて、簡単に文を繋げる方法」があるが、その内容は画面下で切れており読めない"},{"id":880,"date":"2026/4/2","en":"My accountant said that you would have to pay a lot of taxes.","ja":"税理士は「あなたはたくさん税金を払わないといけませんよ」と言いました。","note":"間接話法なら I would have to pay とするのが自然"},{"id":881,"date":"2026/3/19","en":"If we don't solve (deal with) the problem now, it will get worse.","ja":"もし今その問題を解決（対処）しないと、もっと悪くなります。","note":"solve＝解決する／deal with＝対処する"},{"id":882,"date":"2026/4/16","en":"There was a flea market there and we bought a lot of stickers.","ja":"フリーマーケットがあって、ステッカーをたくさん買いました。","note":"flea market=フリーマーケット"},{"id":883,"date":"2026/1/23","en":"We are going to have breakfast and listen to English in a car.","ja":"車の中で朝食をとり、英語を聞く予定です。","note":"(I'm thinking of having breakfast in a car.)"},{"id":884,"date":"2025/6/20","en":"Okinawa has changed into an urban city, so I miss good old days.","ja":"沖縄は都会に変わってしまったので、古き良き時代が恋しいです。","note":""},{"id":885,"date":"2026/2/20","en":"If children cannot use AI system, they will not be able to work.","ja":"子どもたちがAIシステムを使えなければ、働けなくなるでしょう。","note":""},{"id":886,"date":"2026/4/2","en":"She came to my company with her daughter, and she was very cute.","ja":"彼女は娘を連れて会社に来ました。その子はとても可愛かったです。","note":""},{"id":887,"date":"2026/5/29","en":"I'm a CEO and a parent. My employees are trying many new things.","ja":"私は経営者であり親でもあります。従業員は多くの新しいことに挑戦しています。","note":""},{"id":888,"date":"2026/4/16","en":"I asked a fortune teller when and where I should build my house.","ja":"占い師に、いつ・どこに家を建てるべきか尋ねました。","note":"fortune teller=占い師 / 間接疑問文"},{"id":889,"date":"2026/2/6","en":"I always consider what to do. (=I always consider what I should do)","ja":"私はいつも何をすべきかを考えています。","note":"what to do = what I should do"},{"id":890,"date":"2026/2/20","en":"If children cannot use AI systems, they will not be able to work.","ja":"子どもたちはAIシステムを使えな  scenery.","ja":"親切な人が多く、自然や美しい景色もたくさんあります。","note":""},{"id":903,"date":"2026/7/18","en":"I haven't done a triathlon yet. (I haven't joined a triathlon race yet.)","ja":"まだトライアスロンをやったことがありません（大会に出たことがありません）。","note":"原文 \"done Triathlon\" の大文字・冠詞を修正"},{"id":904,"date":"2026/1/9","en":"There were no good restaurants, so we went to McDonald's for two days.","ja":"良いレストランがなかったので、2日間マクドナルドに行きました。","note":"原文 \"McDonald\" → McDonald's に修正"},{"id":905,"date":"2026/2/26","en":"I'm happy when my phone starts ringing, and I never forget that moment.","ja":"電話が鳴り始めるとうれしくて、その瞬間を決して忘れません。","note":""},{"id":906,"date":"2025/8/1","en":"I'm riding a bike by myself tomorrow. (I'm riding a bike alone tomorrow.)","ja":"明日は一人で自転車に乗ります。","note":"用法③"},{"id":907,"date":"2025/10/31","en":"I was very tired because my younger daughter walked around all the time.","ja":"下の娘がずっと歩き回っていたので、私はとても疲れました。","note":""},{"id":908,"date":"2025/6/11","en":"My restaurant has been selected as one of the 100 top restaurants on Tabelog.","ja":"私のレストランは食べログの百名店（トップ100）に選ばれました。","note":"現在完了の受動態"},{"id":909,"date":"2026/1/23","en":"I want to practice speaking because I think speaking is the most important.","ja":"スピーキングが一番大切だと思うので、スピーキングを練習したいです。","note":""},{"id":910,"date":"2025/6/4","en":"It has 160 episodes. Foreign people are not very interested in My Hero Academia.","ja":"全部で160話あります。外国の人は『僕のヒーローアカデミア』にはあまり興味がありません。","note":""},{"id":911,"date":"2026/1/16","en":"I was shocked (disappointed) because it seems like my employees are not developing.","ja":"従業員が成長していないように思えて、ショックでした（がっかりしました）。","note":""},{"id":912,"date":"2025/11/14","en":"I don't think he can be me, but I want him to decide faster.","ja":"彼が私の代わりになれるとは思いませんが、もっと早く決断してほしいと思っています。","note":""},{"id":913,"date":"2026/4/9","en":"We are going to stay there for two nights from May 4th to 6th.","ja":"5月4日から6日まで、そこに2泊する予定です。","note":""},{"id":914,"date":"2026/1/9","en":"We were also with our dog, so it was hard to find a restaurant.","ja":"犬も一緒だったので、レストランを見つけるのが大変でした。","note":""},{"id":915,"date":"2026/5/29","en":"There are many places where you don't have to use a lot of money.","ja":"お金をあまり使わなくてもよい場所はたくさんあります。","note":"関係副詞where"},{"id":916,"date":"2026/4/2","en":"As you know, I have been studying English on an app for two years.","ja":"ご存じの通り、私はアプリで2年間英語を勉強し続けています。","note":"現在完了進行形"},{"id":917,"date":"2026/2/6","en":"So Japanese people will not be able to eat them in the near future.","ja":"そのため近い将来、日本人はそれらを食べられなくなるでしょう。","note":""},{"id":918,"date":"2026/5/29","en":"She is a very active girl. She started riding a bicycle when she was 2.","ja":"彼女はとても活発な女の子です。2歳で自転車に乗り始めました。","note":""},{"id":919,"date":"2026/4/23","en":"A pack had nice strawberries, and it was 350 yen, so I bought eight packs.","ja":"1パックに良いイチゴが入って350円だったので、8パック買いました。","note":""},{"id":920,"date":"2025/10/3","en":"A board member from the bank is going to visit my company on October 23.","ja":"10月23日に、銀行の役員が私の会社を訪問する予定です。","note":""},{"id":921,"date":"2026/6/4","en":"Instead, I'm going to ask a shoe fitter to choose his shoes this time.","ja":"代わりに、今回はシューフィッターに靴を選んでもらうつもりです。","note":""},{"id":922,"date":"2025/6/11","en":"There were no cars on the streets. / No cars were driving on the streets.","ja":"通りには車が一台も走っていませんでした。","note":"2通りの言い方"},{"id":923,"date":"2026/7/24","en":"I made a textbook for myself using the lesson notes from the past year.","ja":"この1年分のレッスンノートを使って、自分用のテキストを作りました。","note":""},{"id":924,"date":"2026/2/26","en":"I asked him how many new customers you got this month. He answered, \"Zero\".","ja":"今月何人の新規顧客を獲得したのか彼に尋ねました。彼は「ゼロ」と答えました。","note":"間接疑問では how many new customers he got が自然"},{"id":925,"date":"2025/11/14","en":"My brain is really tired because I had to make many decisions this week.","ja":"今週はたくさんの決断をしなければならなかったので、頭が本当に疲れています。","note":""},{"id":926,"date":"2026/7/2","en":"The reason they support the team is to get a return on their investment.","ja":"彼らがチームを支援する理由は、投資のリターンを得るためです。","note":""},{"id":927,"date":"2025/10/10","en":"My employees and my business partner said the same thing on the same day.","ja":"従業員とビジネスパートナーが同じ日に同じことを言いました。","note":""},{"id":928,"date":"2025/11/21","en":"My employees and my business partner said the same thing on the same day.","ja":"従業員とビジネスパートナーが同じ日に同じことを言いました。","note":""},{"id":929,"date":"2025/11/28","en":"My employees and my business partner said the same thing on the same day.","ja":"従業員と共同経営者が同じ日に同じことを言いました。","note":""},{"id":930,"date":"2025/12/5","en":"I only want to sell prosciutto to stores (that) we already do business with.","ja":"すでに取引のある店だけに生ハムを売りたいです。","note":"すでに取引のある店だけに売りたい。関係代名詞that（省略可）＋前置詞withの位置に注意（下線部）"},{"id":931,"date":"2025/7/25","en":"If you have this qualification, you can get a lot of offers from companies.","ja":"この資格を持っていれば、企業からたくさんのオファーをもらえます。","note":"セクション: ■資格"},{"id":932,"date":"2025/12/23","en":"He can see the difference between people who improve and people who do not.","ja":"彼には、伸びる人と伸びない人の違いが分かります。","note":""},{"id":933,"date":"2025/10/31","en":"I suggested that I could keep her second house until her father passes away.","ja":"彼女の父親が亡くなるまで、私がそのセカンドハウスを預かってもいいと提案しました。","note":""},{"id":934,"date":"2026/1/16","en":"But my hands got rough because I used strong detergent to clean dirty spots.","ja":"でも、汚れた箇所を落とすのに強い洗剤を使ったので、手が荒れてしまいました。","note":""},{"id":935,"date":"2026/4/9","en":"On the final day, we are going to visit vegetable fields to harvest vegetables.","ja":"最終日は野菜畑を訪れて野菜の収穫をします。","note":"harvest=収穫する"},{"id":936,"date":"2026/4/23","en":"Which do you want to start with, talking about your weekend or studying grammar?","ja":"週末の話と文法の勉強、どちらから始めたいですか?","note":"start with=~から始める"},{"id":937,"date":"2025/6/20","en":"I went to Okinawa to research about local people and tourists on Kokusai Street.","ja":"国際通りの地元の人と観光客について調査するために沖縄に行きました。","note":""},{"id":938,"date":"2025/12/23","en":"Last Friday, I had Yakiniku with Mr. Chiba, and we talked about children's education.","ja":"先週の金曜日、千葉さんと焼肉を食べて、子どもの教育について話しました。","note":""},{"id":939,"date":"2026/6/4","en":"The shoe fitter has a national qualification to choose the right shoes for customers.","ja":"そのシューフィッターは、お客に合った靴を選ぶ国家資格を持っています。","note":""},{"id":940,"date":"2026/2/20","en":"He has to choose between playing tennis or studying for private school entrance exams.","ja":"彼はテニスをするか、私立中学の受験勉強をするかを選ばなければなりません。","note":"テニスの時間を減らしていかないといけない→〜を選ばないといけない"},{"id":941,"date":"2026/2/6","en":"Before Covid-19, they didn't eat guts, but foreign people have realized they are delicious.","ja":"コロナ前は彼らはホルモンを食べませんでしたが、外国の人々はそのおいしさに気づいてしまいました。","note":""},{"id":942,"date":"2026/2/20","en":"He has to choose between playing tennis or studying for private schools entrance exams.","ja":"彼はテニスをするか私立中学の受験勉強をするかを選ばなければなりません。","note":"テニスの時間を減らしていかないといけない→〜を選ばないといけない"},{"id":943,"date":"2025/10/31","en":"I have many books. / I have a lot of money. (I have lots of money.)","ja":"私はたくさんの本を持っています。／私はたくさんのお金を持っています。","note":"※a lot of booksもOK。可算名詞は many、a lot of は両方に使える"},{"id":944,"date":"2025/10/10","en":"My kids do their best every day, so I decided to buy it for him.","ja":"子どもたちは毎日がんばっているので、彼にそれを買ってあげることにしました。","note":"ヒント: 原因→結果（so で結果を後置）"},{"id":945,"date":"2025/11/21","en":"My kids do their best every day, so I decided to buy it for him.","ja":"子どもたちは毎日がんばっているので、彼にそれを買ってあげることにしました。","note":"原因→結果の語順"},{"id":946,"date":"2025/11/28","en":"My kids do their best every day, so I decided to buy it for him.","ja":"子どもたちは毎日一生懸命頑張っているので、彼にそれを買ってあげることにしました。","note":"原因→結果（so で結果を続ける）"},{"id":947,"date":"2025/6/20","en":"My son met him three months ago, so he is going to cheer for him.","ja":"息子は3か月前に彼に会ったので、彼を応援するつもりです。","note":""},{"id":948,"date":"2026/6/4","en":"Is your wife always okay if you want to go on a trip by yourself?","ja":"一人で旅行に行きたいとき、奥さんはいつも大丈夫なのですか?","note":""},{"id":949,"date":"2026/7/2","en":"It seems like I hurt my knee because I was moving my legs too fast.","ja":"脚を速く動かしすぎたせいで膝を痛めたようです。","note":"It seems like ~=~のようだ"},{"id":950,"date":"2025/9/1","en":"You can catch up on the bike and run after falling behind in the swim.","ja":"スイムで遅れても、バイクとランで遅れを取り戻せます。","note":"ヒント: 遅れを取り戻せる"},{"id":951,"date":"2026/5/29","en":"I went to a bicycle shop to see some bikes, but they were too expensive.","ja":"自転車を見に自転車店へ行きましたが、高すぎました。","note":""},{"id":952,"date":"2025/10/3","en":"Mr. Fujimura is a realtor, so he is going to help me sell the restaurant.","ja":"藤村さんは不動産業者なので、レストランの売却を手伝ってくれる予定です。","note":"ヒント: ※realtor＝不動産屋さん"},{"id":953,"date":"2025/10/10","en":"Mr. Fujimura said to me, \"I wish you would choose the best choices for you.\"","ja":"藤村さんは私に「あなたにとって最善の選択をしてほしいと思います」と言いました。","note":"I wish + 仮定法。choose the best choices はやや重複した表現（原文のまま）"},{"id":954,"date":"2025/11/21","en":"Mr. Fujimura said to me, \"I wish you would choose the best choices for you.\"","ja":"藤村さんは私に「あなたにとって最善の選択をしてくれたらと思います」と言いました。","note":"I wish + 仮定法"},{"id":955,"date":"2025/11/28","en":"Mr. Fujimura said to me, \"I wish you would choose the best choices for you.\"","ja":"藤村さんは私に「あなたにとって一番良い選択をしてほしいと思っています」と言いました。","note":"I wish + would の願望表現"},{"id":956,"date":"2026/1/16","en":"A: I'll take a cappuccino. B: What size would you like? - Small, medium or large.","ja":"A: カプチーノをお願いします。 B: サイズはいかがなさいますか？ スモール、ミディアム、ラージがございます。","note":""},{"id":957,"date":"2025/6/11","en":"Akita was the best because people in Akita are kind and the food was great.","ja":"秋田の人は親切で食べ物もおいしかったので、秋田が一番でした。","note":""},{"id":958,"date":"2026/5/29","en":"Also, the bicycle was too big, so she couldn't reach the ground with her feet.","ja":"また、自転車が大きすぎて、彼女の足が地面に届きませんでした。","note":""},{"id":959,"date":"2026/3/12","en":"I was going to renovate my house because this house is small for five people.","ja":"この家は5人には狭いので、家をリノベーションするつもりでした。","note":"was going to ~＝~するはずだった"},{"id":960,"date":"2026/2/20","en":"I should ask another company to create the app, but the price is too expensive.","ja":"別の会社にアプリの開発を頼むべきですが、価格が高すぎます。","note":""},{"id":961,"date":"2025/11/14","en":"He wants to educate younger employees because this is a good way to boost sales.","ja":"彼は若手の従業員を教育したいと思っています。それが売上を伸ばす良い方法だからです。","note":""},{"id":962,"date":"2026/3/12","en":"She is happy about moving because she doesn't want to say goodbye to her friends.","ja":"彼女は友達とお別れしたくないので、引っ越しのことを喜んでいます。","note":"文脈的には not happy（引っ越しを喜んでいない）の可能性あり。原文のまま transcribe"},{"id":963,"date":"2026/5/29","en":"I studied English for an hour a day this week, and especially I practiced speaking.","ja":"今週は1日1時間英語を勉強し、特にスピーキングを練習しました。","note":"原文の Ipracticed は I practiced"},{"id":964,"date":"2025/12/5","en":"I guess it will be about two years until we cannot import prosciutto from Portugal.","ja":"ポルトガルから生ハムを輸入できなくなるまで、あと2年くらいだと思います。","note":""},{"id":965,"date":"2026/1/16","en":"A: What options do you have? B: We have espresso, cappuccino, latte, Americano, and mocha.","ja":"A: どんな種類がありますか？ B: エスプレッソ、カプチーノ、ラテ、アメリカーノ、モカがございます。","note":"原文では \"A americano\" と行の折り返しで表記が乱れている"},{"id":966,"date":"2026/6/4","en":"I want to talk with local people, so I'm thinking of visiting local Izakaya restaurants.","ja":"地元の人と話したいので、地元の居酒屋を訪れようと考えています。","note":""},{"id":967,"date":"2025/10/10","en":"The most important thing is the atmosphere of the restaurant, and workers make the atmosphere.","ja":"最も大切なのはレストランの雰囲気であり、その雰囲気は働く人たちが作ります。","note":""},{"id":968,"date":"2025/11/21","en":"The most important thing is the atmosphere of the restaurant, and workers make the atmosphere.","ja":"最も大切なのはレストランの雰囲気であり、その雰囲気を作るのは働く人たちです。","note":"同じ文書の最終ページ（IMG_0620は同内容の重複）"},{"id":969,"date":"2025/11/28","en":"The most important thing is the atmosphere of the restaurant, and workers make the atmosphere.","ja":"一番大切なのはレストランの雰囲気であり、その雰囲気を作るのは働く人たちです。","note":"同じPDFの2ページ目"},{"id":970,"date":"2026/4/2","en":"The lessons are getting more difficult because the words (vocabulary) are getting more difficult (advanced).","ja":"単語（語彙）がどんどん難しく（高度に）なっているので、レッスンも難しくなってきています。","note":"・今度の目標と道筋：ストーリーの組み立て方（起承転結）を英語でも日本語でもできるようにする／自分のできる範囲の言葉で説明する力をつける＝スラスラ話す練習／簡単な話をスラスラ話すことに加えて、難しめの単語や文法を少しずつ組み込んでいく練習をする"},{"id":971,"date":"2025/6/4","en":"Have a nice trip! Thank you! I will. (Have a nice day! Thank you! You too!)","ja":"良い旅を！ ありがとう、そうします。（良い一日を！ ありがとう、あなたもね！）","note":"Have a nice trip! への返答は I will.、Have a nice day! への返答は You too!"},{"id":972,"date":"2025/8/1","en":"We watched a movie once a month. (I used to watch a movie once a month.)","ja":"私たちは月に1回映画を見ていました。（以前は月に1回映画を見ていたものです。）","note":"用法②（used to の言い換え例つき）"},{"id":973,"date":"2026/7/19","en":"We watched a movie once a month. (I used to watch a movie once a month)","ja":"私たちは月に一度映画を見ていました。（used to でも表現可能）","note":"過去の習慣。used to の言い換え例付き。"},{"id":974,"date":"2025/11/14","en":"There is a saying: You should have a fish-eye view. A fish-eye view means ….","ja":"「魚の目を持つべきだ」ということわざがあります。魚の目とは……という意味です。","note":"文は途中で終わっている（A fish-eye view means ….）"},{"id":975,"date":"2025/10/10","en":"Daiki asked me to buy a LEGO car because he wanted to get a Porsche car.","ja":"ダイキはポルシェの車が欲しかったので、私にレゴの車を買ってほしいと頼みました。","note":"ヒント: 結果→原因（because で理由を後置）"},{"id":976,"date":"2025/11/21","en":"Daiki asked me to buy a LEGO car because he wanted to get a Porsche car.","ja":"ダイキはポルシェの車が欲しかったので、私にレゴの車を買ってほしいと頼みました。","note":"日付不明の別文書（画像に日付なし、2025/11/14の次のレッスンと推定）。結果→原因の語順"},{"id":977,"date":"2025/11/28","en":"Daiki asked me to buy a LEGO car because he wanted to get a Porsche car.","ja":"大輝はポルシェの車が欲しかったので、私にレゴの車を買ってほしいと頼みました。","note":"結果→原因（because で理由を後置）"},{"id":978,"date":"2025/10/10","en":"I also said to him, \"I haven't met the new chef. I haven't tried his dishes.\"","ja":"私はまた彼に「新しいシェフにはまだ会っていません。彼の料理もまだ食べていません」と言いました。","note":"現在完了（経験・完了）の否定"},{"id":979,"date":"2025/11/21","en":"I also said to him, \"I haven't met the new chef. I haven't tried his dishes.\"","ja":"私はまた彼に「新しいシェフにはまだ会っていません。彼の料理もまだ食べていません」と言いました。","note":"現在完了（経験・完了）"},{"id":980,"date":"2025/11/28","en":"I also said to him, \"I haven't met the new chef. I haven't tried his dishes.\"","ja":"私はまた彼に「新しいシェフにはまだ会っていないし、彼の料理も食べたことがありません」と言いました。","note":"現在完了（経験・完了）の否定"},{"id":981,"date":"2025/6/11","en":"I started studying English one year ago, but I was not sure if I was right.","ja":"1年前に英語の勉強を始めましたが、自分が正しいのか確信が持てませんでした。","note":""},{"id":982,"date":"2026/5/29","en":"Two weeks ago, Mr. Chiba said it cost too much to travel around Japan for races.","ja":"2週間前、千葉さんはレースのために日本中を回るのは費用がかかりすぎると言っていました。","note":""},{"id":983,"date":"2025/11/14","en":"I have a person (who) I respect. He told me I should study the Japanese language.","ja":"私には尊敬する人がいます。彼は私に日本語を勉強すべきだと言いました。","note":"別の言い方: もしくは、A person (who) I respect told me…（目的格の関係代名詞 who は省略可）"},{"id":984,"date":"2026/6/4","en":"On the second day, I will go to Tsuruga castle in Fukushima and go jogging there.","ja":"2日目は福島の鶴ヶ城へ行き、そこでジョギングをします。","note":""},{"id":985,"date":"2026/3/6","en":"We will get married next year. / We are going to get married. / We are getting married.","ja":"私たちは来年結婚します。","note":"will／be going to／現在進行形による未来表現の比較"},{"id":986,"date":"2026/5/14","en":"I think it's good for her to share (=talk about) her worries (=concerns) with other people.","ja":"彼女は悩み(=心配事)を他の人と共有するのが良いと思います。","note":"悩み=心配事 / share=talk about"},{"id":987,"date":"2026/6/4","en":"I want to see towns there because Tsunami and earthquakes destroyed a lot of towns in 2011.","ja":"2011年に津波と地震が多くの町を破壊したので、そこの町々を見たいのです。","note":""},{"id":988,"date":"2025/12/23","en":"He believes that it is important to use a 10% carrot and 90% stick approach when teaching children.","ja":"彼は、子どもを教えるときは飴1割・鞭9割のやり方が大事だと考えています。","note":"飴と鞭は英語では人参と鞭（carrot and stick）にすることが多い（馬の例え）"},{"id":989,"date":"2026/2/20","en":"We cannot decide which junior-high school he (Daiki) should go to. Private school / Public school","ja":"彼（大輝）がどの中学校に進むべきか、私たちは決められません。私立か公立か。","note":""},{"id":990,"date":"2025/7/25","en":"Working long hours is considered a part of Japanese values, but it doesn't improve the productivity.","ja":"長時間働くことは日本の価値観の一部と考えられていますが、それで生産性が上がるわけではありません。","note":"セクション: ■日本の美学＝価値 / 原文の \"Woking\" は \"Working\" の誤記と判断し修正"},{"id":991,"date":"2025/10/3","en":"He is going to lose his job, and he doesn't know what he wants to do(learn).","ja":"彼は仕事を失うことになりますが、自分が何をしたい（学びたい）のか分かっていません。","note":""},{"id":992,"date":"2026/4/9","en":"On the first day, we're going to a big park. There are a lot of flowers there.","ja":"初日は大きな公園に行きます。そこにはたくさんの花があります。","note":""},{"id":993,"date":"2026/7/2","en":"I think I put too much pressure on my knees. That's why I hurt my right knee.","ja":"膝に負担をかけすぎたのだと思います。だから右膝を痛めたのです。","note":"That's why ~=だから~"},{"id":994,"date":"2025/10/31","en":"My friend, who has a second house, asked me, \"Do you want to have a second house?\"","ja":"セカンドハウスを持っている友人が、私に「セカンドハウスを持ちたい？」と尋ねました。","note":"非制限用法の関係代名詞（My friend, who ～,）。原文では下線付きで強調"},{"id":995,"date":"2026/4/2","en":"I saw your Instagram, so I told her about it. Now, she really wants to go there.","ja":"あなたのインスタを見たので、妻にそのことを伝えました。今、彼女はとても行きたがっています。","note":""},{"id":996,"date":"2026/2/20","en":"Even if he goes to a private school, it is hard to catch up with other students.","ja":"たとえ私立に行ったとしても、他の生徒に追いつくのは大変です。","note":"even if＝例え〜だとしても（原文の iwht は with のタイポ）"},{"id":997,"date":"2026/1/9","en":"There is an animal park in an amusement park. = The amusement park has an animal park inside.","ja":"遊園地の中に動物パークがあります。（＝その遊園地の中には動物パークがあります。）","note":"There is 構文の言い換え"},{"id":998,"date":"2026/1/9","en":"For example, I watched movies, I listened to English while (I was) running, I studied with apps.","ja":"例えば、映画を見たり、走りながら英語を聞いたり、アプリで勉強したりしました。","note":""},{"id":999,"date":"2026/4/9","en":"I want my children to visit a winery and rice fields and experience important things by themselves.","ja":"子どもたちにはワイナリーや田んぼを訪れて、大切なことを自分自身で体験してほしいです。","note":"by themselves=自分たちで"},{"id":1000,"date":"2025/12/12","en":"We have to restore the restaurant to its original condition. This is the standard rule for restaurants.","ja":"私たちはレストランを元の状態に戻さなければなりません。これはレストランの標準的なルールです。","note":"画像内ヒント：レストランを元の状態に戻す（restore ... to its original condition）"},{"id":1001,"date":"2025/6/11","en":"At first, I was watching English channels for beginners, but I am getting to understand longer sentences.","ja":"最初は初心者向けの英語チャンネルを見ていましたが、より長い文が理解できるようになってきました。","note":""},{"id":1002,"date":"2026/1/16","en":"A: Hi! I'd like to order a coffee, please. B: Sure! What kind of coffee would you like?","ja":"A: こんにちは！コーヒーを注文したいのですが。 B: かしこまりました！どんなコーヒーになさいますか？","note":"■YouTube(@better talk English)〈Ordering coffee at a cafe〉／原文の \"I'm like to order a coffee, please?\" は \"I'd like to order a coffee, please.\" の誤り"},{"id":1003,"date":"2025/6/20","en":"I don't know what to say. Have a good night! / Have a nice weekend! See you next week.","ja":"何と言えばいいか分かりません。おやすみなさい！／良い週末を！ また来週。","note":"what to say = 何と言うべきか"},{"id":1004,"date":"2026/2/6","en":"There are many kinds of meat in Japan, but there is no meat in the market this week.","ja":"日本にはいろいろな種類の肉がありますが、今週は市場に肉がありません。","note":""},{"id":1005,"date":"2025/10/31","en":"It takes about an hour and a half by car. There are many tea fields around the house.","ja":"車で約1時間半かかります。家の周りにはたくさんの茶畑があります。","note":""},{"id":1006,"date":"2026/2/20","en":"I went out for a drink with one of my friends. He is a professor at Nagoya University.","ja":"友人の一人と飲みに行きました。彼は名古屋大学の教授です。","note":""},{"id":1007,"date":"2026/7/18","en":"I went to a swimming pool, but it was closed, so instead (of swimming), I went for jogging.","ja":"プールに行ったのですが、閉まっていたので、その代わりにジョギングに行きました。","note":"instead (of ～)＝（～の）代わりに。went jogging とも言える"},{"id":1008,"date":"2026/2/20","en":"He is not studying enough. He has no time to study. He doesn't have enough time to study.","ja":"彼は十分に勉強していません。勉強する時間がないのです。勉強する時間が足りません。","note":"原文の \"He doesn't enough time to study.\" は \"He doesn't have enough time to study.\" の誤り"},{"id":1009,"date":"2026/1/23","en":"We are thinking of staying there about six hours. Of course, we are going to take a break.","ja":"そこに6時間ほど滞在しようと考えています。もちろん休憩も取る予定です。","note":""},{"id":1010,"date":"2026/1/23","en":"We have to practice going down the hill again and again. We are going to practice parallel skiing.","ja":"何度も繰り返し斜面を下りる練習をしなければなりません。パラレルスキーの練習をする予定です。","note":""},{"id":1011,"date":"2026/4/16","en":"The side stories of Conan are boring because those stories don't connect to the main story of Conan.","ja":"コナンのサイドストーリーは本編とつながらないので退屈です。","note":""},{"id":1012,"date":"2025/12/12","en":"I have two choices. One is selling my restaurant. The other is restoring it to its original condition.","ja":"選択肢は2つあります。1つはレストランを売ることで、もう1つは元の状態に戻すことです。","note":"One is ～. The other is ～.（2つの選択肢の言い方）"},{"id":1013,"date":"2026/7/18","en":"I ran 10K today. Last week, I swam for 1K, rode a bike for 60K, and jogged for 10K.","ja":"今日は10キロ走りました。先週は1キロ泳ぎ、60キロ自転車に乗り、10キロ走りました。","note":"run-ran / swim-swam / ride-rode（不規則動詞の過去形）"},{"id":1014,"date":"2026/5/14","en":"Why don't you come over to this event? / I'd love to, but I have to work on that day.","ja":"このイベントに来ませんか?/ぜひ行きたいのですが、その日は仕事があります。","note":"Why don't you ~?=~しませんか / お誘いへの返答"},{"id":1015,"date":"2025/10/3","en":"Other employees said, \"If you want to find a new job in Osaka or Tokyo, we will help you.\"","ja":"他の従業員たちは「大阪や東京で新しい仕事を探したいなら、手伝うよ」と言いました。","note":""},{"id":1016,"date":"2026/1/23","en":"After that, we will enjoy going down the hill slowly because my son is not very good at skiing.","ja":"その後、息子はスキーがあまり得意ではないので、ゆっくりと坂を下るのを楽しみます。","note":""},{"id":1017,"date":"2025/10/3","en":"My business partner has never seen him, but he is willing to work with him because he trusts me.","ja":"ビジネスパートナーは彼に会ったことがありませんが、私を信頼しているので、喜んで彼と働くつもりです。","note":"ヒント: ※be willing to＋動詞＝喜んで～する"},{"id":1018,"date":"2025/11/14","en":"I have a man who I respect. He said, \"You should understand that people progress more slowly than you.\"","ja":"私には尊敬する男性がいます。彼は「人はあなたより成長がゆっくりだということを理解すべきだ」と言いました。","note":""},{"id":1019,"date":"2026/4/23","en":"I'm playing a video game. / I'm going to play a video game. / I think I will play a video game.","ja":"(確定した予定)ゲームをします。/(意図)ゲームをするつもりです。/(推量)ゲームをすると思います。","note":"■未来: 3つの未来表現の違い"},{"id":1020,"date":"2026/1/23","en":"First, we will buy tickets. Then, we will get on a gondola and go up to the top, around 1200 meters.","ja":"まずチケットを買います。それからゴンドラに乗って、標高約1200メートルの頂上まで上がります。","note":""},{"id":1021,"date":"2025/10/31","en":"She has a second house, but her father wants her to sell the house. (She has to sell her house.)","ja":"彼女は別宅を持っていますが、お父さんは彼女にその家を売ってほしいと思っています。（彼女は家を売らなければなりません。）","note":"want 人 to do／have to の言い換え"},{"id":1022,"date":"2026/2/20","en":"I should ask another company to create the app, but the price is too expensive. It will cost 3 million yen.","ja":"アプリの制作を別の会社に依頼すべきなのですが、価格が高すぎます。300万円かかる見込みです。","note":""},{"id":1023,"date":"2026/5/29","en":"Also, Daiki is studying hard for an entrance exam, so I want to try something difficult too, which is swimming.","ja":"また、大貴が受験に向けて懸命に勉強しているので、私も難しいこと(水泳)に挑戦したいのです。","note":""},{"id":1024,"date":"2026/1/9","en":"I've already known the story, so I used English subtitles. = I used English subtitles because I've already known the story.","ja":"ストーリーをすでに知っていたので、英語字幕を使いました。","note":"so と because の言い換え"},{"id":1025,"date":"2025/10/10","en":"Yesterday morning, my business partner mentioned the chef whose name is Mr. Shiozawa and my employees mentioned his name, too.","ja":"昨日の朝、ビジネスパートナーが塩沢さんという名前のシェフのことを話に出し、従業員たちも彼の名前を口にしました。","note":"ヒント: ※mention = 言及する。関係代名詞 whose"},{"id":1026,"date":"2025/11/21","en":"Yesterday morning, my business partner mentioned the chef whose name is Mr. Shiozawa and my employees mentioned his name, too.","ja":"昨日の朝、ビジネスパートナーが塩沢さんという名前のシェフのことを口にし、従業員たちも彼の名前を挙げました。","note":"※mention = 言及する。関係代名詞 whose"},{"id":1027,"date":"2025/11/28","en":"Yesterday morning, my business partner mentioned the chef whose name is Mr. Shiozawa and my employees mentioned his name, too.","ja":"昨日の朝、共同経営者が塩澤さんという名前のシェフの話をして、従業員たちも彼の名前を口にしました。","note":"※mention＝言及する。関係代名詞 whose"},{"id":1028,"date":"2025/6/4","en":"I ran 5K in the morning. After that, I walked my dog. It was a beautiful day, so I felt great!","ja":"朝5キロ走りました。その後、犬の散歩をしました。天気が良かったのでとても気持ちよかったです！","note":""},{"id":1029,"date":"2026/7/2","en":"I want to see an Olympian come from his team. This is one of the reasons I cheer for his team.","ja":"彼のチームからオリンピック選手が出るのを見たいです。それが彼のチームを応援する理由の一つです。","note":"see 人 do=人が~するのを見る"},{"id":1030,"date":"2026/3/12","en":"Can you imagine how the price of meat goes up (increases) if the price of oil goes up in three months?","ja":"もし3か月で原油価格が上がったら、肉の値段がどれだけ上がる（increase する）か想像できますか？","note":"go up＝increase"},{"id":1031,"date":"2026/1/23","en":"We are going to have breakfast and listen to English in a car. (I'm thinking of having breakfast in a car.)","ja":"車の中で朝食をとり、英語を聞く予定です。（車の中で朝食をとろうかと考えています。）","note":""},{"id":1032,"date":"2025/6/11","en":"If I didn't learn English, I couldn't talk to them. (If I hadn't learned English, I couldn't have talked to them.)","ja":"もし英語を学んでいなかったら、彼らと話せなかったでしょう。","note":"仮定法。括弧内は原文「(I hadn't learned English, ...)」に If を補った"},{"id":1033,"date":"2025/12/23","en":"What's your plan for your winter vacation? / What are you going to do on your winter vacation? / Where are you going?","ja":"冬休みの予定は何ですか。／冬休みは何をする予定ですか。／どこに行くのですか。","note":"冬休みの予定の聞き方3パターン"},{"id":1034,"date":"2025/10/10","en":"I was thinking of closing my restaurant two days ago, but my employees and my business partner found a new chef.","ja":"2日前はレストランを閉めようかと考えていましたが、従業員とビジネスパートナーが新しいシェフを見つけてくれました。","note":"think of ~ing = 〜しようかと考える"},{"id":1035,"date":"2025/11/21","en":"I was thinking of closing my restaurant two days ago, but my employees and my business partner found a new chef.","ja":"2日前まではレストランを閉めようかと考えていましたが、従業員とビジネスパートナーが新しいシェフを見つけてくれました。","note":""},{"id":1036,"date":"2025/11/28","en":"I was thinking of closing my restaurant two days ago, but my employees and my business partner found a new chef.","ja":"2日前まではレストランを閉めようかと考えていましたが、従業員と共同経営者が新しいシェフを見つけてくれました。","note":"be thinking of -ing＝～しようかと考えている"},{"id":1037,"date":"2026/5/14","en":"She is tired she can't find a nice restaurant, and she can't enjoy travelling because her child has a peanut allergy.","ja":"彼女は良いレストランが見つからないこと、また子どもにピーナッツアレルギーがあり旅行を楽しめないことに疲れています。","note":""},{"id":1038,"date":"2025/6/11","en":"Customers can give stars to the restaurants where they went. / Customers can give stars to the restaurants which they went to.","ja":"客は自分が行ったレストランに星を付けることができます。","note":"where they went と which they went to の言い換え"},{"id":1039,"date":"2025/6/11","en":"He wanted to go to a castle, so I called a taxi and told the taxi driver where they wanted to go.","ja":"彼はお城に行きたがっていたので、私がタクシーを呼び、運転手に彼らの行き先を伝えました。","note":"間接疑問文"},{"id":1040,"date":"2026/1/16","en":"They want profits, but I want them to be helpful for clients. First, they have to be helpful. This can make profits.","ja":"彼らは利益を求めますが、私はまず顧客の役に立ってほしいのです。まず役に立つこと。それが利益につながります。","note":""},{"id":1041,"date":"2026/4/16","en":"She said that a good direction is southeast of my house, and I should build a house this year or in two years.","ja":"良い方角は家の南東で、今年か2年後に家を建てるべきだと言われました。","note":""},{"id":1042,"date":"2026/1/9","en":"We have known each other for five years. = I have known him for five years. = We have been good friends for five years.","ja":"私たちは知り合って5年になります。（＝彼と知り合って5年です。＝私たちは5年来の良い友人です。）","note":"現在完了（継続用法）の言い換え"},{"id":1043,"date":"2026/1/16","en":"My employees cannot notice dirty areas. For example, the inside of the air conditioner was very dirty. They usually can't notice such places.","ja":"従業員は汚れている場所に気づくことができません。例えば、エアコンの内部はとても汚れていました。彼らは普段そういう場所に気づけないのです。","note":""},{"id":1044,"date":"2026/1/9","en":"It was fun to go on a trip with my family. / I really enjoyed the trip. / I had a good time with my family.","ja":"家族と旅行に行くのは楽しかったです。／旅行を本当に楽しみました。／家族と良い時間を過ごしました。","note":"同じ内容の言い換え3通り"},{"id":1045,"date":"2026/2/6","en":"I consider what to buy and when to buy. / I consider what I should buy and when I should buy. / What should I buy?","ja":"何を買うか、いつ買うかを検討します。／何を買うべきか、いつ買うべきかを検討します。／何を買うべきでしょうか？","note":"what to buy = what I should buy の言い換え練習"},{"id":1046,"date":"2025/10/3","en":"I'm going to open a new shop in Okinawa, and my business partner said, \"I can work with him in Okinawa if he likes.\"","ja":"私は沖縄に新しい店を開く予定で、ビジネスパートナーは「彼が望むなら、沖縄で彼と一緒に働けるよ」と言いました。","note":""},{"id":1047,"date":"2026/3/12","en":"People who live in San Francisco tend to go to Hawaii because the weather in San Francisco is the same as that of Hawaii.","ja":"サンフランシスコに住む人はハワイに行く傾向があります。サンフランシスコの気候はハワイの気候と同じだからです。","note":"原文の San Fancisco は San Francisco の誤記を修正／tend to＝~しがち／that of＝the weather of"},{"id":1048,"date":"2026/4/23","en":"The purpose of the trip was doing nothing, but I went running because the view was beautiful. After running, I got soaked in sweat.","ja":"旅の目的は何もしないことでしたが、景色が美しかったので走りに行きました。走った後は汗でびっしょりになりました。","note":"get soaked in sweat=汗で濡れる"},{"id":1049,"date":"2025/10/3","en":"If I make every effort to rebuild the business, I might be able to reduce the amount of the price that I have to pay.","ja":"事業の立て直しに全力を尽くせば、支払わなければならない金額を減らせるかもしれません。","note":""},{"id":1050,"date":"2026/2/26","en":"Where is the check-in counter? / Do you know where the check-in counter is? / Could you tell me where the check-in counter is?","ja":"チェックインカウンターはどこですか。／チェックインカウンターがどこか分かりますか。／チェックインカウンターがどこか教えていただけますか。","note":"疑問詞の名詞句（間接疑問文では語順が where + S + V になる）"},{"id":1051,"date":"2025/12/12","en":"I was going to open an ice-cream shop in Okinawa, but we stopped the plan because my business partner doesn't want to live there.","ja":"沖縄でアイスクリーム店を開くつもりでしたが、ビジネスパートナーがそこに住みたがらないので、その計画を中止しました。","note":"Lesson_Note_Masumi_20251212（IMG_0610・IMG_0611は同一文書の重複／スクロール続き）"},{"id":1052,"date":"2026/5/29","en":"Mr. Chiba and my mentor are very similar to each other because they are serious about children's future. I hope my mentor becomes a sponsor.","ja":"千葉さんと私のメンターは、子どもたちの将来に真剣という点でとてもよく似ています。メンターがスポンサーになってくれることを願っています。","note":""},{"id":1053,"date":"2026/5/14","en":"For example, my employees and friends will bring their children. And I want them to become good friends. This can help to expand their community.","ja":"例えば、従業員や友人たちが子どもを連れてきます。その子たちに仲良くなってほしいのです。これはコミュニティを広げる助けになります。","note":"want 人 to do=人に~してほしい"},{"id":1054,"date":"2026/4/2","en":"Five years ago, the Small and Medium Enterprise Agency of Japan helped our restaurant, and we were required to continue the business for five years.","ja":"5年前、日本の中小企業庁がうちのレストランを支援してくれて、その代わり5年間事業を継続することが求められました。","note":"be required to＝~することを求められる"},{"id":1055,"date":"2026/1/9","en":"We bought a lot of souvenirs, such as a lion doll, a horse doll, and a bag for my wife. The bag is cute and useful.","ja":"ライオンのぬいぐるみ、馬のぬいぐるみ、妻へのバッグなど、お土産をたくさん買いました。そのバッグはかわいくて実用的です。","note":""},{"id":1056,"date":"2026/4/23","en":"I was going to join the training with Mr. Fujimura this weekend, but I canceled because I'm afraid of riding a road bike at high speed.","ja":"今週末、藤村さんとのトレーニングに参加するつもりでしたが、高速でロードバイクに乗るのが怖いのでキャンセルしました。","note":"■未来のこと / was going to=~するつもりだった(けどしない) / 原文の raining は training の誤り"},{"id":1057,"date":"2026/1/23","en":"(1) Know nothing (2) Can't do it even when aware of it (3) Can do it when aware of it (4) Can do it without thinking (naturally) (5) Can teach it to others","ja":"①何も知らない ②意識してもできない ③意識したらできる ④意識しなくてもできる（当たり前にできる） ⑤人に教えられる","note":"原文は日本語のみ（習得の5段階のメモ）。英文は参考訳"},{"id":1058,"date":"2025/6/4","en":"Then, I did my best at work. I worked from 8 to 6 without having lunch because I don't usually have lunch. I eat some bread while working or thinking.","ja":"それから仕事を頑張りました。普段昼食をとらないので、昼食なしで8時から6時まで働きました。仕事をしたり考え事をしたりしながらパンを少し食べます。","note":""},{"id":1059,"date":"2026/4/9","en":"Actually, how to make gin and whiskey is very similar, so many brands make both of them. Japanese gin and whiskey are often exported to the US, Europe, Singapore, and UAE.","ja":"実は、ジンとウイスキーの作り方はとてもよく似ているので、多くのブランドが両方を作っています。日本のジンとウイスキーは、米国・欧州・シンガポール・UAEによく輸出されています。","note":"export=輸出する"},{"id":1060,"date":"2026/1/9","en":"She is going to the dentist next Monday. = I'm going (to go) to the dentist next Monday. = I'm gonna go to…. = I'm gonna play a game. = I'm gonna go jogging with Mr. Fujimura tomorrow.","ja":"彼女は来週の月曜日に歯医者に行く予定です。（＝私は来週の月曜日に歯医者に行く予定です。＝明日は藤村さんとジョギングに行く予定です。）","note":"be going to / gonna（口語形）の言い換え練習"},{"id":1061,"date":"2026/5/14","en":"Also, I want one of my friends to meet my mentor because he is good at taking care of people's mental health. When I called her the other day, I noticed she was mentally tired.","ja":"また、友人の一人をメンターに会わせたいです。彼は人の心のケアが得意だからです。先日彼女に電話したとき、精神的に疲れていることに気づきました。","note":"the other day=先日"},{"id":1062,"date":"2025/7/4","en":"I went to a swimming pool, but it was closed, so instead (of swimming), I went for jogging. I ran 10K today. Last week, I swam for 1K, rode a bike for 60K, and jogged for 10K.","ja":"プールに行きましたが閉まっていたので、（泳ぐ）代わりにジョギングに行きました。今日は10km走りました。先週は1km泳ぎ、自転車で60km走り、10kmジョギングしました。","note":"instead (of ~) = 〜の代わりに"},{"id":1063,"date":"2026/3/19","en":"My friend and I went to Lake Suwa by car last Sunday. We drove on Route 153, and it took eight hours to get there because there was a big traffic jam. We went there to enjoy hot springs, running, and eating soba noodles. We came back on the highway.","ja":"先週の日曜日、友達と車で諏訪湖に行きました。国道153号線を走ったのですが、大渋滞で着くまでに8時間かかりました。温泉とランニング、そしてそばを食べるのを楽しみに行きました。帰りは高速道路で帰ってきました。","note":"■週末の話"},{"id":1064,"date":"2026/4/9","en":"On the second day, we are going to visit a winery. We can learn about the history of wine and how to make wine. Then, we are going to check in a new hotel. The hotel is in Uonuma. This place is famous for its rice. My children love rice. I've told my children that Japanese sake is made from rice. It's going to be a good opportunity for them to learn about different kinds of alcoholic drinks, such as sake, wine, gin, and whisky.","ja":"2日目はワイナリーを訪れます。ワインの歴史と作り方を学べます。それから新しいホテルにチェックインします。ホテルは魚沼にあります。この土地は米で有名です。子どもたちは米が大好きです。日本酒は米から作られると子どもたちに話しました。日本酒・ワイン・ジン・ウイスキーなど、いろいろなお酒について学ぶ良い機会になるでしょう。","note":"be made from=~から作られる / opportunity=機会"},{"id":1065,"date":"2026/7/24","en":"I go running, swimming, and cycling once a week. Especially, I go running for about 15K, but I'm not good at swimming. I try to go swimming three times a week for two months. Ms. Eri teach me how to swim and how to show a YouTube channel. I can swim freestyle well little by little. I swim fast a bit. After I swim, I go running about 10K. The time is very short. (I go running very fast.) 1K time is about 5 minutes while 10K.","ja":"週1回、ランニング・水泳・サイクリングをしています。特にランニングは15キロほど走りますが、水泳は得意ではありません。2か月間、週3回泳ぐようにしています。エリさんが泳ぎ方とYouTubeチャンネルを教えてくれます。少しずつクロールが上手く泳げるようになり、少し速くなりました。泳いだ後は10キロほど走ります。タイムはかなり速いです。10キロを1キロ約5分のペースで走ります。","note":"■真澄さんの解答(訂正前の原文ママ)"},{"id":1066,"date":"2026/7/24","en":"I go running, swimming, and cycling once a week. In particular, I'm working on my running now. For the past two months, I have been trying to swim three times a week. Ms. Eri has been teaching me how to swim and introducing me to a YouTube channel about swimming. Thanks to her, I can swim freestyle better little by little. I can swim a little faster now. After I swim, I usually go for a 10 km run. I can run faster more easily now. I can run 10 km at about 5 minutes per kilometer.","ja":"週1回、ランニング・水泳・サイクリングをしています。特に今はランニングに力を入れています。この2か月間は週3回泳ぐようにしてきました。エリさんが泳ぎ方を教えてくれて、水泳のYouTubeチャンネルも紹介してくれています。おかげで少しずつクロールが上達し、今では少し速く泳げます。泳いだ後はたいてい10キロ走ります。以前より楽に速く走れるようになり、10キロを1キロ約5分のペースで走れます。","note":"■訂正版 / in particular=特に / for the past two months+現在完了進行形 / thanks to her=彼女のおかげで"},{"id":1067,"date":"2026/10/15","en":"slightly + 形容詞","ja":"形容詞の前に slightly を付けると、程度が「少し」であることを言える","note":"例: slightly spicy＝少し辛い"},{"id":1068,"date":"2026/10/15","en":"pop it in the + 電化製品","ja":"料理を短時間、電子レンジなどの電化製品に入れること","note":"表現。例: pop it in the microwave"},{"id":1069,"date":"2026/10/15","en":"to tweak","ja":"少し変える、小さな変更を加える","note":"単語。例: tweak the recipe"},{"id":1070,"date":"2026/10/21","en":"V-ing: be + V-ing","ja":"進行形：be + 動詞-ing = 「今まさに〜している／一時的に〜している」。例: I am studying English.","note":"この -ing は動名詞ではなく現在分詞。be動詞とセットで進行形を作る。"},{"id":1071,"date":"2026/10/21","en":"V-ing as subject","ja":"動名詞の主語用法：V-ing = 「〜すること」。例: Walking every day is good for you.","note":"一般的な行為・習慣を主語にするとき自然。今回の Popping it in the toaster oven ... もこの用法。"},{"id":1072,"date":"2026/10/21","en":"V-ing as object","ja":"動名詞の目的語用法：動詞の後ろで「〜すること」。例: I enjoy cooking.","note":"enjoy / avoid / finish / mind / suggest / consider / keep / practice などは基本的に V-ing を取る。"},{"id":1073,"date":"2026/10/21","en":"after a preposition: prep + V-ing","ja":"前置詞の後ろは原則 V-ing。例: Thank you for helping me. / Before leaving, call me.","note":"for, by, after, before, without, about, in などの後ろで動詞を置くときは -ing。"},{"id":1074,"date":"2026/10/21","en":"to as a preposition + V-ing","ja":"to が前置詞なら後ろは V-ing。例: I look forward to seeing you.","note":"look forward to / be used to / get used to / object to / be committed to / be opposed to の to は不定詞の to ではない。"},{"id":1075,"date":"2026/10/21","en":"be used to + V-ing","ja":"be used to V-ing = 「〜することに慣れている」。例: I'm used to getting up early.","note":"used to + 動詞原形（昔は〜した）とは別物。"},{"id":1076,"date":"2026/10/21","en":"get used to + V-ing","ja":"get used to V-ing = 「〜することに慣れる」。例: You'll get used to speaking English.","note":"to は前置詞なので speak ではなく speaking。"},{"id":1077,"date":"2026/10/21","en":"look forward to + V-ing","ja":"look forward to V-ing = 「〜するのを楽しみにしている」。例: I'm looking forward to meeting you.","note":"to の後ろでも -ing になる代表例。"},{"id":1078,"date":"2026/10/21","en":"can't help + V-ing","ja":"can't help V-ing = 「〜せずにはいられない」。例: I can't help laughing.","note":"help の通常の意味「助ける」とは異なる慣用表現。"},{"id":1079,"date":"2026/10/21","en":"It's worth + V-ing","ja":"be worth V-ing = 「〜する価値がある」。例: It's worth trying.","note":"worth の後ろは to do ではなく V-ing が基本。"},{"id":1080,"date":"2026/10/21","en":"It's no use / no good + V-ing","ja":"It's no use V-ing = 「〜しても無駄」。例: It's no use worrying.","note":"no good V-ing も同様。"},{"id":1081,"date":"2026/10/21","en":"go + V-ing","ja":"go shopping / go swimming / go skiing など、活動・レジャーを表す形。","note":"移動して何か活動をする表現でよく使う。"},{"id":1082,"date":"2026/10/21","en":"adjective-like V-ing","ja":"現在分詞の形容詞用法：an exciting movie = 「人をワクワクさせる映画」。","note":"-ing は「感情を起こさせる側」、-ed は「感情を感じる側」になりやすい。"},{"id":1083,"date":"2026/10/21","en":"reduced clause with V-ing","ja":"分詞構文：V-ing で「〜しながら／〜して／〜すると」。例: Walking home, I called her.","note":"主節と同じ主語で、時・理由・同時動作などを簡潔に表す。"},{"id":1084,"date":"2026/10/21","en":"Try + V-ing","ja":"try V-ing = 「試しに〜してみる」。例: Try tweaking the recipe.","note":"方法を試すニュアンス。今回の Try using the oven. と同じ。"},{"id":1085,"date":"2026/10/21","en":"Try + to do","ja":"try to do = 「〜しようと努力する／試みる」。例: Try to finish it today.","note":"try V-ing（方法を試す）とは意味が違う。"},{"id":1086,"date":"2026/10/21","en":"stop + V-ing","ja":"stop V-ing = 「〜するのをやめる」。例: Stop talking.","note":"行為そのものを中止する。"},{"id":1087,"date":"2026/10/21","en":"stop + to do","ja":"stop to do = 「〜するために立ち止まる／今の行為を止めて〜する」。例: I stopped to rest.","note":"to do は目的を表す。"},{"id":1088,"date":"2026/10/21","en":"remember + V-ing","ja":"remember V-ing = 「〜したことを覚えている」。例: I remember meeting him.","note":"過去に実際にした行為の記憶。"},{"id":1089,"date":"2026/10/21","en":"remember + to do","ja":"remember to do = 「忘れずに〜する」。例: Remember to call me.","note":"これから行うべきことを覚えておく。"},{"id":1090,"date":"2026/10/21","en":"forget + V-ing","ja":"forget V-ing = 「〜したことを忘れる」。例: I'll never forget meeting you.","note":"過去の経験・出来事について使う。"},{"id":1091,"date":"2026/10/21","en":"forget + to do","ja":"forget to do = 「〜するのを忘れる」。例: I forgot to bring my keys.","note":"やるべき行為をしなかった、という意味。"},{"id":1092,"date":"2026/10/21","en":"regret + V-ing","ja":"regret V-ing = 「〜したことを後悔する」。例: I regret saying that.","note":"すでに起きた行為への後悔。"},{"id":1093,"date":"2026/10/21","en":"regret + to do","ja":"regret to do = 「残念ながら〜する／〜を伝える」。例: We regret to inform you...","note":"主に正式な通知で使う。"},{"id":1094,"date":"2026/10/21","en":"go on + V-ing","ja":"go on V-ing = 「同じことを続ける」。例: He went on talking.","note":"同じ行為の継続。"},{"id":1095,"date":"2026/10/21","en":"go on + to do","ja":"go on to do = 「続いて別のことをする」。例: She went on to explain the next point.","note":"次の行為へ進む。"},{"id":1096,"date":"2026/10/21","en":"mean + V-ing","ja":"mean V-ing = 「〜することを意味する／伴う」。例: This job means working weekends.","note":"結果・内容として〜することになる、の意味。"},{"id":1097,"date":"2026/10/21","en":"mean + to do","ja":"mean to do = 「〜するつもりである」。例: I meant to call you.","note":"意図・予定を表す。"},{"id":1098,"date":"2026/10/21","en":"need + V-ing","ja":"need V-ing = 「〜される必要がある」。例: The car needs washing.","note":"受け身的な意味。= The car needs to be washed."},{"id":1099,"date":"2026/10/21","en":"like/love/hate/prefer + V-ing","ja":"V-ing は一般的な好み・習慣を表しやすい。例: I like running.","note":"to do も可能な動詞があるが、V-ing は活動そのものへの好みを表しやすい。"},{"id":1100,"date":"2026/10/21","en":"like/love/hate/prefer + to do","ja":"to do は特定の状況・選択・習慣的方針を表すことがある。例: I like to get up early.","note":"V-ing と意味が大きく変わらない場合も多い。文脈で自然さが変わる。"},{"id":1101,"date":"2026/10/21","en":"begin/start/continue + V-ing / to do","ja":"begin / start / continue は V-ing と to do の両方が可能で、意味差が小さいことが多い。","note":"例: It started raining. / It started to rain."},{"id":1102,"date":"2026/10/21","en":"see/hear/watch + O + V-ing","ja":"知覚動詞 + 目的語 + V-ing = 動作の途中・進行中を見聞きする。例: I saw him running.","note":"動作の一部・進行中に注目。"},{"id":1103,"date":"2026/10/21","en":"-ing spelling rules","ja":"基本は動詞 + ing。make→making / lie→lying / run→running。","note":"語尾eを落とす、ie→y、短母音＋子音は子音を重ねる等の綴り規則がある。"},{"id":1104,"date":"2026/10/21","en":"to + verb: noun use","ja":"to不定詞の名詞用法：to do = 「〜すること」。例: To learn English takes time.","note":"主語・目的語・補語になれる。一般行為の主語は V-ing の方が自然なことも多い。"},{"id":1105,"date":"2026/10/21","en":"It is + adjective + to do","ja":"形式主語 it：It's important to practice. = 「練習することは大切」。","note":"長い to不定詞を後ろに置いて文を自然にする。今回の It's perfectly normal to feel nervous. もこれ。"},{"id":1106,"date":"2026/10/21","en":"verb + to do","ja":"want / hope / plan / decide / promise / agree / refuse / learn / manage / offer / expect / would like + to do。","note":"これらの動詞は目的語として to不定詞を取りやすい。"},{"id":1107,"date":"2026/10/21","en":"verb + object + to do","ja":"tell / ask / want / need / expect / allow / advise / encourage / remind / invite / persuade + 人 + to do。","note":"「人に〜するよう言う／望む／勧める」形。"},{"id":1108,"date":"2026/10/21","en":"to do as complement","ja":"補語：My goal is to improve my English. = 「目標は英語を上達させること」。","note":"be動詞の後ろで主語の内容を説明する。"},{"id":1109,"date":"2026/10/21","en":"noun + to do","ja":"形容詞的用法：something to eat / a place to stay / work to do。","note":"名詞の後ろから「〜するための／〜すべき」を説明する。"},{"id":1110,"date":"2026/10/21","en":"to do for purpose","ja":"副詞的用法（目的）：I went out to buy coffee. = 「コーヒーを買うために外出した」。","note":"in order to / so as to で目的をより明示できる。"},{"id":1111,"date":"2026/10/21","en":"adjective + to do","ja":"感情・評価の形容詞 + to do：happy to see you / sorry to hear that / ready to go。","note":"「〜して嬉しい／残念／準備ができている」などを表す。"},{"id":1112,"date":"2026/10/21","en":"too ... to do","ja":"too + 形容詞 + to do = 「〜すぎて…できない」。例: It's too hot to eat.","note":"否定語がなくても結果的に「できない」の意味になりやすい。"},{"id":1113,"date":"2026/10/21","en":"adjective + enough + to do","ja":"形容詞 + enough + to do = 「…するのに十分〜」。例: He is old enough to drive.","note":"enough は形容詞の後ろに置く。"},{"id":1114,"date":"2026/10/21","en":"wh-word + to do","ja":"what / how / where / when / who + to do。例: I don't know what to say.","note":"「何を〜すべきか／どう〜するか」を簡潔に表す。"},{"id":1115,"date":"2026/10/21","en":"for + person + to do","ja":"for + 人 + to do = 「人が〜すること」。例: It's important for you to rest.","note":"to不定詞の意味上の主語を for + 人 で示す。"},{"id":1116,"date":"2026/10/21","en":"not to do","ja":"to不定詞の否定は not to do。例: Try not to interrupt her.","note":"not は to の前に置く。今回の Try not to forget... と同じ。"},{"id":1117,"date":"2026/10/21","en":"to be done","ja":"受け身の不定詞：to be + 過去分詞。例: I want this to be finished today.","note":"「〜されること／〜されるように」を表す。"},{"id":1118,"date":"2026/10/21","en":"to have done","ja":"完了不定詞：to have + 過去分詞。例: He seems to have forgotten.","note":"主節の時点より前に起きたことを表す。"},{"id":1119,"date":"2026/10/21","en":"to be doing","ja":"進行不定詞：to be + V-ing。例: He seems to be working.","note":"ある時点で進行中の行為を表す。"},{"id":1120,"date":"2026/10/21","en":"make/let/have + O + bare verb","ja":"make / let / have の能動態は通常 to を付けない。例: She made me wait. / Let me go.","note":"ただし受け身では be made to do：I was made to wait."},{"id":1121,"date":"2026/10/21","en":"help + O + (to) do","ja":"help は to あり・なし両方可能。例: Help me carry this. / Help me to carry this.","note":"会話では to なしも非常に一般的。"},{"id":1122,"date":"2026/10/21","en":"split infinitive","ja":"to + 副詞 + 動詞（例: to really understand）は現代英語で普通に使われる。","note":"意味が自然なら無理に避ける必要はない。"},{"id":1123,"date":"2026/10/21","en":"gerund vs infinitive as subject","ja":"V-ing 主語は一般的・日常的な行為に自然。to do 主語はやや抽象的・強調的・改まった響きになることがある。","note":"例: Smoking is dangerous. / To err is human."},{"id":1124,"date":"2026/10/21","en":"Popping ... vs To pop ...","ja":"Popping it in the toaster oven might do the trick. が会話では自然。To pop it ... も文法的には可能。","note":"今回の文では「方法として〜してみること」を一般的に提示するため動名詞が自然。"}],"phrases":[{"id":1,"en":"on","ja":"具体的な日付について話す時は「on」を使います","note":"grammar: use 'on' with specific dates (e.g. on the 17th)"},{"id":2,"en":"on + 日","ja":"曜日には「on」を使います","note":"grammar: use 'on' with days of the week (e.g. on Monday)"},{"id":3,"en":"the","ja":"（定冠詞）","note":"Grammar concept card; hint: 特定の国際イベントについて話すときは「the」を付けます"},{"id":4,"en":"give","ja":"与える・渡す","note":"Gemini解説画面: give は広く「与える・渡す」に使える。feed は食べ物(エサ)に特化。例: give a present"},{"id":5,"en":"this","ja":"今週の","note":"今週のことなら「this」を使います"},{"id":6,"en":"pour","ja":"どしゃぶりになる; 大雨","note":"It didn't pour = 大雨は降らなかった"},{"id":7,"en":"snug","ja":"ぴったりしている、きつい","note":"vocabulary word; snug = ぴったり合う/きつい"},{"id":8,"en":"some","ja":"いくらかの、いくつかの","note":"「some」は2つ以上だけど、たくさんではない数のこと"},{"id":9,"en":"actor","ja":"俳優","note":""},{"id":10,"en":"tough","ja":"大変な、つらい","note":""},{"id":11,"en":"bored","ja":"退屈してい は私に空き部屋を月単位で貸してくれています。","note":"レッスン: renting ___ to me / rent A to B=AをBに貸す, spare room=空き部屋"},{"id":877,"en":"Do you have any weekend plans with friends?","ja":"週末に友達と何か予定ある？","note":"追加の練習1/2"},{"id":878,"en":"Her answer is more accurate than his guess.","ja":"彼女の答えは彼の推測よりも正確です。","note":"比較級 more accurate than。guess=推測"},{"id":879,"en":"He's confused about why the bill is higher.","ja":"彼は、なぜ請求額が高いのか混乱している。","note":"be confused about ___=～について混乱している。bill=請求額"},{"id":880,"en":"I read every afternoon with my best friend.","ja":"私は毎日午後に、私の親友と一緒に(本を)読みます。","note":""},{"id":881,"en":"Why do you keep rewatching that same movie?","ja":"なんで同じ映画を何度も見返してるの？","note":"発音練習画面（お手本・自分の発音ボタンあり）。keep -ing（〜し続ける）、rewatch（見返す）"},{"id":882,"en":"A Tesla is more extravagant than a Corolla.","ja":"テスラはカローラよりも派手・豪華です。","note":"レッスン: more+形容詞。extravagant=派手・豪華"},{"id":883,"en":"Can you walk me through the policy timeline?","ja":"ポリシーの策定までの経緯を時系列でご説明いただけますか？","note":"Can you walk me through ___? の練習"},{"id":884,"en":"He memorized all the lines for the audition.","ja":"彼はオーディションのためにすべてのセリフを覚えた。","note":"「all the ___」の練習。lines=セリフ"},{"id":885,"en":"I'm wondering how's the weather in New York.","ja":"ニューヨークの天気がどうか気になっています。","note":"英会話アプリの発音練習画面"},{"id":886,"en":"I have breakfast every morning with my kids.","ja":"私は毎朝、私の子供たちと一緒に朝ごはんを食べます。","note":""},{"id":887,"en":"I won't ignore my doctor's advice ever again.","ja":"もう二度と医者のアドバイスを無視しません。","note":"won't ... ever again=もう二度と〜しない"},{"id":888,"en":"Can you walk me through the checkout process?","ja":"チェックアウトの手順を一通り教えていただけますか？","note":"発音判定「もう一度お試しください」の画面"},{"id":889,"en":"Are you thinking of investing in some stocks?","ja":"あなたは株式投資をしようと思ってるんですか？","note":"レッスン: Spending and Investing / stocks=株式"},{"id":890,"en":"The rent increase starts soon; it's in October.","ja":"家賃の値上げはもうすぐ始まります。10月からです。","note":"rent increase=家賃の値上げ"},{"id":891,"en":"She plans to get her laptop repaired tomorrow.","ja":"彼女は明日ノートパソコンを修理に出す予定です。","note":"「get my ___ repaired」の練習例文"},{"id":892,"en":"Reading poetry is one of my favorite pastimes.","ja":"詩を読むことは私のお気に入りの趣味の一つです。","note":""},{"id":893,"en":"Reading novels is one of my favorite pastimes.","ja":"小説を読むことは私のお気に入りの趣味の一つです。","note":""},{"id":894,"en":"I'm thinking of investing in some real estate.","ja":"私は不動産投資をしようと思ってます。","note":"レッスン: Spending and Investing / real estate=不動産"},{"id":895,"en":"On one hand, state schools are more affordable.","ja":"一つの側面として、州立学校は (学費が) より手頃です。","note":"On one hand=一方では、state school=州立学校、affordable=手頃な"},{"id":896,"en":"I'm a firefighter, and my shift starts tonight.","ja":"私は消防士で、今夜から勤務が始まります。","note":"職業を伝える表現。shift=勤務・シフト"},{"id":897,"en":"Please review the refund policy before you buy.","ja":"ご購入前に返金ポリシーをご確認ください。","note":"レッスン: the ___ policy、refund policy=返金ポリシー"},{"id":898,"en":"Are you thinking of starting your own business?","ja":"自分で起業することを考えていますか？","note":"start one's own business=起業する"},{"id":899,"en":"I'm a software engineer working on mobile apps.","ja":"モバイルアプリを開発しているソフトウェアエンジニアです。","note":"職業を伝えるレッスン。work on ~ = ~に取り組む"},{"id":900,"en":"My favorite shows are Breaking Bad and Friends.","ja":"私のお気に入りの番組は『ブレイキング・バッド』と『フレンズ』です。","note":""},{"id":901,"en":"We have something to discuss after the meeting.","ja":"会議の後に話し合いたいことがあります。","note":"レッスン: have something to ___"},{"id":902,"en":"I like listening to podcasts during my commute.","ja":"通勤中にポッドキャストを聴くのが好きです。","note":"commute=通勤。during my commute=通勤中に"},{"id":903,"en":"Reading magazines is one of my favorite pastimes.","ja":"雑誌を読むことは私のお気に入りの趣味の一つです。","note":""},{"id":904,"en":"She reviewed all the receipts before filing taxes.","ja":"彼女は確定申告をする前にすべての領収書を確認しました。","note":"レッスン: all the ___、file taxes=確定申告をする、receipt=領収書"},{"id":905,"en":"Reading biographies is one of my favorite pastimes.","ja":"伝記を読むことは私のお気に入りの趣味の一つです。","note":"穴埋め問題"},{"id":906,"en":"We're on a temporary contract until funding arrives.","ja":"資金が入るまで、私たちは暫定的な契約です。","note":"temporary contract=暫定的な契約。funding=資金"},{"i
