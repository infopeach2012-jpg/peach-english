  // ---- 長文画面 ----
  function drawText(body) {
    const mats = materials();
    if (!settings.matKey || !mats.find((m) => m.key === settings.matKey)) settings.matKey = mats[0] && mats[0].key;
    const groups = [];
    mats.forEach((m) => { let g = groups.find((x) => x.name === m.group); if (!g) { g = { name: m.group, items: [] }; groups.push(g); } g.items.push(m); });
    body.innerHTML = `
      ${groups.map((g) => `
        <div class="text-xs font-bold text-gray-400 mb-1 mt-2">${g.name}</div>
        <div class="flex gap-2 mb-2 overflow-x-auto pb-1 -mx-1 px-1">
          ${g.items.map((m) => `<button data-mat="${m.key}" class="chip whitespace-nowrap ${m.key === settings.matKey ? 'brand-grad text-white' : 'bg-gray-100 text-gray-600'}">${window.App.escapeHtml(m.title)}</button>`).join('')}
        </div>`).join('')}
      <div class="mt-2">${player(settingsRow())}</div>
      <div class="text-xs text-gray-400 mb-2">最後まで読むと、次の章へ自動で進みます</div>
      <div id="ls-text" class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm leading-relaxed text-[15px] text-gray-800"></div>
      <button id="ls-jatoggle" class="text-xs text-gray-400 underline mt-3">和訳を表示</button>
      <div id="ls-jatext" class="hidden-x text-sm text-gray-600 bg-gray-50 rounded-lg px-3 py-2 mt-2"></div>
    `;
    body.querySelectorAll('[data-mat]').forEach((b) => { b.onclick = () => { settings.matKey = b.dataset.mat; saveSettings(); draw(); }; });
    bindSettings(body, () => drawText(body));
    body.querySelector('#ls-jatoggle').onclick = (e) => {
      const t = body.querySelector('#ls-jatext');
      t.classList.toggle('hidden-x');
      e.target.textContent = t.classList.contains('hidden-x') ? '和訳を表示' : '和訳を隠す';
    };
    loadMaterial(body, settings.matKey);
    bindPlayer(body);
  }

  function loadMaterial(body, key) {
    const mats = materials();
    const mat = mats.find((m) => m.key === key);
    if (!mat) return;
    settings.matKey = key; saveSettings();
    body.querySelectorAll('[data-mat]').forEach((b) => {
      const on = b.dataset.mat === key;
      b.classList.toggle('brand-grad', on); b.classList.toggle('text-white', on);
      b.classList.toggle('bg-gray-100', !on); b.classList.toggle('text-gray-600', !on);
    });
    const sents = splitSentences(mat.en);
    queue = sents.map((s, i) => ({ en: s, ja: '', key: mat.key + '_' + i }));
    idx = 0;
    const tx = body.querySelector('#ls-text');
    tx.innerHTML = sents.map((s, i) => `<span data-i="${i}" class="ls-sent rounded px-0.5">${window.App.escapeHtml(s)}</span>`).join(' ');
    tx.querySelectorAll('[data-i]').forEach((el) => { el.onclick = () => { idx = Number(el.dataset.i); play(); }; });
    body.querySelector('#ls-jatext').textContent = mat.ja;
    body.querySelector('#ls-sub').textContent = mat.title;
    body.querySelector('#ls-en').textContent = sents[0] || '';
    body.querySelector('#ls-ja').textContent = '';
    updatePos();
  }

  // 長文: 章の最後まで来たら次の章へ
  function nextMaterial() {
    const mats = materials();
    const i = mats.findIndex((m) => m.key === settings.matKey);
    if (i < 0 || i + 1 >= mats.length) return false;
    loadMaterial(container.querySelector('#ls-body'), mats[i + 1].key);
    return true;
  }

  // ---- 再生制御 ----
  function updatePos() {
    const pos = container.querySelector('#ls-pos');
    const bar = container.querySelector('#ls-bar');
    if (pos) pos.textContent = queue.length ? `${idx + 1} / ${queue.length}` : '0 / 0';
    if (bar) bar.style.width = queue.length ? `${((idx + 1) / queue.length) * 100}%` : '0%';
    container.querySelectorAll('.ls-row, .ls-sent').forEach((el) => el.classList.toggle('ls-now', Number(el.dataset.i) === idx));
  }
  function showCurrent() {
    const q = queue[idx];
    if (!q) return;
    const en = container.querySelector('#ls-en'), ja = container.querySelector('#ls-ja');
    if (en) en.textContent = q.en;
    if (ja) ja.textContent = q.ja || '';
    updatePos();
    const now = container.querySelector('.ls-now');
    if (now && now.scrollIntoView) now.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  function setPlayBtn() {
    const b = container.querySelector('#ls-play');
    if (b) b.textContent = playing ? '⏸' : '▶';
  }

  async function play() {
    if (!queue.length) { window.App.toast('再生するものがありません'); return; }
    if (!window.Speech.ttsSupported) { window.App.toast('この端末は音声読み上げに対応していません'); return; }
    window.Speech.unlockAudio();
    const my = ++session;
    playing = true;
    setPlayBtn();
    while (playing && my === session) {
      if (idx >= queue.length) {
        // 長文は次の章へ、フレーズは先頭へ戻って続ける
        if (settings.tab === 'text' && nextMaterial()) { /* loadMaterial が idx=0 にした */ }
        else idx = 0;
      }
      const q = queue[idx];
      showCurrent();
      if (queue[idx + 1] && window.Speech.prefetchClip) window.Speech.prefetchClip(queue[idx + 1].key);
      const alive = () => playing && my === session;
      for (let r = 0; r < settings.repeat && alive(); r++) {
        await window.Speech.speak(q.en, { rate: settings.rate, key: q.key });
        if (r + 1 < settings.repeat && alive()) await sleep(300);
      }
      if (settings.pattern === 'study' && alive()) {
        // 学習パターン: 英語 → ゆっくり → 和訳（あれば）→ 英語
        await sleep(350);
        if (alive()) await window.Speech.speak(q.en, { rate: settings.rate, key: q.key, slow: true });
      }
      if (settings.ja && q.ja && alive()) {
        await sleep(200);
        await window.Speech.speak(q.ja, { lang: 'ja', rate: 1.1 });
      }
      if (settings.pattern === 'study' && alive()) {
        await sleep(350);
        if (alive()) await window.Speech.speak(q.en, { rate: settings.rate, key: q.key });
      }
      if (!(playing && my === session)) break;
      listenedThisRun++;
      if (listenedThisRun % 5 === 0) { window.Store.recordActivity(1); window.App.refreshHeader(); }
      await sleep(settings.gap * 1000);
      if (!(playing && my === session)) break;
      idx++;
    }
  }
  function pause() {
    playing = false;
    session++;
    window.Speech.stopSpeaking();
    if (window.Speech.releaseAudio) window.Speech.releaseAudio();
    setPlayBtn();
  }
  function stop() { pause(); }
  function jump(d) {
    if (!queue.length) return;
    idx = (idx + d + queue.length) % queue.length;
    if (playing) { session++; window.Speech.stopSpeaking(); playing = false; play(); }
    else showCurrent();
  }

  // 音声一覧は端末によって後から届くので、届いたら設定欄だけ描き直す
  window.addEventListener('speak:voices', () => {
    if (!container || !container.closest('.view.active') || playing) return;
    if (container.querySelector('#ls-voice')) return;
    draw();
  });

  function onLeave() { stop(); }

  window.ListenView = { render, onLeave, SITS };
})();

</script>
  <script>
/* lesson.js — 今日のレッスン（ガイド付き4ステップコース：SpeakBuddy型カリキュラム）
 * ウォームアップ → キーフレーズ発音 → ミニ会話 → 仕上げクイズ
 * 日付シードで「今日の内容」は1日固定。window.LessonView
 */
(function () {
  'use strict';

  let micRef = {};
  let listening = false;
  let plan = null;  // 今日の教材（日付固定）
  let st = null;    // 進行状態 { step, i, results }

  // 日付シードの簡易乱数
  function seedFromDate(dateStr) {
    let h = 2166136261;
    for (let i = 0; i < dateStr.length; i++) { h ^= dateStr.charCodeAt(i); h = Math.imul(h, 16777619); }
    return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1e6) / 1e6; };
  }
  function pick(arr, n, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a.slice(0, n);
  }

  function buildPlan() {
    const C = window.Store.content;
    const today = window.Store.todayStr();
    const rnd = seedFromDate(today);
    const words = C.phrases.filter((p) => p.kind === 'word');
    const sents = C.phrases.filter((p) => p.kind === 'sentence');
    const quizPool = []
      .concat(C.phrases.map((p) => ({ en: p.en, ja: p.ja })))
      .concat(C.notes.map((n) => ({ en: n.en, ja: n.ja })))
      .filter((x) => x.en && x.ja && x.ja.length <= 40);
    return {
      date: today,
      warmup: pick(words, 5, rnd),
      speak: pick(sents, 5, rnd),
      talk: pick(C.dialogues, 3, rnd),
      quiz: pick(quizPool, 5, rnd).map((item) => {
        const distr = pick(quizPool.filter((x) => x.ja !== item.ja), 3, rnd);
        const opts = pick([item].concat(distr), 4, rnd);
        return { item, options: opts, answer: opts.indexOf(item) };
      }),
    };
  }

  const STEPS = [
    { key: 'warmup', label: 'ウォームアップ', emoji: '🔥' },
    { key: 'speak', label: 'キーフレーズ', emoji: '🗣️' },
    { key: 'talk', label: 'ミニ会話', emoji: '💬' },
    { key: 'quiz', label: '仕上げクイズ', emoji: '🧩' },
  ];

  function render(container) {
    if (!plan || plan.date !== window.Store.todayStr()) plan = buildPlan();
    if (!st) { drawIntro(container); return; }
    drawStep(container);
  }

  function isDoneToday() {
    const d = window.Store.progress.lessonDone || {};
    return !!d[window.Store.todayStr()];
  }

  function drawIntro(container) {
    const done = isDoneToday();
    container.innerHTML = `
      <button class="text-sm text-gray-400 mb-3 back-home">← ホーム</button>
      <div class="rounded-3xl p-6 text-white shadow-md mb-5 relative overflow-hidden" style="background:linear-gradient(135deg,#6d28d9,#ec4899)">
        <div class="text-[11px] font-semibold opacity-80">TODAY'S LESSON · ${plan.date}</div>
        <div class="text-2xl font-bold mt-1">今日のレッスン</div>
        <div class="text-sm opacity-90 mt-1">${done ? '本日は達成済み！復習にもう一周できます' : '4ステップ・約5分の総合トレーニング'}</div>
        <div class="absolute -right-3 -bottom-3 text-7xl opacity-20">🎓</div>
      </div>
      <div class="space-y-2.5 mb-6">
        ${STEPS.map((s, i) => `
          <div class="flex items-center gap-3 bg-white border border-gray-100 rounded-2xl p-3.5 shadow-sm">
            <div class="w-9 h-9 rounded-full bg-violet-50 text-brand flex items-center justify-center font-bold">${i + 1}</div>
            <div class="flex-1"><div class="font-bold text-gray-800 text-sm">${s.emoji} ${s.label}</div>
              <div class="text-xs text-gray-500">${stepDesc(s.key)}</div></div>
          </div>`).join('')}
      </div>
      <button id="lesson-start" class="w-full brand-grad text-white rounded-2xl py-3.5 font-bold shadow-md">${done ? 'もう一度挑戦する' : '▶ レッスンを始める'}</button>
    `;
    bindBack(container);
    container.querySelector('#lesson-start').onclick = () => { st = { step: 0, i: 0, results: { speak: [], quiz: 0, talk: [] } }; drawStep(container); };
  }

  function stepDesc(key) {
    if (key === 'warmup') return `単語 ${plan.warmup.length} 語をさっと確認`;
    if (key === 'speak') return `重要フレーズ ${plan.speak.length} 文を発音`;
    if (key === 'talk') return `会話 ${plan.talk.length} 場面を実践`;
    return `${plan.quiz.length} 問で理解度チェック`;
  }

  function stepper(active) {
    return `<div class="flex items-center gap-1.5 mb-4">
      ${STEPS.map((s, i) => `<div class="flex-1 h-1.5 rounded-full ${i < active ? 'bg-green-400' : i === active ? 'brand-grad' : 'bg-gray-200'}"></div>`).join('')}
    </div>
    <div class="text-center text-xs font-bold text-gray-400 mb-3">STEP ${active + 1}/4 · ${STEPS[active].emoji} ${STEPS[active].label}</div>`;
  }

  function drawStep(container) {
    const s = STEPS[st.step];
    if (s.key === 'warmup') drawWarmup(container);
    else if (s.key === 'speak') drawSpeak(container);
    else if (s.key === 'talk') drawTalk(container);
    else drawQuiz(container);
  }

  function advance(container) {
    // 次の項目 or 次のステップ
    const s = STEPS[st.step];
    const listLen = plan[s.key].length;
    if (st.i < listLen - 1) { st.i++; st.sub = null; drawStep(container); }
    else if (st.step < STEPS.length - 1) { st.step++; st.i = 0; st.sub = null; drawStep(container); }
    else finish(container);
  }

  // --- STEP 1: ウォームアップ（単語） ---
  function drawWarmup(container) {
    const w = plan.warmup[st.i];
    const revealed = st.sub === 'r';
    container.innerHTML = stepper(0) + `
      <div class="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm text-center" style="min-height:230px">
        <div class="text-xs text-gray-400 mb-1">${st.i + 1} / ${plan.warmup.length}</div>
        <div class="text-3xl font-extrabold text-gray-800 mt-6">${window.App.escapeHtml(w.en)}</div>
        <button id="l-tts" class="mt-3 bg-violet-50 text-brand rounded-full px-4 py-2 text-sm font-semibold">🔊 発音</button>
        <div class="mt-5 text-lg text-gray-600 ${revealed ? '' : 'blur-sm select-none'}">${window.App.escapeHtml(w.ja)}</div>
        ${w.note && revealed ? `<div class="text-xs text-gray-400 mt-2">${window.App.escapeHtml(w.note)}</div>` : ''}
      </div>
      <button id="l-next" class="w-full mt-5 ${revealed ? 'bg-gray-800' : 'brand-grad'} text-white rounded-2xl py-3.5 font-bold">${revealed ? '次へ →' : '意味を確認'}</button>
    `;
    container.querySelector('#l-tts').onclick = () => window.Speech.speak(w.en, { rate: 0.9 });
    setTimeout(() => window.Speech.speak(w.en, { rate: 0.9 }), 200);
    container.querySelector('#l-next').onclick = () => {
      if (!revealed) { st.sub = 'r'; drawStep(container); }
      else { window.Store.recordActivity(2); advance(container); }
    };
  }

  // --- STEP 2: キーフレーズ発音 ---
  function drawSpeak(container) {
    const item = plan.speak[st.i];
    const res = st.sub;
    container.innerHTML = stepper(1) + `
      <div class="bg-white border border-gray-100 rounded-3xl p-5 shadow-sm mb-4">
        <div class="text-xs text-gray-400 mb-2">${st.i + 1} / ${plan.speak.length}</div>
        <div class="text-xl font-bold text-gray-800 leading-relaxed">${window.App.escapeHtml(item.en)}</div>
        <div class="text-sm text-gray-500 mt-2">${window.App.escapeHtml(item.ja)}</div>
        <button id="l-play" class="mt-3 bg-violet-50 text-brand rounded-full px-4 py-2 text-sm font-semibold">🔊 お手本</button>
      </div>
      <div id="l-res" class="mb-4"></div>
      <div class="flex flex-col items-center gap-2">
        <button id="l-mic" class="mic-btn brand-grad"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <div id="l-hint" class="text-xs text-gray-400 h-4">${window.Speech.asrSupported ? 'タップして発音' : '⚠️ 音声認識に非対応'}</div>
      </div>
      <button id="l-skip" class="w-full mt-5 bg-gray-100 text-gray-500 rounded-2xl py-3 font-bold text-sm">${res ? '次へ →' : 'スキップ →'}</button>
    `;
    container.querySelector('#l-play').onclick = () => window.Speech.speak(item.en, { rate: 0.95 });
    container.querySelector('#l-mic').onclick = () => micScore(container, item.en, 'l', (r) => {
      st.sub = r; st.results.speak.push(r.score);
      renderInlineScore(container.querySelector('#l-res'), r);
      container.querySelector('#l-skip').textContent = '次へ →';
    });
    container.querySelector('#l-skip').onclick = () => advance(container);
    if (res) renderInlineScore(container.querySelector('#l-res'), res);
  }

  // --- STEP 3: ミニ会話 ---
  function drawTalk(container) {
    const d = plan.talk[st.i];
    const res = st.sub;
    container.innerHTML = stepper(2) + `
      <div class="flex items-start gap-2 mb-3">
        <div class="w-8 h-8 rounded-full brand-grad text-white flex items-center justify-center text-xs shrink-0">A</div>
        <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm p-3 shadow-sm">
          <div class="font-semibold text-gray-800">${window.App.escapeHtml(d.a)}</div>
          <div class="text-xs text-gray-500 mt-0.5">${window.App.escapeHtml(d.aJa)}</div>
          <button id="l-playa" class="text-brand text-xs font-semibold mt-1">🔊 もう一度</button>
        </div>
      </div>
      <div class="flex items-start gap-2 flex-row-reverse mb-4">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs shrink-0" style="background:var(--brand2);color:#fff">You</div>
        <div class="rounded-2xl rounded-tr-sm p-3 ${res ? 'bg-pink-50 border border-pink-100' : 'bg-gray-50 border border-dashed border-gray-300'}">
          <div class="text-xs text-gray-500 mb-1">こう答えよう</div>
          <div class="font-medium text-gray-800">${window.App.escapeHtml(d.bJa)}</div>
          <div class="mt-1 font-bold text-gray-800 ${res ? '' : 'blur-sm select-none'}">${window.App.escapeHtml(d.b)}</div>
        </div>
      </div>
      <div id="l-res" class="mb-4"></div>
      <div class="flex flex-col items-center gap-2">
        <button id="l-mic" class="mic-btn brand-grad"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <div id="l-hint" class="text-xs text-gray-400 h-4">${window.Speech.asrSupported ? 'Bのセリフを発音' : '⚠️ 音声認識に非対応'}</div>
      </div>
      <button id="l-skip" class="w-full mt-5 bg-gray-100 text-gray-500 rounded-2xl py-3 font-bold text-sm">${res ? '次へ →' : '答えを見て次へ →'}</button>
    `;
    setTimeout(() => window.Speech.speak(d.a, { rate: 0.95 }), 200);
    container.querySelector('#l-playa').onclick = () => window.Speech.speak(d.a, { rate: 0.95 });
    container.querySelector('#l-mic').onclick = () => micScore(container, d.b, 'l', (r) => {
      st.sub = r; st.results.talk.push(r.score);
      drawStep(container);
      window.Speech.speak(d.b, { rate: 0.9 });
    });
    container.querySelector('#l-skip').onclick = () => advance(container);
    if (res) renderInlineScore(container.querySelector('#l-res'), res);
  }

  // --- STEP 4: 仕上げクイズ ---
  function drawQuiz(container) {
    const q = plan.quiz[st.i];
    container.innerHTML = stepper(3) + `
      <div class="text-center text-xs text-gray-400 mb-3">Q ${st.i + 1} / ${plan.quiz.length}</div>
      <div class="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm text-center mb-4">
        <div class="text-[11px] font-bold text-brand mb-2">意味を選ぼう</div>
        <div class="text-xl font-bold text-gray-800">${window.App.escapeHtml(q.item.en)}</div>
        <button id="l-say" class="mt-2 text-brand text-sm font-semibold">🔊</button>
      </div>
      <div id="l-opts" class="space-y-2.5">
        ${q.options.map((o, i) => `<button data-i="${i}" class="l-opt w-full text-left bg-white border border-gray-200 rounded-2xl px-4 py-3.5 font-medium text-gray-800 shadow-sm">${window.App.escapeHtml(o.ja)}</button>`).join('')}
      </div>`;
    container.querySelector('#l-say').onclick = () => window.Speech.speak(q.item.en, { rate: 0.9 });
    container.querySelectorAll('.l-opt').forEach((b) => {
      b.onclick = () => {
        if (q.picked != null) return;
        q.picked = +b.dataset.i;
        const ok = q.picked === q.answer;
        if (ok) st.results.quiz++;
        window.Store.recordActivity(ok ? 5 : 1);
        container.querySelectorAll('.l-opt').forEach((el, idx) => {
          el.classList.add('pointer-events-none');
          if (idx === q.answer) el.classList.add('opt-correct');
          else if (idx === q.picked) el.classList.add('opt-wrong');
        });
        const nb = document.createElement('button');
        nb.className = 'w-full mt-4 bg-gray-800 text-white rounded-2xl py-3.5 font-bold';
        nb.textContent = st.i < plan.quiz.length - 1 ? '次の問題 →' : '結果を見る';
        nb.onclick = () => advance(container);
        container.appendChild(nb);
      };
    });
  }

  // 共通: 発音採点
  async function micScore(container, target, idPrefix, cb) {
    if (!window.Speech.asrSupported) { window.App.toast('音声認識に非対応のブラウザです'); return; }
    const mic = container.querySelector('#' + idPrefix + '-mic');
    const hint = container.querySelector('#' + idPrefix + '-hint');
    if (listening) { if (micRef.stop) micRef.stop(); return; }
    listening = true; mic.classList.add('listening'); mic.style.background = 'var(--brand2)';
    hint.textContent = '🎤 聞き取り中…';
    window.Speech.stopSpeaking();
    micRef = {};
    try {
      const said = await window.Speech.listenOnce({ ref: micRef, onPartial: (t) => { hint.textContent = '🎤 ' + (t || '…'); } });
      const r = window.Speech.score(target, said);
      r.said = said;
      window.Store.recordSpeaking('lesson', r.score);
      window.App.checkLevelUp();
      cb(r);
      if (r.score >= 80) window.App.toast('🌟 ' + r.score + '点！');
    } catch (e) { hint.textContent = 'もう一度お試しください'; }
    finally { listening = false; mic.classList.remove('listening'); mic.style.background = ''; }
  }

  function renderInlineScore(box, r) {
    if (!box) return;
    const color = window.App.scoreColor(r.score);
    const toks = r.tokens.map((t) => `<span class="wtok ${t.ok ? 'ok' : 'ng'}">${window.App.escapeHtml(t.word)}</span>`).join(' ');
    box.innerHTML = `<div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
      <div class="flex items-center gap-3"><div class="text-3xl font-extrabold" style="color:${color}">${r.score}</div>
      <div class="text-sm font-bold" style="color:${color}">${window.App.scoreLabel(r.score)}</div></div>
      <div class="mt-2 leading-relaxed">${toks}</div></div>`;
  }

  function finish(container) {
    // 記録
    if (!window.Store.progress.lessonDone) window.Store.progress.lessonDone = {};
    const firstToday = !window.Store.progress.lessonDone[window.Store.todayStr()];
    window.Store.progress.lessonDone[window.Store.todayStr()] = true;
    if (firstToday) window.Store.progress.xp += 25; // 完走ボーナス
    window.Store.save();
    window.App.checkLevelUp();
    if (window.Achievements) window.Achievements.check();

    const spk = st.results.speak.concat(st.results.talk);
    const avg = spk.length ? Math.round(spk.reduce((a, b) => a + b, 0) / spk.length) : null;
    container.innerHTML = `
      <div class="text-center py-12">
        <div class="text-6xl mb-3">🎓✨</div>
        <div class="text-2xl font-extrabold text-gray-800">レッスン完了！</div>
        <div class="text-sm text-gray-500 mt-1">${firstToday ? '完走ボーナス +25 XP 🎁' : 'おかえりなさい、もう一周おつかれさま'}</div>
        <div class="grid grid-cols-2 gap-3 max-w-xs mx-auto mt-6">
          <div class="bg-white border border-gray-100 rounded-2xl p-3 shadow-sm"><div class="text-2xl font-bold text-brand">${avg != null ? avg + '%' : '—'}</div><div class="text-[10px] text-gray-400">発音平均</div></div>
          <div class="bg-white border border-gray-100 rounded-2xl p-3 shadow-sm"><div class="text-2xl font-bold" style="color:var(--brand2)">${st.results.quiz}/${plan.quiz.length}</div><div class="text-[10px] text-gray-400">クイズ正解</div></div>
        </div>
        <div class="flex gap-2 mt-6 max-w-xs mx-auto">
          <button id="l-home" class="flex-1 brand-grad text-white rounded-xl py-3 font-bold">ホームへ</button>
          <button id="l-again" class="flex-1 bg-gray-100 text-gray-600 rounded-xl py-3 font-bold">もう一周</button>
        </div>
      </div>`;
    st = null;
    container.querySelector('#l-home').onclick = () => window.App.navigate('home');
    container.querySelector('#l-again').onclick = () => { st = { step: 0, i: 0, results: { speak: [], quiz: 0, talk: [] } }; drawStep(container); };
  }

  function bindBack(container) {
    const b = container.querySelector('.back-home');
    if (b) b.onclick = () => window.App.navigate('home');
  }

  function onLeave() {
    if (micRef.stop) micRef.stop();
    listening = false;
    window.Speech.stopSpeaking();
  }

  window.LessonView = { render, onLeave, isDoneToday };
})();

</script>
  <script>
/* achievements.js — 達成バッジ（ゲーミフィケーション）。window.Achievements */
(function () {
  'use strict';

  // cond(P, ctx) が真になったら解除。ctx は集計値。
  const DEFS = [
    { id: 'lesson1', emoji: '🎓', title: '第一歩', desc: '今日のレッスンを初完了', cond: (c) => c.lessons >= 1 },
    { id: 'streak3', emoji: '🔥', title: '三日坊主卒業', desc: '3日連続で学習', cond: (c) => c.streak >= 3 },
    { id: 'streak7', emoji: '🔥', title: '一週間ランナー', desc: '7日連続で学習', cond: (c) => c.streak >= 7 },
    { id: 'streak30', emoji: '👑', title: '継続は力なり', desc: '30日連続で学習', cond: (c) => c.streak >= 30 },
    { id: 'talk50', emoji: '🗣️', title: 'おしゃべり', desc: '発話50回を達成', cond: (c) => c.attempts >= 50 },
    { id: 'talk200', emoji: '🎤', title: 'スピーカー', desc: '発話200回を達成', cond: (c) => c.attempts >= 200 },
    { id: 'perfect', emoji: '💯', title: '完璧な発音', desc: '発音100点を獲得', cond: (c) => c.maxScore >= 100 },
    { id: 'cards50', emoji: '🎴', title: '語彙ビルダー', desc: 'カード50枚を習得', cond: (c) => c.learned >= 50 },
    { id: 'cards200', emoji: '📚', title: '単語の達人', desc: 'カード200枚を習得', cond: (c) => c.learned >= 200 },
    { id: 'lv5', emoji: '⭐', title: 'レベル5到達', desc: 'レベル5に到達', cond: (c) => c.level >= 5 },
    { id: 'lv10', emoji: '🌟', title: 'レベル10到達', desc: 'レベル10に到達', cond: (c) => c.level >= 10 },
    { id: 'xp1000', emoji: '🏆', title: 'XPハンター', desc: '累計1000XPを獲得', cond: (c) => c.xp >= 1000 },
  ];

  function ctx() {
    const S = window.Store;
    const P = S.progress;
    const deck = window.CardsView ? window.CardsView.buildDeck() : [];
    const srs = window.CardsView ? S.srsSummary(deck) : { learned: 0 };
    return {
      lessons: Object.keys(P.lessonDone || {}).length,
      streak: P.streak.count,
      attempts: (P.speaking || []).length,
      maxScore: (P.speaking || []).reduce((m, r) => Math.max(m, r.score), 0),
      learned: srs.learned,
      level: S.levelInfo().level,
      xp: P.xp,
    };
  }

  function check(opts) {
    const silent = opts && opts.silent;
    const S = window.Store;
    if (!S.progress.achievements) S.progress.achievements = {};
    const got = S.progress.achievements;
    const c = ctx();
    let unlocked = null;
    let changed = false;
    DEFS.forEach((d) => {
      if (!got[d.id] && d.cond(c)) {
        got[d.id] = window.Store.todayStr();
        unlocked = d;
        changed = true;
      }
    });
    if (changed) S.save();
    if (unlocked && !silent) celebrate(unlocked);
  }

  // 起動時: 既に条件を満たすバッジを演出なしで反映
  function sync() { check({ silent: true }); }

  function celebrate(d) {
    const div = document.createElement('div');
    div.innerHTML = `<div class="fixed inset-0 z-[60] bg-black/50 flex items-center justify-center p-6" id="ach-ov">
      <div class="bg-white rounded-3xl p-6 text-center max-w-[300px] shadow-2xl" style="animation:fade .3s ease">
        <div class="text-xs font-bold text-brand">バッジ獲得！</div>
        <div class="text-6xl my-3">${d.emoji}</div>
        <div class="text-lg font-extrabold text-gray-800">${d.title}</div>
        <div class="text-sm text-gray-500 mt-1">${d.desc}</div>
        <button id="ach-close" class="w-full mt-5 brand-grad text-white rounded-xl py-2.5 font-bold">やったー！</button>
      </div></div>`;
    document.body.appendChild(div);
    const close = () => div.remove();
    div.querySelector('#ach-close').onclick = close;
    div.querySelector('#ach-ov').onclick = (e) => { if (e.target.id === 'ach-ov') close(); };
  }

  function all() {
    const got = window.Store.progress.achievements || {};
    return DEFS.map((d) => ({ ...d, unlocked: !!got[d.id], at: got[d.id] || null }));
  }

  window.Achievements = { check, sync, all, DEFS };
})();

</script>
  <script>
/* freetalk.js — AI会話（フリートーク）。Speak型のAI会話パートナー。
 * Anthropic API を利用（CRMと同じ localStorage キー peach.anthropicApiKey を共用）。
 * window.FreetalkView
 */
(function () {
  'use strict';

  const API_KEY_STORAGE = 'peach.anthropicApiKey';
  const MODEL = 'claude-haiku-4-5-20251001'; // 会話はテンポ重視で高速モデル
  const HISTORY_KEY = 'speak.freetalk.v1';

  let micRef = {};
  let listening = false;
  let busy = false;

  const SCENARIOS = [
    { key: 'chat', emoji: '☕', title: '日常の雑談', desc: '天気・週末・趣味など気軽に',
      opener: "Hi Watanabe-san! It's great to see you. How's your day going so far?" },
    { key: 'restaurant', emoji: '🍽️', title: 'レストラン', desc: '注文・おすすめを聞く',
      opener: "Good evening! Welcome to our restaurant. Here's the menu. Can I get you something to drink first?" },
    { key: 'travel', emoji: '✈️', title: '旅行の話', desc: '東北旅行の予定を英語で',
      opener: "I heard you're planning a road trip to Tohoku! That sounds exciting. Where will you go first?" },
    { key: 'business', emoji: '💼', title: 'ビジネス自己紹介', desc: '会社や仕事を紹介',
      opener: "Nice to meet you! I don't think we've met before. Could you tell me a little about yourself and your company?" },
    { key: 'shopping', emoji: '🛍️', title: '買い物・返品', desc: '店員とのやりとり',
      opener: "Hi there! Welcome. Are you looking for anything in particular today?" },
    { key: 'meat', emoji: '🥩', title: 'お肉の商談', desc: '精肉卸として英語で提案',
      opener: "Hello! I run a restaurant and I'm looking for a new meat supplier. What kind of products do you offer?" },
  ];

  function systemPrompt(sc) {
    return `You are a warm, encouraging English conversation partner for a Japanese adult learner named Watanabe-san, the president of a meat wholesale company in Nagoya. His English is around intermediate level (CEFR A2-B1).

Rules:
- Reply ONLY in natural, spoken English. Keep replies SHORT: 1-2 sentences maximum.
- Stay in this scenario: "${sc.title}" (${sc.desc}).
- Speak clearly and simply. Avoid rare idioms unless you explain them.
- Always end your reply with a simple follow-up question so the conversation keeps flowing.
- If Watanabe-san makes a clear mistake, gently model the correct sentence inside your reply (naturally, without lecturing).
- Be positive and patient. Never switch to Japanese unless explicitly asked.`;
  }

  function getKey() { try { return localStorage.getItem(API_KEY_STORAGE) || ''; } catch (e) { return ''; } }
  function setKey(k) { try { localStorage.setItem(API_KEY_STORAGE, k || ''); } catch (e) {} }

  // 状態: { sc, messages:[{role, en, ja}] }
  let convo = null;
  function loadConvo() {
    try { const r = localStorage.getItem(HISTORY_KEY); if (r) return JSON.parse(r); } catch (e) {}
    return null;
  }
  function saveConvo() { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(convo)); } catch (e) {} }

  function render(container) {
    convo = loadConvo();
    if (!convo || !convo.sc) { drawScenarioPicker(container); return; }
    drawChat(container);
  }

  function drawScenarioPicker(container) {
    container.innerHTML = `
      <button class="text-sm text-gray-400 mb-3 back-home">← ホーム</button>
      <div class="text-center mb-5">
        <div class="text-5xl mb-2">🤖💬</div>
        <div class="text-lg font-bold text-gray-800">AIと英会話</div>
        <div class="text-sm text-gray-500 mt-1">場面を選んで、声に出して会話しよう</div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        ${SCENARIOS.map((s) => `
          <button data-sc="${s.key}" class="row bg-white border border-gray-100 rounded-2xl p-4 shadow-sm text-left">
            <div class="text-3xl mb-1">${s.emoji}</div>
            <div class="font-bold text-gray-800 text-sm">${s.title}</div>
            <div class="text-[11px] text-gray-500 mt-0.5">${s.desc}</div>
          </button>`).join('')}
      </div>
      ${getKey() ? '' : `<div class="mt-5 text-xs text-gray-500 bg-amber-50 border border-amber-100 rounded-xl px-3 py-2">
        💡 AI会話にはAnthropic APIキーが必要です（経営分析と共用・Anthropicのみに送信）。会話を始めると入力欄が出ます。</div>`}
    `;
    bindBack(container);
    container.querySelectorAll('[data-sc]').forEach((b) => {
      b.onclick = () => {
        const sc = SCENARIOS.find((x) => x.key === b.dataset.sc);
        convo = { sc, messages: [{ role: 'assistant', en: sc.opener, ja: '' }] };
        saveConvo();
        drawChat(container);
        window.Speech.speak(sc.opener, { rate: 0.95 });
      };
    });
  }

  function drawChat(container) {
    const sc = convo.sc;
    const asr = window.Speech.asrSupported;
    container.innerHTML = `
      <div class="flex items-center justify-between mb-3">
        <button class="text-sm text-gray-400 back-home">← ホーム</button>
        <div class="text-sm font-bold text-gray-700">${sc.emoji} ${sc.title}</div>
        <button id="ft-reset" class="text-xs text-gray-400 underline">場面を変える</button>
      </div>
      <div id="ft-log" class="space-y-3 mb-4"></div>
      <div id="ft-typing" class="text-xs text-gray-400 mb-2 hidden-x">AIが入力中…</div>

      <div class="sticky bottom-[84px] bg-white pt-2">
        <div class="flex items-end gap-2">
          <button id="ft-mic" class="shrink-0 w-12 h-12 rounded-full brand-grad text-white flex items-center justify-center shadow-md">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <textarea id="ft-input" rows="1" placeholder="英語で入力 or 🎤で話す" class="flex-1 border border-gray-200 rounded-2xl px-3 py-2.5 text-sm resize-none max-h-24"></textarea>
          <button id="ft-send" class="shrink-0 w-12 h-12 rounded-full bg-gray-800 text-white flex items-center justify-center">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="flex gap-3 mt-2 px-1">
          <button id="ft-hint" class="text-xs text-brand font-semibold">💡 何て言えばいい？</button>
          <span id="ft-status" class="text-xs text-gray-400"></span>
        </div>
      </div>
    `;
    bindBack(container);
    renderLog(container);

    container.querySelector('#ft-reset').onclick = () => {
      convo = null; try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
      drawScenarioPicker(container);
    };
    const input = container.querySelector('#ft-input');
    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(96, input.scrollHeight) + 'px'; });
    container.querySelector('#ft-send').onclick = () => {
      const t = input.value.trim();
      if (t) { input.value = ''; input.style.height = 'auto'; sendUser(container, t); }
    };
    container.querySelector('#ft-mic').onclick = () => micInput(container);
    container.querySelector('#ft-hint').onclick = () => askHint(container);
  }

  function renderLog(container) {
    const log = container.querySelector('#ft-log');
    if (!log) return;
    log.innerHTML = convo.messages.map((m, i) => {
      if (m.role === 'assistant') {
        return `
          <div class="flex items-start gap-2">
            <div class="w-8 h-8 rounded-full brand-grad text-white flex items-center justify-center text-xs shrink-0">AI</div>
            <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm p-3 shadow-sm max-w-[85%]">
              <div class="text-gray-800">${window.App.escapeHtml(m.en)}</div>
              ${m.ja ? `<div class="text-xs text-gray-500 mt-1">${window.App.escapeHtml(m.ja)}</div>` : ''}
              <div class="flex gap-3 mt-1.5">
                <button class="ft-say text-brand text-xs font-semibold" data-i="${i}">🔊</button>
                <button class="ft-tr text-gray-400 text-xs" data-i="${i}">和訳</button>
              </div>
            </div>
          </div>`;
      }
      return `
        <div class="flex items-start gap-2 flex-row-reverse">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs shrink-0" style="background:var(--brand2);color:#fff">You</div>
          <div class="rounded-2xl rounded-tr-sm p-3 max-w-[85%] bg-pink-50 border border-pink-100">
            <div class="text-gray-800">${window.App.escapeHtml(m.en)}</div>
          </div>
        </div>`;
    }).join('');
    log.querySelectorAll('.ft-say').forEach((b) => {
      b.onclick = () => window.Speech.speak(convo.messages[+b.dataset.i].en, { rate: 0.95 });
    });
    log.querySelectorAll('.ft-tr').forEach((b) => {
      b.onclick = () => translateMsg(container, +b.dataset.i);
    });
    log.scrollIntoView && window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  async function micInput(container) {
    if (!window.Speech.asrSupported) { window.App.toast('音声認識に非対応のブラウザです'); return; }
    const mic = container.querySelector('#ft-mic');
    const status = container.querySelector('#ft-status');
    if (listening) { if (micRef.stop) micRef.stop(); return; }
    listening = true;
    mic.classList.add('listening');
    status.textContent = '🎤 聞き取り中…';
    window.Speech.stopSpeaking();
    micRef = {};
    try {
      const said = await window.Speech.listenOnce({ ref: micRef, onPartial: (t) => { status.textContent = '🎤 ' + (t || '…'); } });
      status.textContent = '';
      if (said && said.trim()) sendUser(container, said.trim());
    } catch (e) { status.textContent = 'もう一度お試しください'; }
    finally { listening = false; mic.classList.remove('listening'); }
  }

  async function callAnthropic(messages, system, maxTokens) {
    if (window.__ARTIFACT__) {
      throw new Error('AI会話はこの共有版では利用できません。GitHub/ローカル版でAPIキーを設定してご利用ください。');
    }
    let key = getKey();
    if (!key) {
      key = await promptForKey();
      if (!key) throw new Error('APIキーが必要です');
      setKey(key.trim());
    }
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({ model: MODEL, max_tokens: maxTokens || 300, system, messages }),
    });
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      if (res.status === 401 || res.status === 403) setKey('');
      throw new Error(`API ${res.status}: ${t.slice(0, 200)}`);
    }
    const data = await res.json();
    return (data.content || []).map((b) => b.text || '').join('').trim();
  }

  function apiMessages() {
    return convo.messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.en }));
  }

  async function sendUser(container, text) {
    if (busy) return;
    convo.messages.push({ role: 'user', en: text });
    saveConvo();
    renderLog(container);
    const typing = container.querySelector('#ft-typing');
    typing.classList.remove('hidden-x');
    busy = true;
    try {
      const reply = await callAnthropic(apiMessages(), systemPrompt(convo.sc), 300);
      convo.messages.push({ role: 'assistant', en: reply, ja: '' });
      saveConvo();
      window.Store.recordActivity(8);
      window.App.checkLevelUp();
      renderLog(container);
      window.Speech.speak(reply, { rate: 0.95 });
    } catch (e) {
      window.App.toast(e.message.startsWith('API') ? e.message : 'AI応答に失敗しました');
      const status = container.querySelector('#ft-status');
      if (status) status.textContent = '⚠️ ' + e.message;
    } finally {
      busy = false;
      if (typing) typing.classList.add('hidden-x');
    }
  }

  async function translateMsg(container, i) {
    const m = convo.messages[i];
    if (m.ja) return; // 既に翻訳済み
    try {
      const ja = await callAnthropic(
        [{ role: 'user', content: `Translate this English into natural Japanese. Output ONLY the Japanese, nothing else:\n\n${m.en}` }],
        'You are a precise English-to-Japanese translator.', 200);
      m.ja = ja;
      saveConvo();
      renderLog(container);
    } catch (e) { window.App.toast('翻訳に失敗しました'); }
  }

  async function askHint(container) {
    const status = container.querySelector('#ft-status');
    status.textContent = '💭 ヒントを考え中…';
    try {
      const hint = await callAnthropic(
        apiMessages().concat([{ role: 'user', content: '(Coach aside) Suggest ONE natural, simple English sentence I could say next in this conversation. Give the English sentence, then its Japanese translation in parentheses. Keep it to one line.' }]),
        systemPrompt(convo.sc), 150);
      status.textContent = '';
      showHint(container, hint);
    } catch (e) { status.textContent = 'ヒント取得に失敗しました'; }
  }

  function showHint(container, hint) {
    const div = document.createElement('div');
    div.innerHTML = `<div class="fixed inset-0 z-50 bg-black/40 flex items-end justify-center" id="hint-ov">
      <div class="bg-white w-full max-w-[560px] rounded-t-3xl p-5">
        <div class="font-bold text-gray-800 mb-2">💡 こう言ってみよう</div>
        <div class="text-gray-700 bg-violet-50 rounded-xl p-3 text-sm leading-relaxed">${window.App.escapeHtml(hint)}</div>
        <button id="hint-close" class="w-full mt-4 brand-grad text-white rounded-xl py-2.5 font-bold">閉じる</button>
      </div></div>`;
    document.body.appendChild(div);
    const close = () => div.remove();
    div.querySelector('#hint-close').onclick = close;
    div.querySelector('#hint-ov').onclick = (e) => { if (e.target.id === 'hint-ov') close(); };
  }

  function promptForKey() {
    return new Promise((resolve) => {
      const div = document.createElement('div');
      div.innerHTML = `<div class="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4" id="key-ov">
        <div class="bg-white w-full max-w-[440px] rounded-2xl p-5">
          <div class="font-bold text-lg mb-1">Anthropic APIキー</div>
          <div class="text-xs text-gray-500 mb-3">AI会話にはAnthropic APIキーが必要です。キーは端末内(localStorage)に保存され、Anthropic以外へは送信されません。経営分析AIと共用です。</div>

    listening = false;

  window.FreetalkView = { render, onLeave };

/* quiz.js — リスニング＆意味クイズ（4択・ゲーミフィケーション）
 * window.QuizView
 */
(function () {
  'use strict';

  let state = null; // { questions, idx, correct, mode }

  function pool() {
    const C = window.Store.content;
    // 文・意味がそろっている項目のみ出題対象に
    const items = []
      .concat(C.phrases.map((p) => ({ en: p.en, ja: p.ja })))
      .concat(C.notes.map((n) => ({ en: n.en, ja: n.ja })))
      .filter((x) => x.en && x.ja && x.ja.length <= 40);
    return items;
  }

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQuestions(mode, n) {
    const all = pool();
    const picked = shuffle(all).slice(0, n);
    return picked.map((item) => {
      // ダミー選択肢を3つ
      const distractors = shuffle(all.filter((x) => x.ja !== item.ja)).slice(0, 3);
      const opts = shuffle([item].concat(distractors));
      return {
        item,
        mode, // 'listen'（英語音声→意味）/ 'ja2en'（日本語→英語）/ 'en2ja'（英語→意味）
        options: opts,
        answer: opts.indexOf(item),
      };
    });
  }

  function render(container) {
    if (!state) { drawStart(container); return; }
    drawQuestion(container);
  }

  function drawStart(container) {
    container.innerHTML = `
      <button class="text-sm text-gray-400 mb-3 back-home">← ホーム</button>
      <div class="text-center mb-5">
        <div class="text-5xl mb-2">🧩</div>
        <div class="text-lg font-bold text-gray-800">クイズで力だめし</div>
        <div class="text-sm text-gray-500 mt-1">10問4択・出題形式を選んでね</div>
      </div>
      <div class="space-y-3">
        <button data-mode="listen" class="row w-full bg-white border border-gray-100 rounded-2xl p-4 shadow-sm text-left flex items-center gap-3">
          <div class="text-3xl">🔊</div><div><div class="font-bold text-gray-800">リスニング</div><div class="text-xs text-gray-500">英語を聞いて意味を選ぶ</div></div>
        </button>
        <button data-mode="en2ja" class="row w-full bg-white border border-gray-100 rounded-2xl p-4 shadow-sm text-left flex items-center gap-3">
          <div class="text-3xl">🔤</div><div><div class="font-bold text-gray-800">英語 → 意味</div><div class="text-xs text-gray-500">英文を読んで意味を選ぶ</div></div>
        </button>
        <button data-mode="ja2en" class="row w-full bg-white border border-gray-100 rounded-2xl p-4 shadow-sm text-left flex items-center gap-3">
          <div class="text-3xl">🇯🇵</div><div><div class="font-bold text-gray-800">意味 → 英語</div><div class="text-xs text-gray-500">日本語に合う英語を選ぶ</div></div>
        </button>
      </div>`;
    bindBack(container);
    container.querySelectorAll('[data-mode]').forEach((b) => {
      b.onclick = () => {
        state = { questions: buildQuestions(b.dataset.mode, 10), idx: 0, correct: 0, mode: b.dataset.mode };
        drawQuestion(container);
      };
    });
  }

  function drawQuestion(container) {
    const q = state.questions[state.idx];
    if (!q) { drawResult(container); return; }
    const isListen = q.mode === 'listen';
    const prompt = q.mode === 'ja2en' ? q.item.ja : q.item.en;
    const optText = (o) => (q.mode === 'ja2en' ? o.en : o.ja);

    container.innerHTML = `
      <div class="flex items-center justify-between mb-2 text-xs font-semibold text-gray-400">
        <span>Q ${state.idx + 1} / ${state.questions.length}</span>
        <span>正解 ${state.correct}</span>
      </div>
      <div class="h-1.5 bg-gray-100 rounded-full mb-5 overflow-hidden">
        <div class="h-full brand-grad rounded-full transition-all" style="width:${(state.idx / state.questions.length) * 100}%"></div>
      </div>

      <div class="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm text-center mb-5">
        <div class="text-[11px] font-bold text-brand mb-2">${isListen ? '音声を聞いて意味を選ぼう' : q.mode === 'ja2en' ? '日本語に合う英語は？' : '意味を選ぼう'}</div>
        ${isListen
          ? `<button id="q-play" class="w-20 h-20 rounded-full brand-grad text-white mx-auto flex items-center justify-center text-3xl shadow-md">🔊</button>
             <div class="text-xs text-gray-400 mt-3">タップで再生</div>`
          : `<div class="text-xl font-bold text-gray-800 leading-relaxed">${window.App.escapeHtml(prompt)}</div>`}
      </div>

      <div id="q-opts" class="space-y-2.5">
        ${q.options.map((o, i) => `
          <button data-i="${i}" class="q-opt w-full text-left bg-white border border-gray-200 rounded-2xl px-4 py-3.5 font-medium text-gray-800 shadow-sm">
            ${window.App.escapeHtml(optText(o))}
          </button>`).join('')}
      </div>`;
    bindBack(container);

    if (isListen) {
      const play = () => window.Speech.speak(q.item.en, { rate: 0.9 });
      container.querySelector('#q-play').onclick = play;
      setTimeout(play, 300);
    }
    container.querySelectorAll('.q-opt').forEach((b) => {
      b.onclick = () => choose(container, parseInt(b.dataset.i, 10));
    });
  }

  function choose(container, i) {
    const q = state.questions[state.idx];
    if (q.picked != null) return;
    q.picked = i;
    const correct = i === q.answer;
    if (correct) state.correct++;
    window.Store.recordActivity(correct ? 5 : 1);
    window.App.checkLevelUp();

    container.querySelectorAll('.q-opt').forEach((b, idx) => {
      b.classList.add('pointer-events-none');
      if (idx === q.answer) b.classList.add('opt-correct');
      else if (idx === i) b.classList.add('opt-wrong');
    });
    // 正解の英語を読み上げ（リスニング以外でも定着）
    if (correct) window.App.toast('⭕ 正解！');

    const bar = document.createElement('div');
    bar.className = 'mt-4';
    bar.innerHTML = `
      <div class="bg-gray-50 rounded-2xl p-4 text-sm">
        <div class="font-bold text-gray-800">${window.App.escapeHtml(q.item.en)}</div>
        <div class="text-gray-500 mt-1">${window.App.escapeHtml(q.item.ja)}</div>
      </div>
      <button id="q-next" class="w-full mt-3 bg-gray-800 text-white rounded-xl py-3 font-bold">${state.idx < state.questions.length - 1 ? '次の問題 →' : '結果を見る'}</button>`;
    container.appendChild(bar);
    container.querySelector('#q-next').onclick = () => { state.idx++; drawQuestion(container); };
  }

  function drawResult(container) {
    const total = state.questions.length;
    const pct = Math.round((state.correct / total) * 100);
    const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 50 ? '👍' : '💪';
    container.innerHTML = `
      <div class="text-center py-12">
        <div class="text-6xl mb-3">${emoji}</div>
        <div class="text-2xl font-extrabold text-gray-800">${state.correct} / ${total} 正解</div>
        <div class="text-lg font-bold text-brand mt-1">${pct}点</div>
        <div class="text-sm text-gray-500 mt-2">${pct >= 70 ? 'すばらしい！この調子です' : 'カード復習で弱点を補強しよう'}</div>
        <div class="flex gap-2 mt-6 max-w-xs mx-auto">
          <button id="q-again" class="flex-1 brand-grad text-white rounded-xl py-3 font-bold">もう一度</button>
          <button id="q-home" class="flex-1 bg-gray-100 text-gray-600 rounded-xl py-3 font-bold">ホーム</button>
        </div>
      </div>`;
    container.querySelector('#q-again').onclick = () => { state = null; drawStart(container); };
    container.querySelector('#q-home').onclick = () => { state = null; window.App.navigate('home'); };
  }

  function bindBack(container) {
    const b = container.querySelector('.back-home');
    if (b) b.onclick = () => { state = null; window.App.navigate('home'); };
  }

  function onLeave() { window.Speech.stopSpeaking(); }

  window.QuizView = { render, onLeave };
})();

</script>

(function () {

  // 学習カレンダー（貢献グラフ風ヒートマップ・直近約12週）
  function calendarHtml() {
    const P = window.Store.progress;
    const daily = P.daily || {};
    const WEEKS = 12;
    const today = new Date();
    // 週の起点（日曜）に揃える
    const end = new Date(today);
    const start = new Date(today);
    start.setDate(start.getDate() - (WEEKS * 7 - 1));
    // 週×曜日グリッド
    const cols = [];
    let activeDays = 0;
    const cur = new Date(start);
    // startを直近の日曜まで戻す
    cur.setDate(cur.getDate() - cur.getDay());
    while (cur <= end) {
      const week = [];
      for (let d = 0; d < 7; d++) {
        const ds = window.Store.todayStr(cur);
        const cnt = (daily[ds] || {}).count || 0;
        const future = cur > today;
        if (cnt > 0) activeDays++;
        week.push({ ds, cnt, future, isToday: ds === window.Store.todayStr() });
        cur.setDate(cur.getDate() + 1);
      }
      cols.push(week);
    }
    const shade = (c, future) => {
      if (future) return 'transparent';
      if (c === 0) return '#f1f0f5';
      if (c < 5) return '#ddd6fe';
      if (c < 10) return '#a78bfa';
      if (c < 20) return '#7c3aed';
      return '#5b21b6';

    return `
      <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm mb-4">
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm font-bold text-gray-700">学習カレンダー</div>
          <div class="text-xs text-gray-400">${activeDays}日 学習</div>
        </div>
        <div class="overflow-x-auto">
          <div style="display:flex;gap:3px;min-width:max-content">
            ${cols.map((w) => `<div style="display:flex;flex-direction:column;gap:3px">
              ${w.map((d) => `<div title="${d.ds}: ${d.cnt}" style="width:12px;height:12px;border-radius:3px;background:${shade(d.cnt, d.future)};${d.isToday ? 'outline:2px solid var(--brand2);outline-offset:1px' : ''}"></div>`).join('')}
            </div>`).join('')}
          </div>
        </div>
        <div class="flex items-center justify-end gap-1 mt-2 text-[10px] text-gray-400">
          少 <span style="width:10px;height:10px;border-radius:2px;background:#f1f0f5;display:inline-block"></span>
          <span style="width:10px;height:10px;border-radius:2px;background:#ddd6fe;display:inline-block"></span>
          <span style="width:10px;height:10px;border-radius:2px;background:#a78bfa;display:inline-block"></span>
          <span style="width:10px;height:10px;border-radius:2px;background:#7c3aed;display:inline-block"></span>
          <span style="width:10px;height:10px;border-radius:2px;background:#5b21b6;display:inline-block"></span> 多
        </div>
      </div>`;
  }

  function achievementsHtml() {
    if (!window.Achievements) return '';
    const list = window.Achievements.all();
    const got = list.filter((a) => a.unlocked).length;
    return `
      <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm mb-4">
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm font-bold text-gray-700">達成バッジ</div>
          <div class="text-xs text-gray-400">${got} / ${list.length}</div>
        </div>
        <div class="grid grid-cols-4 gap-2">
          ${list.map((a) => `
            <div class="text-center ${a.unlocked ? '' : 'opacity-30'}" title="${window.App.escapeHtml(a.title)}">
              <div class="text-2xl ${a.unlocked ? '' : 'grayscale'}">${a.unlocked ? a.emoji : '🔒'}</div>
              <div class="text-[9px] text-gray-500 leading-tight mt-0.5">${window.App.escapeHtml(a.title)}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }

  function stat(emoji, big, label) {
    return `<div class="bg-white border border-gray-100 rounded-2xl p-3 shadow-sm text-center">
      <div class="text-xl">${emoji}</div>
      <div class="text-lg font-extrabold text-gray-800 leading-tight mt-0.5">${big}</div>
      <div class="text-[10px] text-gray-400">${label}</div>
    </div>`;

  function drawDaily(days, counts) {
    const ctx = document.getElementById('c-daily');
    if (!ctx) return;
    charts.push(new window.Chart(ctx, {
      type: 'bar',
      data: {
        labels: days.map((d) => d.slice(5).replace('-', '/')),
        datasets: [{ data: counts, backgroundColor: '#a78bfa', borderRadius: 5, maxBarThickness: 16 }],
      },

/* dict.js — フレーズ辞書（全フレーズ・ノートの検索/ブラウズ）。window.DictView */
(function () {
  'use strict';

  let all = null;
  let query = '';
  let limit = 60;

  function buildIndex() {
    const C = window.Store.content;
    all = []
      .concat(C.phrases.map((p) => ({ key: 'p' + p.id, en: p.en, ja: p.ja, note: p.note, tag: 'フレーズ' })))
      .concat(C.notes.map((n) => ({ key: 'n' + n.id, en: n.en, ja: n.ja, note: n.note, tag: 'ノート' })));
  }

  function render(container) {
    if (!all) buildIndex();
    draw(container);
  }

  function filtered() {
    const q = query.trim().toLowerCase();
    if (!q) return all;
    return all.filter((x) =>
      (x.en && x.en.toLowerCase().includes(q)) ||
      (x.ja && x.ja.includes(query.trim())) ||
      (x.note && x.note.toLowerCase().includes(q))
    );
  }

  function draw(container) {
    const list = filtered();
    const shown = list.slice(0, limit);
    container.innerHTML = `
      <button class="text-sm text-gray-400 mb-3 back-home">← ホーム</button>
      <div class="sticky top-[calc(env(safe-area-inset-top))] z-10 bg-white pb-2">
        <div class="relative">
          <input id="dict-q" value="${window.App.escapeHtml(query)}" placeholder="英語・日本語・キーワードで検索" class="w-full border border-gray-200 rounded-full pl-10 pr-4 py-2.5 text-sm" />
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#9ca3af" stroke-width="2" class="absolute left-3.5 top-3"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
        </div>
        <div class="text-xs text-gray-400 mt-2 px-1">${list.length} 件${query ? '（検索中）' : '（全フレーズ）'}</div>
      </div>
      <div id="dict-list" class="space-y-2 mt-2">
        ${shown.map(rowHtml).join('') || '<div class="text-center text-gray-400 py-10 text-sm">見つかりませんでした</div>'}
      </div>
      ${list.length > limit ? `<button id="dict-more" class="w-full mt-3 bg-gray-100 text-gray-600 rounded-xl py-2.5 font-semibold text-sm">さらに表示（残り ${list.length - limit} 件）</button>` : ''}
    `;
    bindBack(container);

    const q = container.querySelector('#dict-q');
    q.addEventListener('input', debounce(() => { query = q.value; limit = 60; redraw(container, q); }, 200));
    // フォーカス維持のため再描画は最小限
    container.querySelectorAll('.dict-say').forEach((b) => {
      b.onclick = () => window.Speech.speak(b.dataset.en, { rate: 0.9 });
    });
    container.querySelectorAll('.dict-star').forEach((b) => {
      b.onclick = () => {
        const on = window.Store.toggleFavorite(b.dataset.key);
        b.textContent = on ? '★' : '☆';
        b.style.color = on ? '#f59e0b' : '#d1d5db';
      };
    });
    const more = container.querySelector('#dict-more');
    if (more) more.onclick = () => { limit += 60; draw(container); container.querySelector('#dict-q').focus(); };
  }

  function redraw(container, qEl) {
    const pos = qEl.selectionStart;
    draw(container);
    const nq = container.querySelector('#dict-q');

    try { nq.setSelectionRange(pos, pos); } catch (e) {}
  }

  function rowHtml(x) {
    return `
      <div class="bg-white border border-gray-100 rounded-2xl p-3.5 shadow-sm flex items-start gap-2">
        <button class="dict-say shrink-0 w-8 h-8 rounded-full bg-violet-50 text-brand flex items-center justify-center text-sm" data-en="${window.App.escapeHtml(x.en)}">🔊</button>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="chip ${x.tag === 'フレーズ' ? 'bg-violet-50 text-brand' : 'bg-blue-50 text-blue-600'}" style="font-size:10px;padding:1px 7px">${x.tag}</span>
          </div>
          <div class="font-semibold text-gray-800 mt-1">${window.App.escapeHtml(x.en)}</div>
          <div class="text-sm text-gray-500">${window.App.escapeHtml(x.ja)}</div>
          ${x.note ? `<div class="text-xs text-gray-400 mt-1">${window.App.escapeHtml(x.note)}</div>` : ''}
        </div>
        <button class="dict-star shrink-0 text-xl leading-none" data-key="${x.key}" style="color:${window.Store.isFavorite(x.key) ? '#f59e0b' : '#d1d5db'}">${window.Store.isFavorite(x.key) ? '★' : '☆'}</button>
      </div>`;
  }

  function debounce(fn, ms) {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  }

  function bindBack(container) {
    const b = container.querySelector('.back-home');
    if (b) b.onclick = () => window.App.navigate('home');
  }

  window.DictView = { render };
})();

</script>
  <script>
/* review.js — 復習ボックス（お気に入り★ ＋ 苦手フレーズ）。window.ReviewView */
(function () {
  'use strict';

  let tab = 'weak';
  let micRef = {};
  let listening = false;

  function render(container) {
    draw(container);
  }

  function draw(container) {
    const S = window.Store;
    const weak = S.weakItems();
    const favs = S.favoriteItems();
    const list = tab === 'weak' ? weak : favs;

    container.innerHTML = `
      <button class="text-sm text-gray-400 mb-3 back-home">← ホーム</button>
      <div class="flex gap-2 mb-4">
        <button data-tab="weak" class="chip ${tab === 'weak' ? 'brand-grad text-white' : 'bg-gray-100 text-gray-600'}">💪 苦手 <span class="opacity-70">${weak.length}</span></button>
        <button data-tab="fav" class="chip ${tab === 'fav' ? 'brand-grad text-white' : 'bg-gray-100 text-gray-600'}">⭐ お気に入り <span class="opacity-70">${favs.length}</span></button>
      </div>

      ${list.length === 0 ? emptyState() : `
        <div class="text-xs text-gray-400 mb-2 px-1">${tab === 'weak' ? '発音スコアが低い/つまずいた項目。声に出して克服しよう' : '★を付けた項目。マイクで再確認'}</div>
        <div id="rv-list" class="space-y-2"></div>`}
    `;
    bindBack(container);
    container.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => { tab = b.dataset.tab; draw(container); }; });

    const wrap = container.querySelector('#rv-list');
    if (wrap) list.forEach((it) => wrap.appendChild(rowEl(it, container)));
  }

  function emptyState() {
    if (tab === 'weak') {
      return `<div class="text-center py-16 text-gray-400">
        <div class="text-5xl mb-3">🌱</div>
        <div class="font-semibold">まだ苦手はありません</div>
        <div class="text-xs mt-1">発音練習で60点未満だった項目がここに集まります</div>
      </div>`;
    }
    return `<div class="text-center py-16 text-gray-400">
      <div class="text-5xl mb-3">⭐</div>
      <div class="font-semibold">お気に入りは空です</div>
      <div class="text-xs mt-1">発音練習や辞書で★を付けるとここに表示されます</div>
    </div>`;
  }

  function rowEl(it, container) {
    const el = document.createElement('div');
    el.className = 'bg-white border border-gray-100 rounded-2xl p-3.5 shadow-sm';
    const fav = window.Store.isFavorite(it.key);
    el.innerHTML = `
      <div class="flex items-start gap-2">
        <button class="rv-say shrink-0 w-8 h-8 rounded-full bg-violet-50 text-brand flex items-center justify-center text-sm">🔊</button>
        <button class="rv-mic shrink-0 w-8 h-8 rounded-full bg-pink-50 flex items-center justify-center text-sm" style="color:var(--brand2)">🎤</button>
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-gray-800">${window.App.escapeHtml(it.en)}</div>
          <div class="text-sm text-gray-500">${window.App.escapeHtml(it.ja)}</div>
          ${it.score != null ? `<div class="text-xs mt-0.5" style="color:var(--bad)">前回 ${it.score}点</div>` : ''}
          <div class="rv-fb text-xs mt-1"></div>
        </div>
        <button class="rv-star shrink-0 text-xl" style="color:${fav ? '#f59e0b' : '#d1d5db'}">${fav ? '★' : '☆'}</button>
      </div>`;
    el.querySelector('.rv-say').onclick = () => window.Speech.speak(it.en, { rate: 0.9 });
    el.querySelector('.rv-mic').onclick = () => micRow(el, it);
    el.querySelector('.rv-star').onclick = (e) => {
      const on = window.Store.toggleFavorite(it.key);
      e.target.textContent = on ? '★' : '☆';
      e.target.style.color = on ? '#f59e0b' : '#d1d5db';
      if (!on && tab === 'fav') setTimeout(() => draw(container), 150);
    };
    return el;
  }

  async function micRow(el, it) {
    if (!window.Speech.asrSupported) { window.App.toast('音声認識に非対応のブラウザです'); return; }
    if (listening) { if (micRef.stop) micRef.stop(); return; }
    const fb = el.querySelector('.rv-fb');
    const mic = el.querySelector('.rv-mic');
    listening = true; mic.classList.add('listening');
    fb.style.color = '#9ca3af'; fb.textContent = '🎤 聞き取り中…';
    window.Speech.stopSpeaking();
    micRef = {};
    try {
      const said = await window.Speech.listenOnce({ ref: micRef, onPartial: (t) => { fb.textContent = '🎤 ' + (t || '…'); } });
      const r = window.Speech.score(it.en, said);
      fb.style.color = window.App.scoreColor(r.score);
      fb.innerHTML = `${r.score}点 ${window.App.scoreLabel(r.score)} — ${r.tokens.map((t) => `<span class="wtok ${t.ok ? 'ok' : 'ng'}">${window.App.escapeHtml(t.word)}</span>`).join(' ')}`;
      window.Store.recordSpeaking(it.key, r.score);
      window.App.checkLevelUp();
      if (r.score >= 80) window.App.toast('🌟 ' + r.score + '点！克服！');
    } catch (e) { fb.style.color = 'var(--bad)'; fb.textContent = 'もう一度お試しください'; }
    finally { listening = false; mic.classList.remove('listening'); }
  }

  function bindBack(container) {
    const b = container.querySelector('.back-home');
    if (b) b.onclick = () => window.App.navigate('home');
  }

  function onLeave() { if (micRef.stop) micRef.stop(); listening = false; window.Speech.stopSpeaking(); }

  window.ReviewView = { render, onLeave };
})();

</script>
  <script>
/* app.js — ルーター + 共通UIヘルパー。window.App として公開。 */
(function () {
  'use strict';

  const VIEWS = {
    home: { el: 'view-home', title: 'ホーム', mod: () => window.HomeView },
    speaking: { el: 'view-speaking', title: '発音・スピーキング', mod: () => window.SpeakingView },
    roleplay: { el: 'view-roleplay', title: 'ロールプレイ会話', mod: () => window.RoleplayView },
    cards: { el: 'view-cards', title: 'フラッシュカード', mod: () => window.CardsView },
    shadow: { el: 'view-shadow', title: '長文・シャドーイング', mod: () => window.ShadowView },
    listen: { el: 'view-listen', title: '聞き流し', mod: () => window.ListenView },
    lesson: { el: 'view-lesson', title: '今日のレッスン', mod: () => window.LessonView },
    freetalk: { el: 'view-freetalk', title: 'AI会話', mod: () => window.FreetalkView },
    quiz: { el: 'view-quiz', title: 'クイズ', mod: () => window.QuizView },
    stats: { el: 'view-stats', title: '統計・進捗', mod: () => window.StatsView },
    dict: { el: 'view-dict', title: 'フレーズ辞書', mod: () => window.DictView },
    review: { el: 'view-review', title: '復習ボックス', mod: () => window.ReviewView },
  };

  // ボトムナビに載っている主要ビュー
  const NAV_VIEWS = ['home', 'speaking', 'listen', 'cards', 'shadow'];

  let current = null;

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.querySelector('div').textContent = msg;
    t.classList.remove('hidden-x');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('hidden-x'), 1800);
  }

  function refreshHeader() {
    const li = window.Store.levelInfo();
    document.getElementById('hdr-level').textContent = li.level;
    document.getElementById('hdr-streak').textContent = window.Store.progress.streak.count;
    document.getElementById('hdr-xp').textContent = li.xp + ' XP';
    document.getElementById('hdr-xpnext').textContent = 'Lv' + (li.level + 1) + 'まで ' + (li.span - li.into) + ' XP';
    document.getElementById('hdr-xpbar').style.width = li.pct + '%';
  }

  function navigate(name) {
    if (!VIEWS[name]) name = 'home';
    // 前のビューの後始末
    if (current && current !== name) {
      const prevMod = VIEWS[current].mod();
      if (prevMod && prevMod.onLeave) prevMod.onLeave();
    }
    window.Speech.stopSpeaking();

    // 表示切替
    Object.values(VIEWS).forEach((v) => document.getElementById(v.el).classList.remove('active'));
    document.getElementById(VIEWS[name].el).classList.add('active');
    document.getElementById('hdr-title').textContent = VIEWS[name].title;

    // ナビ状態（非ナビビューではホームを弱く点灯）
    document.querySelectorAll('#bottom-nav button').forEach((b) => {
      b.classList.toggle('active', b.dataset.view === name);
    });

    // レンダリング
    const mod = VIEWS[name].mod();
    const container = document.getElementById(VIEWS[name].el);
    if (mod && mod.render) mod.render(container);
    current = name;
    refreshHeader();
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }

  // レベルアップ検知（学習後に呼ぶ）
  let lastLevel = 1;
  function checkLevelUp() {
    const lv = window.Store.levelInfo().level;
    if (lv > lastLevel) {
      toast('🎉 レベル' + lv + 'に上がりました！');
      lastLevel = lv;
    }
    if (window.Achievements) window.Achievements.check();
    refreshHeader();
  }

  // ---- メニューシート（AI会話・クイズ・統計・辞書など） ----
  const MENU = [
    { view: 'lesson', emoji: '🎓', title: '今日のレッスン', desc: '4ステップの総合トレーニング' },
    { view: 'freetalk', emoji: '🤖', title: 'AI会話（フリートーク）', desc: 'AIと自由に英会話' },
    { view: 'listen', emoji: '🎧', title: '聞き流し', desc: '場面別に音声で連続再生' },
    { view: 'roleplay', emoji: '💬', title: 'ロールプレイ会話', desc: '43場面の実践会話' },
    { view: 'shadow', emoji: '📖', title: '長文・シャドーイング', desc: '東北旅行エッセイ他' },
    { view: 'quiz', emoji: '🧩', title: 'クイズ', desc: '4択で力だめし' },
    { view: 'review', emoji: '⭐', title: '復習ボックス', desc: 'お気に入りと苦手を克服' },
    { view: 'stats', emoji: '📊', title: '統計・進捗', desc: '学習の記録を見る' },
    { view: 'dict', emoji: '📚', title: 'フレーズ辞書', desc: '全フレーズを検索' },
  ];
  function openMenu() {
    const div = document.createElement('div');
    div.innerHTML = `
      <div class="fixed inset-0 z-50 bg-black/40 flex items-end justify-center" id="menu-ov">
        <div class="bg-white w-full max-w-[560px] rounded-t-3xl p-5 max-h-[80vh] overflow-y-auto">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-lg">メニュー</h3>
            <button id="menu-close" class="text-gray-400 text-2xl leading-none">&times;</button>
          </div>
          <div class="space-y-2">
            ${MENU.map((m) => `
              <button data-mv="${m.view}" class="row w-full text-left bg-gray-50 rounded-2xl p-3.5 flex items-center gap-3">
                <div class="text-2xl">${m.emoji}</div>
                <div class="flex-1"><div class="font-bold text-gray-800 text-sm">${m.title}</div><div class="text-xs text-gray-500">${m.desc}</div></div>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#c4b5fd" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>
              </button>`).join('')}
          </div>
        </div>
      </div>`;
    document.body.appendChild(div);
    const close = () => div.remove();
    div.querySelector('#menu-close').onclick = close;
    div.querySelector('#menu-ov').onclick = (e) => { if (e.target.id === 'menu-ov') close(); };
    div.querySelectorAll('[data-mv]').forEach((b) => {
      b.onclick = () => { close(); navigate(b.dataset.mv); };
    });
  }

  // ---- テーマ（ライト/ダーク/自動） ----
  const THEME_KEY = 'speak.theme';
  function getTheme() { try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; } }
  function applyTheme(t) {
    const dark = t === 'dark' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#0f0d17' : '#6d28d9');
  }
  function setTheme(t) {
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    applyTheme(t);
  }

  window.App = {
    escapeHtml,
    toast,
    navigate,
    openMenu,
    getTheme,
    setTheme,
    refreshHeader,
    checkLevelUp,
    // 発音スコアの色
    scoreColor(s) {
      if (s >= 80) return 'var(--ok)';
      if (s >= 50) return 'var(--warn)';
      return 'var(--bad)';
    },
    scoreLabel(s) {
      if (s >= 90) return 'Perfect!';
      if (s >= 80) return 'Great!';
      if (s >= 60) return 'Good';
      if (s >= 40) return 'もう少し';
      return 'Try again';
    },
  };

  // 起動
  document.addEventListener('DOMContentLoaded', async () => {
    await window.Store.init();
    applyTheme(getTheme());
    // 「自動」時はOSのテーマ変更に追従
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (getTheme() === 'auto') applyTheme('auto');
      });
    }
    if (window.Achievements) window.Achievements.sync();
    lastLevel = window.Store.levelInfo().level;
    document.querySelectorAll('#bottom-nav button').forEach((b) => {
      b.addEventListener('click', () => navigate(b.dataset.view));
    });
    document.getElementById('hdr-menu').addEventListener('click', openMenu);
    // 非対応ブラウザの案内
    if (!window.Speech.asrSupported) {
      setTimeout(() => toast('音声認識はChrome/Edge/Safari推奨です'), 800);
    }
    refreshHeader();
    navigate('home');
  });
})();

</script>
