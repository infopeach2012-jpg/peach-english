e little boy in the photo?","ja":"写真のこの可愛い男の子は誰ですか？","note":"translation not shown in app"},{"id":924,"en":"What kind of gift do you want to receive?","ja":"どんなプレゼントが欲しい？","note":"会話練習: What kind of ...（どんな〜）、receive（受け取る）"},{"id":925,"en":"Text her if I'm going to be delayed again.","ja":"また遅れそうなら、彼女にメッセージして。","note":"text=メッセージを送る、be delayed=遅れる"},{"id":926,"en":"I do need a new phone; mine keeps freezing.","ja":"新しいスマホが本当に必要なんだ。今のやつ、すぐフリーズしちゃって。","note":"do need=強調のdo。keep -ing=〜し続ける"},{"id":927,"en":"I left my last job to find new challenges.","ja":"(私は) 新しい挑戦を求めて (見つけるために)、前の仕事を辞めました (前の仕事から離れました)。","note":"レッスン: 職務経験（スピーキング練習画面）"},{"id":928,"en":"We packed all the snacks for the road trip.","ja":"ドライブ旅行のためにお菓子を全部用意したよ。","note":"「all the ___」の練習。road trip=ドライブ旅行"},{"id":929,"en":"Cancel the meeting if I'm going to be sick.","ja":"具合が悪くなりそうなら、会議はキャンセルしてください。","note":"be going to be sick=具合が悪くなりそう"},{"id":930,"en":"We might be coming down with a stomach bug.","ja":"私たち、胃腸風邪にかかりかけているかもしれません。","note":"come down with ~=(病気)にかかり始める / stomach bug=胃腸風邪"},{"id":931,"en":"I'm working on a contract for a new client.","ja":"(私は)新しいクライアントの(ための)契約に取り組んでいます。","note":"現在の業務。work on=取り組む"},{"id":932,"en":"Electric cars are way too high-tech for me.","ja":"電気自動車は私にはハイテクすぎます。","note":"electric car=電気自動車"},{"id":933,"en":"The new iPhone is way too expensive for me.","ja":"新しいiPhoneは私には高すぎます。","note":"way too ~=あまりに～すぎる"},{"id":934,"en":"The best thing about used cars is the price.","ja":"中古車の最高なところは価格です。","note":"パターン: The best thing about ___ is ___. used cars=中古車"},{"id":935,"en":"Where are my receipts? I need them for taxes.","ja":"領収書はどこ？税金の申告に必要なんだけど。","note":""},{"id":936,"en":"Thank you for advising us on the next steps.","ja":"今後の進め方についてご助言いただき、ありがとうございます。","note":"英会話アプリ レッスン「Thank you for advising ___」 next steps = 今後の進め方"},{"id":937,"en":"Is there an elevator to get to the platform?","ja":"ホームに行く（到着する）ためのエレベーターはありますか？","note":"レッスン: 地下鉄に乗る。platform=（駅の）ホーム"},{"id":938,"en":"Watch out, it bites anyone who gets too close.","ja":"気をつけて、近づきすぎると噛みつくよ。","note":"bite = 噛みつく / watch out = 気をつけて (穴埋め: it bites ___)"},{"id":939,"en":"That's good to hear! How's your new job going?","ja":"それはよかった！新しい仕事はどう？","note":""},{"id":940,"en":"I'll give it back first thing in the morning.","ja":"(私は)朝一番にそれを返します。","note":"レッスン「返す約束をする」の例文"},{"id":941,"en":"Thanks for inviting me to sing at your party.","ja":"パーティーで歌うよう招待してくださってありがとうございます。","note":"invite A to do=Aに～するよう招待する"},{"id":942,"en":"You sound like you're coming down with a cold.","ja":"風邪を引き始めているような声をしていますね。","note":"come down with ~=(病気)にかかり始める"},{"id":943,"en":"He scored the highest grade on the final exam.","ja":"彼は期末試験で最高点を取りました。","note":"レッスン: the highest ___、final exam=期末試験"},{"id":944,"en":"What was the reason for leaving your last job?","ja":"なぜ転職しようと思いましたか?","note":"reason for ~=〜の理由 / leave one's job=退職する"},{"id":945,"en":"Are you thinking of taking a day off tomorrow?","ja":"明日、休みを取るつもりですか?","note":"think of -ing=〜するつもり。take a day off=休みを取る"},{"id":946,"en":"Can you pick up groceries when you leave work?","ja":"仕事を出るときに、食料品を買ってきてくれる？","note":"会話練習: pick up groceries（食料品を買ってくる）、leave work（退勤する）"},{"id":947,"en":"The best thing about this chair is its comfort.","ja":"この椅子の一番いいところは、座り心地がいいことです。","note":"comfort=座り心地・快適さ"},{"id":948,"en":"Walk me through your first week back from work.","ja":"職場復帰後の最初の一週間について、順を追って教えてください。","note":"レッスン: Walk me through ___ from work."},{"id":949,"en":"Can you call the doctor when the fever returns?","ja":"熱がまた出たら、お医者さんに電話してもらえますか？","note":"会話練習アプリ。ヘッダーに前の課題「家に着いたら手伝ってくれる？」。when節での依頼表現"},{"id":950,"en":"Alright, I'll go check your room for your phone.","ja":"よし、部屋にスマホを探しに行くね。","note":"ja supplied"},{"id":951,"en":"Which neighborhood do you go to for good tacos?","ja":"美味しいタコスを食べに行くなら、どのエリアに行きますか？","note":"go to for ~=～を目当てに行く"},{"id":952,"en":"Are you thinking of moving in with your parents?","ja":"あなたはご両親と同居しようと思ってるんですか？","note":"レッスン: Major Life Decisions"},{"id":953,"en":"My favorite actors are Brad Pitt and Tom Cruise.","ja":"私のお気に入りの俳優はBrad PittとTom Cruiseです。","note":""},{"id":954,"en":"The best thing about the job is its flexibility.","ja":"この仕事の一番いいところは、柔軟性があることです。","note":"パターン: The best thing about it is its ___. flexibility=柔軟性"},{"id":955,"en":"Thank you for picking up my prescription for me.","ja":"私の処方箋を受け取ってきてくれてありがとう。","note":"レッスン: Thank you for ___ for me. prescription=処方箋"},{"id":956,"en":"This mountain has the highest peak in the region.","ja":"この山はこの地域で最も高い山頂を持っています。","note":"レッスン: has the highest ___、peak=山頂"},{"id":957,"en":"Which neighborhood does she like to live in most?","ja":"彼女が一番住みたいと思っているのはどの地域ですか？","note":"neighborhood=地域・近所。レッスン: Which neighborhood do you like to live in ___"},{"id":958,"en":"Can you walk me through setting up direct deposit?","ja":"口座振替の設定手順を教えていただけますか？","note":"direct deposit=口座振替"},{"id":959,"en":"That's awesome! What are you working on these days?","ja":"いいですね！最近は何に取り組んでいますか？","note":""},{"id":960,"en":"My favorite ice cream flavor is cookies and cream.","ja":"私のお気に入りのアイスクリームのフレーバーは、クッキー＆クリームです。","note":""},{"id":961,"en":"That's handy! Could you show me your favorite item?","ja":"便利ですね！お気に入りのアイテムを見せてもらえますか？","note":""},{"id":962,"en":"Are you thinking of investing in some real estate?","ja":"あなたは不動産投資をしようと思ってるんですか？","note":"レッスン: Spending and Investing。real estate=不動産"},{"id":963,"en":"Can you walk me through what went wrong yesterday?","ja":"昨日何がうまくいかなかったのか、順を追って説明してもらえますか？","note":"Can you walk me through ___? の練習"},{"id":964,"en":"That's okay! It's always good to keep things simple.","ja":"大丈夫ですよ！物事はシンプルにしておくのがいつも良いですね。","note":""},{"id":965,"en":"My favorite shows are White Lotus and Breaking Bad.","ja":"私のお気に入りの番組は『ホワイト・ロータス』と『ブレイキング・バッド』です。","note":""},{"id":966,"en":"I wish I'd never gotten involved with this project.","ja":"このプロジェクトに関わらなければ良かったのに。","note":"I wish I'd never ~=〜しなければよかった(後悔) / get involved with=関わる"},{"id":967,"en":"Who are you gonna introduce to the hiring committee?","ja":"採用委員会には誰を紹介するつもり？","note":"be gonna（be going to）の練習。前の文脈: 新しいご近所さんには誰を紹介するつもり？"},{"id":968,"en":"I won't forget our anniversary ever again, I promise.","ja":"私は私たちの記念日を二度と忘れません。約束します。","note":"won't ~ ever again=二度と〜しない / anniversary=記念日"},{"id":969,"en":"Please walk me through requesting time off from work.","ja":"仕事の休暇申請の手順を教えてください。","note":"レッスン: Walk me through ___ from work.（request time off=休暇を申請する）"},{"id":970,"en":"That model has the highest fuel efficiency this year.","ja":"そのモデルは今年、最も燃費が良いです。","note":"レッスン: has the highest ___（fuel efficiency=燃費）"},{"id":971,"en":"Which neighborhood do you go to for vintage shopping?","ja":"ヴィンテージショップ巡りをするなら、どのエリアに行きますか？","note":"vintage shopping=ヴィンテージショップ巡り"},{"id":972,"en":"That's cute! Why is your smartphone your favorite item?","ja":"かわいいですね！なぜスマホがお気に入りのアイテムなのですか？","note":""},{"id":973,"en":"Which neighborhood would they like to live in someday?","ja":"彼らはいつかどの地域に住みたいと思っているのでしょうか。","note":"someday=いつか。would they like to ~ の疑問文"},{"id":974,"en":"That's a great choice! Your smartphone looks really nice.","ja":"素晴らしい選択ですね！あなたのスマホは本当に素敵に見えます。","note":""},{"id":975,"en":"Which neighborhood are you leaning towards for the commute?","ja":"通勤を考えると、どのエリアが気になっていますか？","note":"lean towards=～に気持ちが傾く / commute=通勤"},{"id":976,"en":"I'm bad at understanding people who can't understand others.","ja":"他人の考えを理解できない人を理解するのは苦手です。","note":"be bad at ~ing = 〜するのが苦手"},{"id":977,"en":"I usually get up at 6 AM to go to work.","ja":"私はたいてい午前6時に起きて、仕事に行きます。","note":""},{"id":978,"en":"Could you show me where I can park my car?","ja":"車を駐車できる場所を教えてもらえますか？","note":"Could you show me ...? のパターン"},{"id":979,"en":"How are you gonna get to work in this snow?","ja":"こんな雪の中、どうやって仕事に行くの？","note":"How are you gonna ~? の練習。前の文脈: 車なしでどうやってダウンタウンまで行くつもり？"},{"id":980,"en":"If I'm behind on homework, can I make it up?","ja":"宿題が遅れている場合、後から取り戻せますか？","note":"behind on ~=～が遅れている"},{"id":981,"en":"If you don't know the word, look it up online.","ja":"その単語がわからなければ、オンラインで調べてください。","note":"look ... up = 調べる"},{"id":982,"en":"Can you walk me through the day off from work?","ja":"仕事を休む日の流れを説明してもらえますか？","note":"レッスン: Walk me through ___ from work.（walk me through=順を追って説明する）"},{"id":983,"en":"Well, it was fun chatting with you. Bye for now!","ja":"さて、あなたとおしゃべりできて楽しかったです。ではまた！","note":""},{"id":984,"en":"We have all-you-can-eat Yakiniku for two hours!","ja":"2時間、焼肉食べ放題をやってます!","note":"all-you-can-eat=食べ放題 / 少し長めの英語リスニングより"},{"id":985,"en":"The best thing about a minivan is the trunk space.","ja":"ミニバンの最高なところはトランクのスペースです。","note":"trunk space=トランクのスペース"},{"id":986,"en":"Who are these kids in the picture? They're so cute!","ja":"写真のこの子たちは誰？とても可愛いね！","note":""},{"id":987,"en":"I need my laptop, my passport, and my phone charger.","ja":"ノートパソコンとパスポートとスマホの充電器が必要です。","note":""},{"id":988,"en":"It's great to meet your mother! She looks lovely indeed.","ja":"あなたのお母さんに会えてうれしいです！本当に素敵な方ですね。","note":"translation not shown in app"},{"id":989,"en":"On the other hand, living off-campus is more affordable.","ja":"もう一方の側面では、キャンパス外で住む方が(家賃が)より手頃です。","note":"on the other hand=一方で / off-campus=学外 / affordable=手頃な"},{"id":990,"en":"The best thing about online classes is the flexible schedule.","ja":"オンライン授業の一番いいところは、スケジュールが柔軟なことです。","note":"The best thing about 〜 is ...=〜の一番いいところは…"},{"id":991,"en":"Ah, I see. Sam has a lot of close friends then!","ja":"なるほど。じゃあサムには親しい友達がたくさんいるんですね！","note":""},{"id":992,"en":"Hi, we have a guest today. Please tell us your name!","ja":"こんにちは、今日はゲストがいます。お名前を教えてください！","note":""},{"id":993,"en":"Before we wrap up, do you have any questions for me?","ja":"終わる前に、何か私に質問はありますか？","note":""},{"id":994,"en":"This is my older sister and this is my younger sister.","ja":"これは姉で、これは妹です。","note":""},{"id":995,"en":"If you want good service, then tipping is a good option.","ja":"もし良いサービスが欲しいなら、チップを渡すのが良い選択です。","note":"文型: If you want ..., then ... is a good option."},{"id":996,"en":"Thanks for joining us for \"What's in my bag!\" today, Masumi.","ja":"今日は「What's in my bag!」に参加してくれてありがとう、Masumi。","note":""},{"id":997,"en":"If you wanna save money, then budgeting is a good option.","ja":"もしお金を節約したいなら…その場合、予算を立てるのは良い選択です。","note":"レッスン: If you wanna ..., then ... is a good option.（budgeting=予算を立てること）"},{"id":998,"en":"If you wanna learn English, then tutoring is a good option.","ja":"英語を学びたいなら、家庭教師を受けるのはいい選択肢だよ。","note":"文型練習: If you wanna ..., then ... is a good option。tutoring=家庭教師"},{"id":999,"en":"Oh, that sounds interesting! How do you like being a butcher?","ja":"へえ、面白そうだね！精肉職人の仕事はどう？","note":""},{"id":1000,"en":"If you wanna reduce stress, then meditation is a good option.","ja":"ストレスを減らしたいなら、瞑想は良い選択肢ですよ。","note":"meditation=瞑想"},{"id":1001,"en":"That's a valid reason! I understand why you love your smartphone.","ja":"もっともな理由ですね！あなたがスマホを気に入っている理由が分かります。","note":""},{"id":1002,"en":"I appreciate their patience and the way they explain things clearly.","ja":"彼らの忍耐力と、物事をわかりやすく説明してくれることに感謝しています。","note":""},{"id":1003,"en":"I do need a new car, but Tesla is way too flashy.","ja":"確かに新しい車は必要ですが、テスラはあまりにも派手すぎます。","note":"パターン: I do need a new ___, but ___ is way too ___"},{"id":1004,"en":"If you wanna save money, then meal prep is a good option.","ja":"節約したいなら、作り置きはいい選択肢だよ。","note":"meal prep=作り置き"},{"id":1005,"en":"If you wanna get fit, then daily walks are a good option.","ja":"健康になりたいなら、毎日散歩するのがおすすめだよ。","note":"get fit=健康になる・体を鍛える。If you wanna ..., then ... is a good option の構文"},{"id":1006,"en":"I mean, it's a hard choice. Both have their pros and cons.","ja":"つまり、難しい選択だよね。どっちにもメリットとデメリットがあるし。","note":"会話チャット画面 pros and cons = 長所と短所"},{"id":1007,"en":"That's a cool bag! Could you tell me more about your bag?","ja":"カッコいいバッグですね！そのバッグについてもっと教えてもらえますか？","note":""},{"id":1008,"en":"Nice to see you here! And who's this lovely lady with you?","ja":"ここで会えてうれしいです！こちらの素敵な女性はどなたですか？","note":"translation not shown in app"},{"id":1009,"en":"If you wanna get fit, then walking daily is a good option.","ja":"健康になりたいなら、毎日歩くのはおすすめだよ。","note":"get fit=健康になる・体を鍛える"},{"id":1010,"en":"If you wanna get in shape, then swimming is a good option.","ja":"もし体を鍛えたいなら、水泳が良い選択です。","note":"get in shape=体を鍛える"},{"id":1011,"en":"I'm glad to see you. We have been going running these days.","ja":"お会いできてうれしいです。最近、よく一緒に走りに行っています。","note":""},{"id":1012,"en":"Okay, let me check your room. Where is your phone usually kept?","ja":"わかった、部屋を見てくるね。スマホはいつもどこに置いてる？","note":"ja supplied"},{"id":1013,"en":"Okay, just one more question. Which gate are you at the airport?","ja":"わかった、あと一つだけ質問。空港のどのゲートにいる？","note":"ja supplied"},{"id":1014,"en":"If you want something spicy, then Chinese food is a good option.","ja":"もし辛いものが欲しいなら、中華料理が良い選択です。","note":""},{"id":1015,"en":"Bruce Willis is a great choice! What's your favorite work of his?","ja":"ブルース・ウィリスは良い選択ですね！彼の作品で一番好きなのは何ですか？","note":""},{"id":1016,"en":"If you wanna build strength, then weight training is a good option.","ja":"筋力をつけたいなら、ウェイトトレーニングがおすすめですよ。","note":"If you wanna ..., then ... is a good option の文型。build strength=筋力をつける"},{"id":1017,"en":"You're welcome! I found your phone. What's the second thing you need?","ja":"どういたしまして！スマホ見つけたよ。2つ目に必要なものは何？","note":"ja supplied"},{"id":1018,"en":"Alright, no problem. Is there anything else you need before you leave?","ja":"わかった、問題ないよ。出発する前に他に必要なものはある？","note":"ja supplied"},{"id":1019,"en":"On one hand, she can save. On the other hand, she can splurge.","ja":"一方では彼女は節約できるし、もう一方では贅沢もできる。","note":"save=節約する、splurge=贅沢する・散財する"},{"id":1020,"en":"Aww, he's adorable! I bet you two have a lot of fun together.","ja":"まあ、可愛いね！二人はきっとすごく楽しく過ごしているんでしょうね。","note":"I bet = きっと"},{"id":1021,"en":"If you wanna live in the city, then renting is a good option.","ja":"もし都市部に住みたいなら、賃貸が良い選択です。","note":"wanna=want to、renting=賃貸"},{"id":1022,"en":"On one hand, I could drive. On the other hand, traffic is awful.","ja":"車で行くこともできるけど、渋滞がひどいんだよね。","note":"traffic is awful=渋滞がひどい"},{"id":1023,"en":"If you want a bigger house, then the suburbs are a good option.","ja":"もしより大きな家が欲しいなら、郊外が良い選択です。","note":"the suburbs=郊外"},{"id":1024,"en":"That's right! Whitney Houston was from the U.S. How old was she?","ja":"その通り！ホイットニー・ヒューストンはアメリカ出身でした。彼女は何歳でしたか？","note":""},{"id":1025,"en":"Die Hard is a classic action movie! Why do you like Bruce Willis?","ja":"『ダイ・ハード』は定番のアクション映画ですね！なぜブルース・ウィリスが好きなのですか？","note":""},{"id":1026,"en":"Things are going great for me! By the way, how's your family doing?","ja":"私は順調です！ところで、ご家族はお元気ですか？","note":""},{"id":1027,"en":"What a nice surprise to run into you here. Are these your friends?","ja":"ここで会うなんて嬉しい驚きです。この人たちはあなたの友達ですか？","note":"run into = 偶然会う"},{"id":1028,"en":"If you wanna avoid traffic, then taking the train is a good option.","ja":"渋滞を避けたいなら電車を使うのがいいよ。","note":"If you wanna ..., then ... is a good option の文型。avoid traffic=渋滞を避ける"},{"id":1029,"en":"If you wanna sleep better, then a bedtime routine is a good option.","ja":"もっとよく眠りたいなら、寝る前のルーティンを作るのがおすすめだよ。","note":"bedtime routine=寝る前のルーティン"},{"id":1030,"en":"Do you use the paper in your notebook for writing notes or drawing?","ja":"そのノートの紙はメモを書くのに使いますか、それとも絵を描くのに使いますか？","note":""},{"id":1031,"en":"Oh, your cousins are adorable! It must be fun spending time with them.","ja":"わあ、あなたのいとこは可愛いね！一緒に過ごすの楽しいでしょうね。","note":""},{"id":1032,"en":"That's okay. Whitney Houston was born on August 9, 1963. Why do you admire her?","ja":"大丈夫です。ホイットニー・ヒューストンは1963年8月9日に生まれました。なぜ彼女を尊敬しているのですか？","note":""},{"id":1033,"en":"Oh, that's great! Whitney Houston was an incredible singer. Where is she from?","ja":"おお、いいですね！ホイットニー・ヒューストンは素晴らしい歌手でした。彼女はどこの出身ですか？","note":""},{"id":1034,"en":"Ah, got it! Family reunions are always a blast, especially with cousins around.","ja":"なるほど！家族の集まりはいつも楽しいですよね、特にいとこがいると。","note":"a blast = とても楽しいこと"},{"id":1035,"en":"That's great! Notebooks are always handy to have for jotting down important information.","ja":"いいですね！ノートは大事な情報をさっと書き留めるのにいつも便利です。","note":""},{"id":1036,"en":"I do need a new pair of shoes, but Adidas is way too flashy.","ja":"確かに新しい靴が一足必要ですが、アディダスはあまりにも派手すぎます。","note":"a pair of shoes=靴一足, way too=あまりにも〜すぎる"},{"id":1037,"en":"Got it. I'll meet you there in a little while. Have a safe trip!","ja":"了解。少ししたらそこで会おう。良い旅を！","note":"ja supplied"},{"id":1038,"en":"If you wanna travel light, then a carry-on bag is a good option.","ja":"荷物を少なくしたいなら、機内持ち込みのバッグがおすすめですよ。","note":"travel light=身軽に旅する、carry-on bag=機内持ち込みバッグ"},{"id":1039,"en":"If you want good gas mileage, then a hybrid car is a good option.","ja":"もし良い燃費が欲しいなら、ハイブリッド車が良い選択です。","note":"gas mileage=燃費 / option=選択肢"},{"id":1040,"en":"Wow, you must have a lot of fun family gatherings with all your cousins!","ja":"わあ、いとこがたくさんいて家族の集まりはとても楽しいでしょうね！","note":"translation not shown in app"},{"id":1041,"en":"On one hand, remote work is flexible. On the other hand, it feels isolating.","ja":"リモートワークは柔軟性がある一方で、孤独を感じることもあります。","note":"isolating=孤独を感じさせる"},{"id":1042,"en":"On one hand, dorms are convenient. On the other hand, off-campus is cheaper.","ja":"寮は便利だけど、一方でキャンパス外の住まいの方が安いんだよね。","note":"dorms=寮、off-campus=キャンパス外"},{"id":1043,"en":"On one hand, remote work saves time. On the other hand, offices build teamwork.","ja":"リモートワークは時間を節約できる一方で、オフィス勤務はチームワークを育てます。","note":"構文: on one hand ~, on the other hand ~（一方では～、他方では～）"},{"id":1044,"en":"Wow, homemade bread sounds delicious! How do you find living in New York City?","ja":"わあ、手作りパンは美味しそう！ニューヨーク市での暮らしはどうですか？","note":""},{"id":1045,"en":"Absolutely! Whitney Houston had an amazing voice. What is your favorite song of hers?","ja":"その通り！ホイットニー・ヒューストンは素晴らしい声の持ち主でした。彼女の曲で一番好きなのは何ですか？","note":""},{"id":1046,"en":"Oh, hey! I didn't expect to see you here! And who is this little guy?","ja":"あら、こんにちは！ここで会うとは思わなかった！この小さい子は誰？","note":"translation not shown in app"},{"id":1047,"en":"Hey, glad you could make it to the neighborhood bbq! Oh, are these your kids?","ja":"やあ、近所のバーベキューに来てくれてうれしいよ！あれ、この子たちはあなたの子供？","note":"make it = 来られる"},{"id":1048,"en":"\"I Will Always Love You\" is such a beautiful song. Now, who's your favorite actor?","ja":"「オールウェイズ・ラヴ・ユー」はとても美しい歌ですね。では、お気に入りの俳優は誰ですか？","note":""},{"id":1049,"en":"Ah, I see. It's always nice to see familiar faces, whether they're friends or coworkers.","ja":"なるほど。友達でも同僚でも、知っている顔を見るのはいつもいいですね。","note":"familiar faces = 見慣れた顔"},{"id":1050,"en":"Big Fish is a fantastic film! Thank you for sharing your favorite celebrities with me.","ja":"『ビッグ・フィッシュ』は素晴らしい映画ですね！お気に入りの有名人を教えてくれてありがとう。","note":""},{"id":1051,"en":"Are you sure? I want to make sure you have everything you need before your trip.","ja":"本当に？旅行の前に必要なものが全部そろっているか確認したいんだ。","note":"ja supplied"},{"id":1052,"en":"What a beautiful wedding! Are those Sam's sisters? I didn't know he had so many sisters.","ja":"なんて素敵な結婚式！あれはサムの姉妹ですか？彼にそんなに姉妹がいるとは知りませんでした。","note":""},{"id":1053,"en":"That's good to hear! There's always something exciting happening in the city. How's your family doing?","ja":"それはよかった！街ではいつも何かワクワクすることが起きているね。家族は元気にしてる？","note":""},{"id":1054,"en":"That's interesting! My favorite item in my bag is my notebook because I love writing down ideas.","ja":"面白いですね！私のバッグのお気に入りはノートです。アイデアを書き留めるのが大好きだからです。","note":""},{"id":1055,"en":"Wow! You're on a 30-day streak on using this app?! Why do you like the app so much?","ja":"すごい！このアプリを30日間使い続けているんですか？なぜこのアプリがそんなに好きなのですか？","note":"streak = 連続記録"},{"id":1056,"en":"You have such a big family! Who are all these people standing next to you in the photo?","ja":"大家族なんですね！写真であなたの隣に立っているこの人たちは誰ですか？","note":""},{"id":1057,"en":"Well, since you don't have a must-have item, could you share one more item from your bag?","ja":"必須アイテムがないなら、バッグの中からもう一つアイテムを紹介してもらえますか？","note":""},{"id":1058,"en":"That's wonderful to hear! Any plans to visit New York City? There are so many cool places to see!","ja":"それは素晴らしいですね！ニューヨーク市を訪れる予定はありますか？見るべき素敵な場所がたくさんありますよ！","note":""},{"id":1059,"en":"That's a great way to stay organized. Well, that's it for today. Thanks for sharing what's in your bag!","ja":"整理整頓するのに良い方法ですね。さて、今日はここまでです。バッグの中身を教えてくれてありがとう！","note":""},{"id":1060,"en":"That's awesome! I'm glad to hear that you're enjoying it. So, how are you finding life in New York City?","ja":"すごいね！楽しんでいると聞けて嬉しいよ。それで、ニューヨークでの生活はどう？","note":"会話アプリのAI応答文"},{"id":1061,"en":"I'm doing well, thank you for asking. So, today we're going to chat about your favorite celebrities. Who's your favorite singer?","ja":"おかげさまで元気です。さて、今日はあなたの好きな有名人についておしゃべりしましょう。お気に入りの歌手は誰ですか？","note":""},{"id":1062,"en":"That's awesome! When you do visit, I recommend checking out Central Park, Times Square, and the Statue of Liberty. You'll love it!","ja":"いいですね！訪れる時は、セントラルパーク、タイムズスクエア、自由の女神を見るのをおすすめします。きっと気に入りますよ！","note":""},{"id":1063,"en":"If you get hungry, try Joe's Pizza in my neighborhood. Well, it was nice catching up with you! Have a great time in New York!","ja":"お腹が空いたら、うちの近所のJoe's Pizzaを試してみて。さて、近況を話せて良かったです！ニューヨークで良い時間を過ごしてね！","note":""},{"id":1064,"en":"Haha, I feel you. New York City is always buzzing with energy! Speaking of which, work is going pretty well for me. How about you?","ja":"ははは、分かります。ニューヨーク市はいつも活気にあふれていますね！そういえば、私の仕事はかなり順調です。あなたはどうですか？","note":""},{"id":1065,"en":"You should try the burger joint down the street. They have amazing burgers! Well, it was nice catching up with you! Have a great time in New York!","ja":"通りの先にあるハンバーガー屋に行ってみて。すごくおいしいバーガーがあるよ！じゃあ、会えてよかった！ニューヨークで楽しんでね！","note":""},{"id":1066,"en":"That's great to hear! If they ever visit NYC, they should check out Central Park and Times Square. Have you tried any good places to eat in your neighborhood?","ja":"それはよかった！もし彼らがNYCに来たら、セントラルパークとタイムズスクエアに行くといいよ。近所でどこかいい食事の店を試した？","note":""},{"id":1067,"en":"I'd like to return these pants. / They don't fit right. / There's a stain. / There's a tear. / Here's the tag. / Here's the receipt. / Can I get a refund? / Can I exchange them?","ja":"(私は)このズボン・パンツを返品したいのですが。／(それらは)サイズが合いません。／(1つ)シミがあります。／(1カ所)破れがあります。／タグはこちらです。／レシートはこちらです。／(私は)返金してもらえますか？／(私はそれらを)交換してもらえますか？","note":"フレーズブック一覧(返品の場面、8文)。stain=シミ、tear=破れ、refund=返金"},{"id":1068,"en":"I don't know, maybe. / Why don't you give the Speak app a try? / If you wanna see facial expressions, then hiring a private tutor is a good option. / If you want flexibility, then using a language learning app is a good option.","ja":"分からない、もしかしたらね。／Speakアプリを試してみたらどうですか？／表情を見たいなら、個別の家庭教師を雇うのが良い選択です。／柔軟性を求めるなら、言語学習アプリを使用するのが良い選択です。","note":"会話フレーズ一覧画面(4文)。give ~ a try=~を試してみる"},{"id":1069,"en":"My jacket got stained.","ja":"ジャケットにシミがついちゃった。","note":"","src":"スクショ IMG_5167"},{"id":1070,"en":"It's exciting to start a new job.","ja":"新しい仕事を始めるのはワクワクするね。","note":"","src":"スクショ IMG_5168"},{"id":1071,"en":"The trip is totally ruined.","ja":"旅行が完全に台無しだよ。","note":"","src":"スクショ IMG_5175"},{"id":1072,"en":"My smartwatch keeps losing charge.","ja":"スマートウォッチの充電がすぐ減っちゃうんだ。","note":"keep ～ing＝～し続ける","src":"スクショ IMG_5181"},{"id":1073,"en":"My bathtub keeps leaking.","ja":"浴槽がずっと水漏れしてるんだ。","note":"","src":"スクショ IMG_5201"},{"id":1074,"en":"It was a total disaster!","ja":"もう最悪だったよ！","note":"","src":"スクショ IMG_5202"},{"id":1075,"en":"Marinating it overnight might do the trick.","ja":"一晩漬け込めばうまくいくかもね。","note":"do the trick＝効果がある・うまくいく","src":"スクショ IMG_5205"},{"id":1076,"en":"I'm taking a break now.","ja":"今ちょっと休憩中なんだ。","note":"take a break＝休憩する","src":"スクショ IMG_5224"},{"id":1077,"en":"Either one works.","ja":"どっちでもいいよ。","note":"","src":"スクショ IMG_5231(1)"},{"id":1078,"en":"I won't forget our anniversary ever again.","ja":"もう二度と記念日を忘れないよ。","note":"","src":"スクショ IMG_5233"},{"id":1079,"en":"I need two heads of lettuce.","ja":"レタスが2玉必要なんだ。","note":"","src":"スクショ IMG_5240"},{"id":1080,"en":"I'm not gonna be done for the deadline.","ja":"締め切りに間に合いそうにないよ。","note":"","src":"スクショ IMG_5240"},{"id":1081,"en":"Can you swim competitively?","ja":"競技レベルで泳げる？","note":"","src":"スクショ IMG_5240"},{"id":1082,"en":"I need a dozen eggs.","ja":"卵が1ダース必要なんだ。","note":"","src":"スクショ IMG_5240"},{"id":1083,"en":"I'm not gonna be packed for the flight.","ja":"フライトまでに荷造りが終わりそうにないよ。","note":"","src":"スクショ IMG_5240"},{"id":1084,"en":"Can you solve this riddle at all?","ja":"このなぞなぞ、少しでも解ける？","note":"","src":"スクショ IMG_5240"},{"id":1085,"en":"What can we do for the celebration?","ja":"お祝いのために何ができるかな？","note":"","src":"スクショ IMG_5240"},{"id":1086,"en":"I'm gonna throw a party.","ja":"パーティーを開くつもりなんだ。","note":"throw a party＝パーティーを開く","src":"スクショ IMG_5240"},{"id":1087,"en":"I'm not gonna be ready for the performance.","ja":"本番までに準備が間に合いそうにないよ。","note":"","src":"スクショ IMG_5240"},{"id":1088,"en":"I'm not gonna be prepared for the test.","ja":"テストの準備が間に合いそうにないよ。","note":"","src":"スクショ IMG_5240"},{"id":1089,"en":"What can I do for the meeting?","ja":"会議のために私は何をすればいい？","note":"","src":"スクショ IMG_5240"},{"id":1090,"en":"What time can you meet up?","ja":"何時に会える？","note":"meet up＝（約束して）会う","src":"スクショ IMG_5240"},{"id":1091,"en":"My dog is friendly.","ja":"うちの犬は人懐っこいよ。","note":"","src":"スクショ IMG_5241"},{"id":1092,"en":"Can you explain this when class starts?","ja":"授業が始まったらこれを説明してくれる？","note":"","src":"スクショ IMG_5241"},{"id":1093,"en":"Will you be available tomorrow?","ja":"明日は空いてる？","note":"","src":"スクショ IMG_5241"},{"id":1094,"en":"Are you skipping breakfast again?","ja":"また朝ごはん抜いてるの？","note":"skip＝抜かす・サボる","src":"スクショ IMG_5241"},{"id":1095,"en":"Can you call me when you arrive?","ja":"着いたら電話してくれる？","note":"","src":"スクショ IMG_5241"},{"id":1096,"en":"What gift are you gonna give to the wedding?","ja":"結婚式にはどんな贈り物をするの？","note":"","src":"スクショ IMG_5241"},{"id":1097,"en":"Will you be awake at midnight?","ja":"夜中の12時に起きてる？","note":"","src":"スクショ IMG_5241"},{"id":1098,"en":"Nate's friends are gonna pitch in.","ja":"ネイトの友達が協力してくれるよ。","note":"pitch in＝協力する・お金や手を出し合う","src":"スクショ IMG_5241"},{"id":1099,"en":"Why does she laugh at his jokes?","ja":"なんで彼女は彼の冗談に笑うの？","note":"","src":"スクショ IMG_5241"},{"id":1100,"en":"Can you meet us when you're free?","ja":"時間があるときに会ってくれる？","note":"","src":"スクショ IMG_5241"},{"id":1101,"en":"I need six bunches of bananas.","ja":"バナナが6房必要なんだ。","note":"","src":"スクショ IMG_5241"},{"id":1102,"en":"Will you be finished before dinner?","ja":"夕食前には終わってる？","note":"","src":"スクショ IMG_5241"},{"id":1103,"en":"I'm gonna be early for the appointment.","ja":"約束の時間より早めに着くつもり。","note":"","src":"スクショ IMG_5241"},{"id":1104,"en":"I'll tell you the deets.","ja":"詳しいことは後で話すね。","note":"deets＝details（詳細）の口語","src":"スクショ IMG_5242"},{"id":1105,"en":"There's enough paper for the project.","ja":"プロジェクトに十分な紙があるよ。","note":"","src":"スクショ IMG_5242"},{"id":1106,"en":"Let's have a barbecue this weekend.","ja":"今週末バーベキューしようよ。","note":"","src":"スクショ IMG_5242"},{"id":1107,"en":"I'm not gonna be ready for the presentation.","ja":"プレゼンまでに準備が間に合いそうにないよ。","note":"","src":"スクショ IMG_5242"},{"id":1108,"en":"There's enough seating for the guests.","ja":"お客さん全員分の席があるよ。","note":"","src":"スクショ IMG_5242"},{"id":1109,"en":"Why aren't you answering your phone?","ja":"なんで電話に出ないの？","note":"","src":"スクショ IMG_5242"},{"id":1110,"en":"Will she be awake by sunrise?","ja":"彼女は日の出までに起きてるかな？","note":"","src":"スクショ IMG_5242"},{"id":1111,"en":"Let's grab some food after class.","ja":"授業の後に何か食べに行こうよ。","note":"grab some food＝軽く食事をする","src":"スクショ IMG_5242"},{"id":1112,"en":"Where do you want to have your wedding?","ja":"結婚式はどこで挙げたい？","note":"","src":"スクショ IMG_5242"},{"id":1113,"en":"Where do you want to go for dinner?","ja":"夕食はどこに行きたい？","note":"","src":"スクショ IMG_5243"},{"id":1114,"en":"I didn't go to the meeting because I had another appointment.","ja":"別の約束があったから会議には行かなかったんだ。","note":"","src":"スクショ IMG_5243"},{"id":1115,"en":"I need one bottle of juice.","ja":"ジュースが1本必要なんだ。","note":"","src":"スクショ IMG_5243"},{"id":1116,"en":"Who are you gonna bring to the reunion?","ja":"同窓会には誰を連れて行くの？","note":"","src":"スクショ IMG_5243"},{"id":1117,"en":"I'm not gonna be packed for the trip.","ja":"旅行までに荷造りが終わりそうにないよ。","note":"","src":"スクショ IMG_5243"},{"id":1118,"en":"I didn't go to the play because I was working late.","ja":"残業して :"be into / work out","src":"Excel 2026-10-28 #1339"},{"id":1655,"en":"I prefer hiking instead.","ja":"私はむしろハイキングの方が好きです。","note":"prefer / instead","src":"Excel 2026-10-28 #1340"},{"id":1656,"en":"What are you into?","ja":"何にはまっていますか？","note":"be into","src":"Excel 2026-10-28 #1341"},{"id":1657,"en":"I need to scrub the floor.","ja":"床をこすり洗いする必要があります。","note":"need to / scrub","src":"Excel 2026-10-28 #1342"},{"id":1658,"en":"They need to sweep the floor.","ja":"彼らは床を掃く必要があります。","note":"need to / sweep","src":"Excel 2026-10-28 #1343"},{"id":1659,"en":"I have to mow the lawn.","ja":"私は芝生を刈らなければなりません。","note":"have to / mow the lawn","src":"Excel 2026-10-28 #1344"},{"id":1660,"en":"We have to mop the floor.","ja":"私たちは床をモップがけしなければなりません。","note":"have to / mop","src":"Excel 2026-10-28 #1345"},{"id":1661,"en":"We have to vacuum the floor.","ja":"私たちは床に掃除機をかけなければなりません。","note":"have to / vacuum","src":"Excel 2026-10-28 #1346"},{"id":1662,"en":"chores","ja":"家事／雑用","note":"chores","src":"Excel 2026-10-28 #1347"},{"id":1663,"en":"That's my cousin.","ja":"私のいとこです。","note":"cousin","src":"Excel 2026-10-28 #1348"},{"id":1664,"en":"My house is so filthy.","ja":"私の家はとても汚いです。","note":"filthy / so","src":"Excel 2026-10-28 #1349"},{"id":1665,"en":"My room is so messy.","ja":"私の部屋はとても散らかっています。","note":"messy / so","src":"Excel 2026-10-28 #1350"}],"reading":[{"id":1,"section":"導入","en":"This September, I will travel by car. I will go to Tohoku. Tohoku is in the north of Japan. The trip is five days. I will go alone. I will drive from my home in Nagoya. I will visit four areas: Niigata, Fukushima, Miyagi, and Iwate.","ja":"今年の9月、私は車で旅行します。東北へ行きます。東北は日本の北にあります。旅は5日間です。一人で行きます。名古屋の自宅から運転します。新潟、福島、宮城、岩手の4つの地域を訪れます。"},{"id":2,"section":"一人旅の理由","en":"I like to travel alone. If there's a place that interests me, I can stop and visit it. I can change my plans easily. I also love driving. A long drive is fun for me. My job is very busy. So this trip is a good time to relax.","ja":"私は一人で旅をするのが好きです。行きたい所でどこでも止まれます。計画も簡単に変えられます。運転も大好きです。長いドライブは私にとって楽しいものです。仕事はとても忙しいです。だからこの旅は、リラックスするのに良い時間です。"},{"id":3,"section":"旅の大きな理由","en":"I have a big reason for this trip. In 2011, there was a big earthquake and a tsunami in Tohoku. More than ten years passed. Now I want to see the coast with my own eyes. I will visit some museums about the tsunami. I want to learn what happened. I want to see the towns today. I think we must not forget.","ja":"この旅には大きな理由があります。2011年、東北で大きな地震と津波がありました。10年以上が過ぎました。今、私は自分の目で海岸を見たいのです。津波に関する資料館をいくつか訪れます。何が起きたのかを学びたいです。今の町の様子を見たいです。私たちは忘れてはいけないと思います。"},{"id":4,"section":"計画","en":"This is my plan:","ja":"これが私の計画です。"},{"id":5,"section":"Day 1","en":"I drive from Nagoya to Niigata. It is about 450 kilometers. Niigata is by the sea. In the evening, I will eat fresh fish and drink local sake. I will watch the sunset.","ja":"名古屋から新潟まで運転します。約450キロです。新潟は海のそばにあります。夜は新鮮な魚を食べて、地元の日本酒を飲みます。夕日を見ます。"},{"id":6,"section":"Day 2","en":"I drive to Fukushima. I will see an old castle. I will eat ramen. I will run near some beautiful ponds. At night, I will stay at a hot spring hotel.","ja":"福島まで運転します。古いお城を見ます。ラーメンを食べます。きれいな池のそばで走ります。夜は温泉宿に泊まります。"},{"id":7,"section":"Day 3","en":"I go to Miyagi. In Sendai, I will eat beef tongue. It is a famous food there. Then I will see Matsushima. It is a bay with many small islands. It is very beautiful. In the afternoon, I will visit a museum about the tsunami.","ja":"宮城へ行きます。仙台では牛タンを食べます。そこの有名な食べ物です。それから松島を見ます。小さな島がたくさんある湾です。とてもきれいです。午後は津波の資料館を訪れます。"},{"id":8,"section":"Day 4","en":"This is the best part of the trip. I will drive along the coast. The coast has high cliffs. The sea is beautiful. I will also see an old temple in Hiraizumi.","ja":"これは旅でいちばん良い部分です。海岸沿いを運転します。海岸には高い崖があります。海はきれいです。平泉にある古いお寺も見ます。"},{"id":9,"section":"Day 5","en":"This is the last day. I drive home to Nagoya. It is about 750 kilometers. So I must start very early.","ja":"最終日です。名古屋の家まで運転して帰ります。約750キロです。だからとても早く出発しなければなりません。"},{"id":10,"section":"ランニング","en":"Running is important to me. I am training for a triathlon. So I want to run in beautiful places. There is a long path by the sea. I want to run there. I will see the sea and feel the wind. I am excited about it.","ja":"走ることは私にとって大切です。トライアスロンのためにトレーニングしています。だからきれいな場所で走りたいです。海沿いに長い道があります。そこで走りたいです。海を見て、風を感じます。とても楽しみです。"},{"id":11,"section":"食べ物","en":"I also love food. Every area has its own food. Niigata has fresh fish. Fukushima has ramen. Sendai has beef tongue. The coast has very fresh seafood. Eating local food makes me happy.","ja":"食べ物も大好きです。どの地域にもそれぞれの食べ物があります。新潟には新鮮な魚があります。福島にはラーメンがあります。仙台には牛タンがあります。海岸沿いにはとても新鮮な海の幸があります。地元の食べ物を食べると幸せになります。"},{"id":12,"section":"まとめ","en":"This trip is not only for fun. I want to rest. I want to run. I want to eat good food. And I want to see Tohoku with my own eyes. I hope I will feel happy and relaxed when I come home.","ja":"この旅は楽しみのためだけではありません。休みたいです。走りたいです。おいしい物を食べたいです。そして自分の目で東北を見たいです。家に帰るとき、幸せでリラックスした気持ちになっていることを願っています。"}],"situations":{"p1":"grammar","p2":"grammar","p3":"grammar","p4":"grammar","p5":"grammar","p6":"greet","p7":"shop","p8":"grammar","p9":"hobby","p10":"feel","p11":"feel","p12":"greet","p13":"study","p14":"shop","p15":"grammar","p16":"grammar","p17":"travel","p18":"hobby","p19":"shop","p20":"hobby","p21":"hobby","p22":"hobby","p23":"hobby","p24":"feel","p25":"feel","p26":"shop","p27":"travel","p28":"travel","p29":"travel","p30":"travel","p31":"people","p32":"hobby","p33":"greet","p34":"feel","p35":"feel","p36":"travel","p37":"travel","p38":"food","p39":"grammar","p40":"food","p41":"people","p42":"feel","p43":"feel","p44":"grammar","p45":"travel","p46":"people","p47":"greet","p48":"feel","p49":"feel","p50":"greet","p51":"grammar","p52":"grammar","p53":"feel","p54":"feel","p55":"hobby","p56":"travel","p57":"grammar","p58":"food","p59":"greet","p60":"food","p61":"health","p62":"work","p63":"plan","p64":"plan","p65":"hobby","p66":"grammar","p67":"plan","p68":"grammar","p69":"hobby","p70":"w "p1535":"home","p1536":"home","p1537":"home","p1538":"health","p1539":"home","p1540":"food","p1541":"food","p1542":"health","p1543":"work","p1544":"health","p1545":"food","p1546":"tech","p1547":"health","p1548":"health","p1549":"health","p1550":"health","p1551":"shop","p1552":"shop","p1553":"feel","p1554":"health","p1555":"health","p1556":"hobby","p1557":"work","p1558":"feel","p1559":"feel","p1560":"work","p1561":"study","p1562":"feel","p1563":"health","p1564":"shop","p1565":"work","p1566":"shop","p1567":"health","p1568":"food","p1569":"shop","p1570":"travel","p1571":"shop","p1572":"food","p1573":"home","p1574":"travel","p1575":"shop","p1576":"shop","p1577":"shop","p1578":"travel","p1579":"shop","p1580":"shop","p1581":"shop","p1582":"work","p1583":"travel","p1584":"food","p1585":"work","p1586":"food","p1587":"health","d1":"hobby","d2":"food","d3":"shop","d4":"shop","d5":"hobby","d6":"home","d7":"hobby","d8":"hobby","d9":"hobby","d10":"hobby","d11":"hobby","d12":"hobby","d13":"hobby","d14":"home","d15":"tech","d16":"hobby","d17":"food","d18":"hobby","d19":"tech","d20":"hobby","d21":"food","d22":"home","d23":"home","d24":"home","d25":"shop","d26":"tech","d27":"home","d28":"hobby","d29":"home","d30":"tech","d31":"food","d32":"people","d33":"shop","d34":"food","d35":"home","d36":"people","d37":"health","d38":"hobby","d39":"shop","d40":"hobby","d41":"shop","d42":"home","d43":"shop","p1588":"food","p1589":"food","p1590":"food","p1591":"food","p1592":"home","p1593":"home","p1594":"home","p1595":"people","p1596":"study","p1597":"study","p1598":"work","p1599":"work","p1600":"food","p1601":"feel","p1602":"feel","p1603":"hobby","p1604":"feel","p1605":"people","p1606":"feel","p1607":"food","p1608":"hobby","p1609":"grammar","p1610":"grammar","p1611":"grammar","p1612":"grammar","p1613":"grammar","p1614":"grammar","p1615":"grammar","p1616":"grammar","p1617":"grammar","p1618":"grammar","p1619":"grammar","p1620":"grammar","p1621":"grammar","p1622":"grammar","p1623":"grammar","p1624":"grammar","p1625":"grammar","p1626":"grammar","p1627":"grammar","p1628":"grammar","p1629":"grammar","p1630":"grammar","p1631":"grammar","p1632":"grammar","p1633":"grammar","p1634":"grammar","p1635":"grammar","p1636":"grammar","p1637":"grammar","p1638":"grammar","p1639":"grammar","p1640":"grammar","p1641":"grammar","p1642":"grammar","p1643":"grammar","p1644":"grammar","p1645":"grammar","p1646":"grammar","p1647":"grammar","p1648":"grammar","p1649":"grammar","p1650":"grammar","p1651":"grammar","p1652":"grammar","p1653":"grammar","p1654":"hobby","p1655":"hobby","p1656":"hobby","p1657":"home","p1658":"home","p1659":"home","p1660":"home","p1661":"home","p1662":"home","p1663":"people","p1664":"home","p1665":"home"},"speeches":[{"id":1,"section":"スピーチ1: トライアスロン","en":"I want to talk about a triathlon race. It is the Nagaragawa Triathlon on July 26th. I will join this race.","ja":"トライアスロンのレースについてお話ししたいと思います。7月26日の長良川トライアスロンです。私はこのレースに参加します。"},{"id":2,"section":"スピーチ1: トライアスロン","en":"I have three reasons.","ja":"理由は3つあります。"},{"id":3,"section":"スピーチ1: トライアスロン","en":"First, I want to show a good example. I am a president and a parent. My employees are trying many new things. So I also want to try something hard. Swimming is difficult for me, but I want to do it.","ja":"第一に、良い手本を示したいのです。私は社長であり親でもあります。従業員は多くの新しいことに挑戦しています。だから私も難しいことに挑戦したいのです。水泳は私には難しいですが、やってみたいのです。"},{"id":4,"section":"スピーチ1: トライアスロン","en":"Second, I want to get better at swimming. This is my personal goal.","ja":"第二に、水泳が上手くなりたいです。これは私の個人的な目標です。"},{"id":5,"section":"スピーチ1: トライアスロン","en":"Third, I want to introduce my mentor to Mr. Chiba. If I join the race, my mentor will come to cheer for me. My mentor and Mr. Chiba think in a similar way. Maybe my mentor will become my triathlon partner too.","ja":"第三に、メンターを千葉さんに紹介したいのです。レースに参加すれば、メンターが応援に来てくれます。メンターと千葉さんは考え方が似ています。メンターは私のトライアスロン仲間にもなってくれるかもしれません。"},{"id":6,"section":"スピーチ1: トライアスロン","en":"That is why I will join the race.","ja":"だから私はこのレースに参加するのです。"},{"id":7,"section":"スピーチ2: 娘の誕生日","en":"My second story is about my younger daughter's birthday. It was on May 24th. We celebrated it with my family and her grandmother. We ate a birthday cake together. For her present, she got a popping toy. My daughter also made us sing the \"Happy Birthday\" song many times!","ja":"2つ目の話は下の娘の誕生日についてです。5月24日でした。家族と祖母とでお祝いしました。一緒にバースデーケーキを食べました。プレゼントには飛び出すおもちゃをもらいました。娘は私たちに何度も「ハッピーバースデー」の歌を歌わせました!"}]};</script>
  <script>
/* store.js — データ読み込み + 進捗/SRS/ゲーミフィケーション永続化レイヤ
 * window.Store としてグローバル公開。localStorage に永続化。
 */
(function () {
  'use strict';

  const PROGRESS_KEY = 'speak.progress.v1';
  const DATA_FILES = {
    phrases: 'data/phrases.json',
    dialogues: 'data/dialogues.json',
    notes: 'data/notes.json',
    reading: 'data/reading.json',
    speeches: 'data/speeches.json',
    situations: 'data/situations.json', // { "p12": "food", "d3": "shop", ... } 聞き流し用の場面分け
  };

  // ---- 学習コンテンツ（読み取り専用・メモリ内） ----
  const content = {
    phrases: [],
    dialogues: [],
    notes: [],
    reading: [],
    speeches: [],
  };

  // ---- 進捗（localStorage 永続化） ----
  const defaultProgress = () => ({
    xp: 0,
    streak: { count: 0, lastDate: '' },
    daily: {}, // 'YYYY-MM-DD': { count }
    speaking: [], // { key, score, date } 直近200件
    srs: {}, // cardKey -> { ease, interval, due, reps, lapses, lastScore, lastReview }
    done: { speaking: {}, roleplay: {}, shadow: {} },
    favorites: {},
    goal: 15,
  });

  let progress = defaultProgress();

  function load() {
    try {
      const raw = localStorage.getItem(PROGRESS_KEY);
      if (raw) progress = Object.assign(defaultProgress(), JSON.parse(raw));
    } catch (e) {
      progress = defaultProgress();
    }
  }
  function save() {
    try {
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    } catch (e) {
      /* quota 超過などは黙って無視 */
    }
  }

  // ---- 日付ユーティリティ ----
  function todayStr(d) {
    d = d || new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function daysBetween(a, b) {
    const ms = new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00');
    return Math.round(ms / 86400000);
  }

  // ---- ストリーク ----
  function touchStreak() {
    const t = todayStr();
    const last = progress.streak.lastDate;
    if (last === t) return;
    if (!last) {
      progress.streak = { count: 1, lastDate: t };
    } else {
      const gap = daysBetween(last, t);
      if (gap === 1) progress.streak.count += 1;
      else if (gap > 1) progress.streak.count = 1;
      progress.streak.lastDate = t;
    }
  }

  // ---- 今日のカウント ----
  function bumpDaily(n) {
    const t = todayStr();
    if (!progress.daily[t]) progress.daily[t] = { count: 0 };
    progress.daily[t].count += (n || 1);
  }
  function todayCount() {
    return (progress.daily[todayStr()] || {}).count || 0;
  }

  // ---- XP / レベル ----
  // レベルは累積XPの平方根ベース。level n には n*n*40 XP 必要。
  function levelFromXp(xp) {
    return Math.max(1, Math.floor(Math.sqrt(xp / 40)) + 1);
  }
  function xpForLevel(lv) {
    return (lv - 1) * (lv - 1) * 40;
  }
  function addXp(n) {
    progress.xp += n;
  }
  function levelInfo() {
    const lv = levelFromXp(progress.xp);
    const cur = xpForLevel(lv);
    const next = xpForLevel(lv + 1);
    return {
      level: lv,
      xp: progress.xp,
      into: progress.xp - cur,
      span: next - cur,
      pct: Math.min(100, Math.round(((progress.xp - cur) / (next - cur)) * 100)),
    };
  }

  // 学習1アクション完了時の共通記録。points はXP加算量。
  function recordActivity(points) {
    touchStreak();
    bumpDaily(1);
    addXp(points || 0);
    save();
  }

  // ---- スピーキングのスコア記録 ----
  function recordSpeaking(key, score) {
    progress.speaking.push({ key, score, date: todayStr() });
    if (progress.speaking.length > 200) progress.speaking = progress.speaking.slice(-200);
    // スコアに応じてXP（0〜15）
    recordActivity(Math.round((score / 100) * 15) + 3);
  }
  function speakingStats() {
    const arr = progress.speaking;

  }

  // ---- 発音スコアリング ----
  function normalizeWord(w) {
    return (w || '')
      .toLowerCase()
      .replace(/[^a-z0-9']/g, '')
      .replace(/^'+|'+$/g, '');
  }
  // よくある短縮形を複数語に展開（採点の表記ゆれ吸収）
  const CONTRACT = {
    "i'm": ['i', 'am'], "you're": ['you', 'are'], "we're": ['we', 'are'], "they're": ['they', 'are'],
    "it's": ['it', 'is'], "that's": ['that', 'is'], "he's": ['he', 'is'], "she's": ['she', 'is'],
    "what's": ['what', 'is'], "who's": ['who', 'is'], "there's": ['there', 'is'], "here's": ['here', 'is'],
    "let's": ['let', 'us'], "don't": ['do', 'not'], "doesn't": ['does', 'not'], "didn't": ['did', 'not'],
    "can't": ['can', 'not'], "cannot": ['can', 'not'], "won't": ['will', 'not'], "wouldn't": ['would', 'not'],
    "couldn't": ['could', 'not'], "shouldn't": ['should', 'not'], "isn't": ['is', 'not'], "aren't": ['are', 'not'],
    "wasn't": ['was', 'not'], "weren't": ['were', 'not'], "haven't": ['have', 'not'], "hasn't": ['has', 'not'],
    "hadn't": ['had', 'not'], "i'll": ['i', 'will'], "you'll": ['you', 'will'], "we'll": ['we', 'will'],
    "they'll": ['they', 'will'], "i've": ['i', 'have'], "you've": ['you', 'have'], "we've": ['we', 'have'],
    "they've": ['they', 'have'], "i'd": ['i', 'would'], "you'd": ['you', 'would'], "wanna": ['want', 'to'],
    "gonna": ['going', 'to'], "gotta": ['got', 'to'],
  };
  function tokenize(s) {
    const out = [];
    (s || '').split(/\s+/).forEach((raw) => {
      const w = raw.toLowerCase().replace(/[^a-z0-9']/g, '').replace(/^'+|'+$/g, '');
      if (!w) return;
      if (CONTRACT[w]) out.push(...CONTRACT[w]);
      else out.push(normalizeWord(w));
    });
    return out.filter(Boolean);
  }
  // よくある数字・短縮の表記ゆれを吸収
  const NUM = { '1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','0':'zero' };
  function canon(w) {
    if (NUM[w]) return NUM[w];
    return w
      .replace(/n't$/, 'not')
      .replace(/'re$/, 'are')
      .replace(/'ll$/, 'will')
      .replace(/'ve$/, 'have')
      .replace(/'m$/, 'am');
  }

  // target の各単語について、認識結果に含まれるか判定。
  // 返り値: { score, tokens:[{word,ok}], matched, total }
  function score(target, said) {
    const tgt = tokenize(target);
    const heard = tokenize(said).map(canon);
    const pool = heard.slice(); // 消費式マッチ（重複語対応）
    const tokens = [];
    let matched = 0;
    for (const raw of tgt) {
      const w = canon(raw);
      let ok = false;
      // 完全一致を優先
      let idx = pool.indexOf(w);
      if (idx === -1) {
        // 前方3文字一致の近似（語尾変化の許容）
        idx = pool.findIndex((h) => h.length > 2 && w.length > 2 && (h.startsWith(w.slice(0, 3)) && Math.abs(h.length - w.length) <= 2 && lev(h, w) <= 1));
      }
      if (idx !== -1) { ok = true; matched++; pool.splice(idx, 1); }
      tokens.push({ word: raw, ok });
    }
    const total = tgt.length || 1;
    const s = Math.round((matched / total) * 100);
    return { score: s, tokens, matched, total };
  }

  // レーベンシュタイン距離（短い語の近似判定用）
  function lev(a, b) {
    const m = a.length, n = b.length;
    if (Math.abs(m - n) > 2) return 99;
    const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++)
      for (let j = 1; j <= n; j++)
        dp[i][j] = Math.min(
          dp[i - 1][j] + 1,
          dp[i][j - 1] + 1,
          dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
    return dp[m][n];
  }

  // ---- 録音（自分の声を録って聞き比べ） ----
  const recordSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  async function startRecording() {
    if (!recordSupported) throw new Error('unsupported');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream);
    const chunks = [];
    const done = new Promise((resolve) => {
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        resolve(chunks.length ? URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || 'audio/webm' })) : null);
      };
    });
    rec.start();
    return { stop: () => { try { rec.stop(); } catch (e) {} }, done };
  }

  // 音声認識エラーを日本語の案内に変換
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function errorMessage(err) {
    const c = (err && err.message) || '';
    if (c === 'unsupported' || !asrSupported) {
      return isIOS
        ? 'iPhone/iPadのブラウザは音声認識に非対応です。PCのChromeをご利用ください'
        : 'このブラウザは音声認識に非対応です（Chrome/Edge推奨）';
    }
    if (/not-allowed|service-not-allowed/.test(c)) return 'マイクの使用が許可されていません。ブラウザのマイク許可を確認してください';
    if (/audio-capture/.test(c)) return 'マイクが見つかりません。接続と許可を確認してください';
    if (/no-speech/.test(c)) return '音声が検出されませんでした。もう一度お試しください';
    if (/network/.test(c)) return 'ネットワークエラーです。接続を確認してください';
    return 'もう一度お試しください';
  }

  window.Speech = {
    listVoices, setVoice,
    loadClips, registerText, hasClip, clipKeyFor, playClip, unlockAudio, releaseAudio, prefetchClip,
    get clipsLoaded() { return !!clipIndex; },
    ttsSupported,
    asrSupported,
    recordSupported,
    isIOS,
    speak,
    stopSpeaking,
    listenOnce,
    startRecording,
    score,
    errorMessage,
  };
})();

</script>

/* speaking.js — 発音・スピーキング練習（Speak型：お手本→発話→AI採点）
 * window.SpeakingView
 */
(function () {
  'use strict';

  let state = null; // { list, idx, mode }
  let micRef = {};

  function decks() {
    const C = window.Store.content;
    return {
      sentence: { label: '文で練習', emoji: '💬', items: C.phrases.filter((p) => p.kind === 'sentence').map(mapPhrase) },
      word: { label: '単語で練習', emoji: '🔤', items: C.phrases.filter((p) => p.kind === 'word').map(mapPhrase) },
      note: { label: 'レッスンノート', emoji: '📝', items: C.notes.map(mapNote) },
    };
  }
  function mapPhrase(p) { return { key: 'p' + p.id, en: p.en, ja: p.ja, note: p.note }; }
  function mapNote(n) { return { key: 'n' + n.id, en: n.en, ja: n.ja, note: n.note }; }

  function render(container) {
    if (!state) startSession('sentence');
    draw(container);
  }

  function startSession(deckKey, filtered) {
    const d = decks()[deckKey];
    let items = filtered || d.items.slice();
    // 適度にシャッフル
    items = shuffle(items).slice(0, 30);
    state = { deckKey, list: items, idx: 0, result: null };
  }

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function draw(container) {
    const d = decks();
    const item = state.list[state.idx];
    if (!item) {
      container.innerHTML = `<div class="text-center py-20 text-gray-400">項目がありません</div>`;
      return;
    }
    const asr = window.Speech.asrSupported;

          <button id="spk-star" class="text-xl leading-none" style="color:${window.Store.isFavorite(item.key) ? '#f59e0b' : '#d1d5db'}">${window.Store.isFavorite(item.key) ? '★' : '☆'}</button>

        ${item.note ? `<div class="text-xs text-gray-400 mt-2 bg-gray-50 rounded-lg px-3 py-2">💡 ${window.App.escapeHtml(item.note)}</div>` : ''}
        <div class="flex gap-2 mt-4">
          <button id="spk-play" class="flex-1 bg-violet-50 text-brand font-semibold rounded-xl py-2.5 text-sm flex items-center justify-center gap-1.5">
            🔊 お手本

        ${window.Speech.recordSupported ? `<div id="spk-rec-wrap" class="mt-2 flex items-center gap-2">
          <button id="spk-rec" class="flex-1 bg-pink-50 font-semibold rounded-xl py-2.5 text-sm" style="color:var(--brand2)">🎙️ 録音して聞き比べ</button>

      </div>

    box.querySelector('#spk-cmp').onclick = () => (window.Speech.unlockAudio(), window.Speech.speak)(item.en, { rate: 0.9 });

  function nextItem(container) {

    recording = false;
  }

  window.SpeakingView = { render, onLeave };

  <script>
/* roleplay.js — ロールプレイ会話（SpeakBuddy型：相手役AとやりとりしBを発話）
 * window.RoleplayView
 */
(function () {
  'use strict';

  let state = null; // { list, idx, revealed, result }
  let micRef = {};
  let listening = false;

  function render(container) {
    if (!state) newSession();
    draw(container);
  }

  function newSession() {
    const items = window.Store.content.dialogues.slice();
    state = { list: shuffle(items), idx: 0, revealed: false, result: null };
  }
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function draw(container) {
    const d = state.list[state.idx];
    if (!d) { newSession(); }
    const asr = window.Speech.asrSupported;

    container.innerHTML = `
      <div class="flex items-center justify-between mb-2 text-xs text-gray-400 font-semibold">
        <span>会話 ${state.idx + 1} / ${state.list.length}</span>
        <button id="rp-restart" class="underline">最初から</button>
      </div>
      <div class="h-1.5 bg-gray-100 rounded-full mb-4 overflow-hidden">
        <div class="h-full brand-grad rounded-full transition-all" style="width:${(state.idx / state.list.length) * 100}%"></div>
      </div>

      <!-- 相手A の吹き出し -->
      <div class="flex items-start gap-2 mb-3">
        <div class="w-9 h-9 rounded-full brand-grad text-white flex items-center justify-center text-sm shrink-0">A</div>
        <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm p-3.5 shadow-sm max-w-[85%]">

          <div class="text-xs text-gray-500 mt-1">${window.App.escapeHtml(d.aJa)}</div>
          <button id="rp-playA" class="text-brand text-xs font-semibold mt-1.5">🔊 もう一度聞く</button>
        </div>
      </div>

      <div class="flex items-start gap-2 flex-row-reverse mb-4">
        <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm shrink-0" style="background:var(--brand2);color:#fff">You</div>
        <div class="rounded-2xl rounded-tr-sm p-3.5 max-w-[85%] ${state.revealed ? 'bg-pink-50 border border-pink-100' : 'bg-gray-50 border border-dashed border-gray-300'}">

          <div class="text-gray-800 font-medium">${window.App.escapeHtml(d.bJa)}</div>
          <div id="rp-ben" class="${state.revealed ? '' : 'blur-sm select-none'} mt-2 font-bold text-gray-800">${window.App.escapeHtml(d.b)}</div>

      ${d.note ? `<div class="text-xs text-gray-500 bg-violet-50 rounded-xl px-3 py-2 mb-4">💡 ${window.App.escapeHtml(d.note)}</div>` : ''}

      <div class="flex flex-col items-center gap-2">
        <button id="rp-mic" class="mic-btn brand-grad">
          <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <div id="rp-hint" class="text-xs text-gray-400 h-4">${asr ? 'タップしてBのセリフを発音' : '⚠️ 音声認識は非対応（Chrome/Edge/Safari推奨）'}</div>
      </div>

      <div class="flex gap-2 mt-5">
        <button id="rp-reveal" class="flex-1 bg-gray-100 text-gray-600 rounded-xl py-2.5 font-semibold text-sm">答えを見る</button>
        <button id="rp-next" class="flex-1 bg-gray-800 text-white rounded-xl py-2.5 font-semibold text-sm">次の会話 →</button>
      </div>
    `;

    // A を自動再生
    window.Speech.speak(d.a, { rate: 0.95 });

    if (state.result) renderResult(container, d);

    container.querySelector('#rp-playA').onclick = () => window.Speech.speak(d.a, { rate: 0.95 });
    container.querySelector('#rp-restart').onclick = () => { newSession(); draw(container); };
    container.querySelector('#rp-reveal').onclick = () => {
      state.revealed = true;
      draw(container);
      window.Speech.speak(d.b, { rate: 0.95 });
    };
    container.querySelector('#rp-next').onclick = () => next(container);
    container.querySelector('#rp-mic').onclick = () => toggleMic(container, d);
  }

  async function toggleMic(container, d) {
    if (!window.Speech.asrSupported) { window.App.toast('音声認識に非対応のブラウザです'); return; }
    const micBtn = container.querySelector('#rp-mic');

    listening = true;
    micBtn.classList.add('listening');

    try {

        ref: micRef,
        onPartial: (t) => { hint.textContent = '🎤 ' + (t || '…'); },
      });
      const res = window.Speech.score(d.b, said);
      state.result = { said, res };
      state.revealed = true;
      window.Store.recordSpeaking('d' + d.id, res.score);
      window.App.checkLevelUp();
      // 答えを表示してから結果描画
      const ben = container.querySelector('#rp-ben');
      if (ben) ben.classList.remove('blur-sm', 'select-none');
      renderResult(container, d);
      if (res.score >= 80) window.App.toast('🌟 ' + res.score + '点！');
    } catch (e) {

    } finally {
      listening = false;
      micBtn.classList.remove('listening');
      micBtn.style.background = '';
    }
  }

  function renderResult(container, d) {
    const box = container.querySelector('#rp-result');
    if (!box || !state.result) return;
    const { said, res } = state.result;
    const color = window.App.scoreColor(res.score);
    const toks = res.tokens.map((t) => `<span class="wtok ${t.ok ? 'ok' : 'ng'}">${window.App.escapeHtml(t.word)}</span>`).join(' ');
    box.innerHTML = `
      <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
        <div class="flex items-center gap-3">
          <div class="text-3xl font-extrabold" style="color:${color}">${res.score}</div>
          <div class="text-sm font-bold" style="color:${color}">${window.App.scoreLabel(res.score)}</div>
          <button id="rp-cmp" class="ml-auto text-brand text-xs font-semibold">🔊 お手本</button>
        </div>
        <div class="mt-2 leading-relaxed">${toks}</div>
        <div class="mt-1 text-xs text-gray-400">あなた: 「${window.App.escapeHtml(said) || '(認識なし)'}」</div>
      </div>`;
    box.querySelector('#rp-cmp').onclick = () => window.Speech.speak(d.b, { rate: 0.9 });
  }

  function next(container) {
    if (state.idx < state.list.length - 1) {
      state.idx++;
      state.revealed = false;
      state.result = null;
      draw(container);
    } else {
      container.innerHTML = `
        <div class="text-center py-16">
          <div class="text-6xl mb-3">🎊</div>
          <div class="text-xl font-bold text-gray-800">全${state.list.length}会話クリア！</div>
          <div class="text-sm text-gray-500 mt-1">実践会話おつかれさまでした</div>
          <button id="rp-again" class="mt-6 brand-grad text-white rounded-xl px-6 py-3 font-bold">もう一度</button>
        </div>`;
      container.querySelector('#rp-again').onclick = () => { newSession(); draw(container); };
    }
  }

  function onLeave() {
    if (micRef.stop) micRef.stop();
    listening = false;
  }

  window.RoleplayView = { render, onLeave };
})();

(function () {
  'use strict';

  let state = null; // { queue, pos, flipped, source }

  // デッキ構築（フレーズ＋レッスンノート）
  function buildDeck(source) {
    const C = window.Store.content;
    let cards = [];
    if (source === 'phrase' || !source || source === 'all') {
      cards = cards.concat(C.phrases.map((p) => ({ key: 'p' + p.id, en: p.en, ja: p.ja, note: p.note, tag: 'フレーズ' })));
    }
    if (source === 'note' || !source || source === 'all') {
      cards = cards.concat(C.notes.map((n) => ({ key: 'n' + n.id, en: n.en, ja: n.ja, note: n.note, tag: 'ノート' })));
    }
    return cards;
  }

  function render(container) {
    if (!state) startSession('all');
    draw(container);
  }

  function startSession(source) {
    const deck = buildDeck(source);
    const { due, fresh } = window.Store.srsDue(deck);
    // 期限到来を優先、次に新規カードを最大20枚
    let queue = due.concat(shuffle(fresh).slice(0, Math.max(0, 20 - due.length)));
    if (queue.length === 0) queue = shuffle(deck).slice(0, 20); // 全て学習済みなら復習
    state = { queue: shuffle(queue), pos: 0, flipped: false, source, reviewed: 0 };

    a = a.slice();

    `;

    if (state.flipped) container.querySelector('#card-flip').classList.add('flipped');

    const flipEl = container.querySelector('#card-flip');
    flipEl.addEventListener('click', (e) => {
      if (e.target.id === 'card-tts') return;
      state.flipped = !state.flipped;
      flipEl.classList.toggle('flipped', state.flipped);
      container.querySelector('#card-grades').classList.toggle('opacity-40', !state.flipped);
      container.querySelector('#card-grades').classList.toggle('pointer-events-none', !state.flipped);
    });
    container.querySelector('#card-tts').onclick = (e) => { e.stopPropagation(); (window.Speech.unlockAudio(), window.Speech.speak)(card.en, { rate: 0.9 }); };
    container.querySelectorAll('[data-src]').forEach((b) => {
      b.onclick = () => { startSession(b.dataset.src); draw(container); };

    container.querySelectorAll('[data-g]').forEach((b) => {

  function grade(container, card, g) {

    state.reviewed++;
    // 「もう一度」は後方に差し込み、それ以外は次へ

  function finish(container) {

      <div class="text-center py-16">
        <div class="text-6xl mb-3">🧠✨</div>
        <div class="text-xl font-bold text-gray-800">復習完了！</div>

      </div>`;
    container.querySelector('#card-more').onclick = () => { startSession(state.source); draw(container); };
  }

  window.CardsView = { render, buildDeck };

  <script>
/* shadow.js — 長文・シャドーイング（東北旅行エッセイ／スピーチ練習）
 * window.ShadowView
 */
(function () {
  'use strict';

  let state = null; // { matKey }
  let micRef = {};
  let listening = false;

  function materials() {
    const C = window.Store.content;
    const mats = [];
    if (C.reading.length) {
      mats.push({ key: 'tohoku', title: '東北旅行エッセイ', emoji: '🚗', blocks: C.reading.map((r, i) => ({ id: 'r' + r.id, label: r.section, en: r.en, ja: r.ja })) });
    }
    // スピーチはセクション名でグループ化
    const groups = {};
    C.speeches.forEach((s) => {
      const g = s.section || 'スピーチ';
      (groups[g] = groups[g] || []).push(s);
    });
    Object.entries(groups).forEach(([g, arr], gi) => {
      mats.push({ key: 'sp' + gi, title: g, emoji: '🎤', blocks: arr.map((s) => ({ id: 's' + s.id, label: '', en: s.en, ja: s.ja })) });
    });
    return mats;
  }

  function splitSentences(text) {
    const parts = (text || '').match(/[^.!?]+[.!?]*/g) || [text];
    return parts.map((s) => s.trim()).filter(Boolean);
  }

  function render(container) {
    const mats = materials();
    if (!state) state = { matKey: mats[0] ? mats[0].key : null };
    draw(container, mats);
  }

  function draw(container, mats) {
    mats = mats || materials();
    const mat = mats.find((m) => m.key === state.matKey) || mats[0];
    if (!mat) { container.innerHTML = '<div class="text-center py-20 text-gray-400">教材がありません</div>'; return; }

    // 進捗集計
    let total = 0, done = 0;
    mat.blocks.forEach((b) => {
      splitSentences(b.en).forEach((_, si) => {
        total++;
        if (window.Store.isDone('shadow', b.id + '_' + si)) done++;
      });
    });

    container.innerHTML = `
      <!-- 教材選択 -->
      <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
        ${mats.map((m) => `
          <button data-mat="${m.key}" class="chip whitespace-nowrap ${m.key === mat.key ? 'brand-grad text-white' : 'bg-gray-100 text-gray-600'}">
            ${m.emoji} ${window.App.escapeHtml(m.title)}
          </button>`).join('')}
      </div>

      <div class="flex items-center justify-between mb-1 text-xs font-semibold text-gray-500">
        <span>シャドーイング進捗</span><span>${done} / ${total} 文</span>
      </div>
      <div class="h-1.5 bg-gray-100 rounded-full mb-4 overflow-hidden">
        <div class="h-full brand-grad rounded-full" style="width:${total ? (done / total) * 100 : 0}%"></div>
      </div>

      <button id="sh-playall" class="w-full bg-violet-50 text-brand font-bold rounded-xl py-2.5 text-sm mb-4">▶ 全文を通しで再生</button>

      <div id="sh-blocks" class="space-y-4"></div>
    `;

    const wrap = container.querySelector('#sh-blocks');
    mat.blocks.forEach((b) => wrap.appendChild(blockEl(b)));

    container.querySelectorAll('[data-mat]').forEach((btn) => {
      btn.onclick = () => { state.matKey = btn.dataset.mat; window.Speech.stopSpeaking(); draw(container); };
    });
    container.querySelector('#sh-playall').onclick = () => playAll(mat);
  }

  function blockEl(b) {
    const sents = splitSentences(b.en);
    const el = document.createElement('div');
    el.className = 'bg-white border border-gray-100 rounded-2xl p-4 shadow-sm';
    el.innerHTML = `
      ${b.label ? `<div class="chip bg-violet-50 text-brand mb-2">${window.App.escapeHtml(b.label)}</div>` : ''}
      <div class="space-y-2">
        ${sents.map((s, si) => {
          const doneKey = b.id + '_' + si;
          const isDone = window.Store.isDone('shadow', doneKey);
          return `
          <div class="sh-sent flex items-start gap-2" data-en="${window.App.escapeHtml(s)}" data-key="${doneKey}">
            <button class="sh-play mt-0.5 shrink-0 w-7 h-7 rounded-full bg-violet-50 text-brand flex items-center justify-center text-xs">▶</button>
            <button class="sh-mic mt-0.5 shrink-0 w-7 h-7 rounded-full bg-pink-50 flex items-center justify-center text-xs" style="color:var(--brand2)">🎤</button>
            <div class="flex-1 text-[15px] text-gray-800 leading-relaxed">${window.App.escapeHtml(s)}
              <span class="sh-badge ml-1 text-xs font-bold ${isDone ? '' : 'hidden-x'}" style="color:var(--ok)">✓</span>
              <div class="sh-fb text-xs mt-0.5"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <button class="sh-ja text-xs text-gray-400 underline mt-3">和訳を表示</button>
      <div class="sh-ja-text hidden-x text-sm text-gray-600 bg-gray-50 rounded-lg px-3 py-2 mt-2">${window.App.escapeHtml(b.ja)}</div>
    `;

    el.querySelector('.sh-ja').onclick = (e) => {
      const t = el.querySelector('.sh-ja-text');
      t.classList.toggle('hidden-x');
      e.target.textContent = t.classList.contains('hidden-x') ? '和訳を表示' : '和訳を隠す';
    };
    el.querySelectorAll('.sh-sent').forEach((row) => {
      const en = row.dataset.en;
      row.querySelector('.sh-play').onclick = () => (window.Speech.unlockAudio(), window.Speech.speak)(en, { rate: 0.9 });
      row.querySelector('.sh-mic').onclick = () => micSentence(row, en);
    });
    return el;
  }

  async function micSentence(row, en) {
    if (!window.Speech.asrSupported) { window.App.toast('音声認識に非対応のブラウザです'); return; }
    if (listening) { if (micRef.stop) micRef.stop(); return; }
    const fb = row.querySelector('.sh-fb');
    const micBtn = row.querySelector('.sh-mic');
    listening = true;
    micBtn.classList.add('listening');
    fb.style.color = '#9ca3af';
    fb.textContent = '🎤 聞き取り中…';
    window.Speech.stopSpeaking();
    micRef = {};
    try {
      const said = await window.Speech.listenOnce({
        ref: micRef,
        onPartial: (t) => { fb.textContent = '🎤 ' + (t || '…'); },
      });
      const res = window.Speech.score(en, said);
      const color = window.App.scoreColor(res.score);
      fb.style.color = color;
      fb.innerHTML = `${res.score}点 ${window.App.scoreLabel(res.score)} — ${res.tokens.map((t) => `<span class="wtok ${t.ok ? 'ok' : 'ng'}">${window.App.escapeHtml(t.word)}</span>`).join(' ')}`;
      window.Store.recordSpeaking('sh', res.score);
      if (res.score >= 60) {
        window.Store.markDone('shadow', row.dataset.key);
        window.Store.save();
        const badge = row.querySelector('.sh-badge');
        if (badge) badge.classList.remove('hidden-x');
      }
      window.App.checkLevelUp();
    } catch (e) {
      fb.style.color = 'var(--bad)';
      fb.textContent = 'もう一度お試しください';
    } finally {
      listening = false;
      micBtn.classList.remove('listening');
    }
  }

  async function playAll(mat) {
    window.Speech.stopSpeaking();
    for (const b of mat.blocks) {
      for (const s of splitSentences(b.en)) {
        await (window.Speech.unlockAudio(), window.Speech.speak)(s, { rate: 0.95 });
      }
    }
  }

  function onLeave() {
    if (micRef.stop) micRef.stop();
    listening = false;
    window.Speech.stopSpeaking();
  }

  window.ShadowView = { render, onLeave };
})();

</script>

/* listen.js — 聞き流し（フレーズを場面別に連続再生／長文を文ごとに自動で進める）
 * window.ListenView
 */
(function () {
  'use strict';

  // 場面の一覧（data/situations.json のキーと対応）
  const SITS = [
    { key: 'greet', emoji: '👋', label: 'あいさつ・雑談' },
    { key: 'work', emoji: '💼', label: '仕事・職場' },
    { key: 'food', emoji: '🍽️', label: '食事・レストラン' },
    { key: 'shop', emoji: '🛍️', label: '買い物・お金' },
    { key: 'health', emoji: '🩺', label: '健康・体調' },
    { key: 'travel', emoji: '🚃', label: '旅行・交通' },
    { key: 'home', emoji: '🏠', label: '家・暮らし' },
    { key: 'hobby', emoji: '⚽', label: '趣味・休日' },
    { key: 'study', emoji: '📝', label: '学校・学習' },
    { key: 'plan', emoji: '📅', label: '予定・約束' },
    { key: 'feel', emoji: '💭', label: '気持ち・意見' },
    { key: 'people', emoji: '👨‍👩‍👧', label: '家族・人間関係' },
    { key: 'tech', emoji: '📱', label: '電話・スマホ' },
    { key: 'grammar', emoji: '🔤', label: '単語・文法メモ' },
  ];

  const SETTINGS_KEY = 'speak.listen.v1';
  let settings = { tab: 'phrase', sit: 'greet', rate: 1, ja: true, repeat: 1, kind: 'all', matKey: null, gap: 0.8, pattern: 'std' };
  try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch (e) { /* noop */ }
  function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) { /* noop */ } }

  // 再生状態
  let queue = [];        // [{en, ja, key, el?}]
  let idx = 0;
  let playing = false;
  let session = 0;       // 再生ループの世代（停止・切替で無効化する）
  let container = null;
  let listenedThisRun = 0;

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

  // ---- フレーズ側のキュー ----
  function phraseItems(sitKey) {
    const C = window.Store.content;
    const out = [];
    C.phrases.forEach((p) => {
      if (sitKey !== 'all' && p.sit !== sitKey) return;
      if (settings.kind === 'word' && p.kind !== 'word') return;
      if (settings.kind === 'sentence' && p.kind !== 'sentence') return;
      out.push({ en: p.en, ja: p.ja, key: 'p' + p.id });
    });
    if (settings.kind !== 'word') {
      C.dialogues.forEach((d) => {
        if (sitKey !== 'all' && d.sit !== sitKey) return;
        out.push({ en: d.a, ja: d.aJa, key: 'd' + d.id + 'a' });
        out.push({ en: d.b, ja: d.bJa, key: 'd' + d.id + 'b' });
      });
    }
    return out;
  }
  function sitCount(sitKey) { return phraseItems(sitKey).length; }

  // ---- 長文側の教材 ----
  function splitSentences(text) {
    const parts = (text || '').match(/[^.!?]+[.!?]*/g) || [text];
    return parts.map((s) => s.trim()).filter(Boolean);
  }
  function materials() {
    const C = window.Store.content;
    const mats = [];
    C.reading.forEach((r) => mats.push({ key: 'r' + r.id, group: '🚗 東北旅行', title: r.section, en: r.en, ja: r.ja }));
    // スピーチは同じセクション名のものを1章にまとめる
    const groups = {};
    C.speeches.forEach((s) => {
      const g = s.section || 'スピーチ';
      if (!groups[g]) { groups[g] = { key: 's' + s.id, group: '🎤 スピーチ', title: g, en: '', ja: '' }; mats.push(groups[g]); }
      groups[g].en += (groups[g].en ? ' ' : '') + s.en;
      groups[g].ja += (groups[g].ja ? ' ' : '') + s.ja;

    return mats;
  }

  // ---- 描画 ----
  function render(c) {
    container = c;
    draw();
  }

  function draw() {
    stop();
    const isPhrase = settings.tab === 'phrase';
    container.innerHTML = `
      <div class="flex gap-2 mb-4">
        <button data-tab="phrase" class="flex-1 rounded-xl py-2.5 text-sm font-bold ${isPhrase ? 'brand-grad text-white' : 'bg-gray-100 text-gray-600'}">💬 フレーズ・単語</button>
        <button data-tab="text" class="flex-1 rounded-xl py-2.5 text-sm font-bold ${!isPhrase ? 'brand-grad text-white' : 'bg-gray-100 text-gray-600'}">📖 長文</button>
      </div>
      <div id="ls-body"></div>
    `;
    container.querySelectorAll('[data-tab]').forEach((b) => {
      b.onclick = () => { settings.tab = b.dataset.tab; saveSettings(); draw(); };
    });
    if (isPhrase) drawPhrase(container.querySelector('#ls-body'));
    else drawText(container.querySelector('#ls-body'));
  }

  function player(extra) {
    return `
      <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm mb-4">
        <div class="flex items-center justify-between text-xs font-semibold text-gray-500 mb-1">
          <span id="ls-pos">— / —</span><span id="ls-sub"></span>
        </div>
        <div class="h-1.5 bg-gray-100 rounded-full mb-4 overflow-hidden"><div id="ls-bar" class="h-full brand-grad rounded-full" style="width:0%"></div></div>
        <div id="ls-en" class="text-[22px] font-bold text-gray-800 leading-snug min-h-[64px]" style="text-wrap:balance">再生を押すと順に流れます</div>
        <div id="ls-ja" class="text-sm text-gray-500 mt-2 min-h-[20px]"></div>
        <div class="flex items-center justify-center gap-5 mt-5">
          <button id="ls-prev" class="w-12 h-12 rounded-full bg-gray-100 text-gray-700 text-xl" aria-label="前へ">⏮</button>
          <button id="ls-play" class="w-20 h-20 rounded-full brand-grad text-white text-3xl shadow-lg" aria-label="再生">▶</button>
          <button id="ls-next" class="w-12 h-12 rounded-full bg-gray-100 text-gray-700 text-xl" aria-label="次へ">⏭</button>
        </div>
        ${extra || ''}
      </div>`;
  }

  function settingsRow() {
    const seg = (name, opts, cur) => `

        ${opts.map((o) => `<button data-set="${name}" data-val="${o.v}" class="flex-1 rounded-lg py-1.5 text-xs font-bold ${String(cur) === String(o.v) ? 'bg-white text-brand shadow-sm' : 'text-gray-500'}">${o.l}</button>`).join('')}

    return `
      <div class="mt-4 text-xs">
        <div class="text-gray-400 mb-1">再生のしかた</div>

      </div>
      <div class="grid grid-cols-2 gap-2 mt-3 text-xs">
        <div><div class="text-gray-400 mb-1">速さ</div>${seg('rate', [{ v: 0.8, l: 'ゆっくり' }, { v: 1, l: '普通' }, { v: 1.2, l: '速め' }], settings.rate)}</div>
        <div><div class="text-gray-400 mb-1">和訳の読み上げ</div>${seg('ja', [{ v: true, l: 'あり' }, { v: false, l: 'なし' }], settings.ja)}</div>
        <div><div class="text-gray-400 mb-1">1文の繰り返し</div>${seg('repeat', [{ v: 1, l: '1回' }, { v: 2, l: '2回' }, { v: 3, l: '3回' }], settings.repeat)}</div>
        <div><div class="text-gray-400 mb-1">文の間</div>${seg('gap', [{ v: 0.3, l: '短め' }, { v: 0.8, l: '普通' }, { v: 1.5, l: '長め' }], settings.gap)}</div>

  // 英語の声の選択（端末に入っている音声から）

        <div class="flex items-center justify-between mb-1">

  }

  // ---- フレーズ画面 ----
  function drawPhrase(body) {
    const all = sitCount('all');
    body.innerHTML = `
      <div class="flex gap-2 mb-3 overflow-x-auto pb-1 -mx-1 px-1">
        <button data-sit="all" class="chip whitespace-nowrap ${settings.sit === 'all' ? 'brand-grad text-white' : 'bg-gray-100 text-gray-600'}">🔀 すべて ${all}</button>

      <div class="flex gap-2 mb-4">
        ${[['all', '文も単語も'], ['sentence', '文だけ'], ['word', '単語だけ']].map(([v, l]) => `<button data-kind="${v}" class="chip ${settings.kind === v ? 'bg-violet-100 text-brand' : 'bg-gray-50 text-gray-500'}">${l}</button>`).join('')}

    body.querySelectorAll('[data-kind]').forEach((b) => { b.onclick = () => { settings.kind = b.dataset.kind; saveSettings(); draw(); }; });

    const sitLabel = settings.sit === 'all' ? 'すべて' : (SITS.find((s) => s.key === settings.sit) || {}).label;
    body.querySelector('#ls-sub').textContent = sitLabel;
    updatePos();
    bindPlayer(body);
