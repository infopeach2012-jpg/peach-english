<!DOCTYPE html>
<html lang="ja" class="dark apple speak">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Speak Studio — 英会話トレーニング</title>
  <script>
    // テーマを即時適用（ちらつき防止）
    (function () {
      try {
        var t = localStorage.getItem('speak.theme') || 'auto';
        var dark = t === 'dark' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="vendor/tailwind.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%A3%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%A3%EF%B8%8F%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app-shell">

    <header class="sp-top">
      <nav class="sp-nav" aria-label="メインメニュー">
        <button data-top="home">ホーム</button>
        <button data-top="freetalk">フリートーク</button>
        <button data-top="practice">練習</button>
        <button data-top="quiz">チャレンジ</button>
        <button data-top="stats">プロフィール</button>
      </nav>
      <div class="hidden-x" aria-hidden="true"><h1 id="hdr-title">ホーム</h1><button id="hdr-home"></button><button id="hdr-menu"></button><span id="hdr-level"></span><span id="hdr-streak"></span><span id="hdr-xp"></span><span id="hdr-xpnext"></span><div id="hdr-xpbar"></div></div>
    </header>

    <!-- ビュー領域 -->
    <main id="app" class="px-4 py-4">
      <div id="view-home" class="view active"></div>
      <div id="view-patterns" class="view"></div>
      <div id="view-lesson" class="view"></div>
      <div id="view-speaking" class="view"></div>
      <div id="view-roleplay" class="view"></div>
      <div id="view-cards" class="view"></div>
      <div id="view-shadow" class="view"></div>
      <div id="view-listen" class="view"></div>
      <div id="view-freetalk" class="view"></div>
      <div id="view-quiz" class="view"></div>
      <div id="view-stats" class="view"></div>
      <div id="view-dict" class="view"></div>
      <div id="view-review" class="view"></div>
      <div id="view-practice" class="view"></div>
      <div id="view-smart" class="view"></div>
      <div id="view-drill" class="view"></div>
    </main>

    <!-- ボトムナビ -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="学習メニュー">
      <button data-view="home" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/></svg>
        ホーム
      </button>
      <button data-view="speaking">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        発音
      </button>
      <button data-view="listen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        聞き流し
      </button>
      <button data-view="cards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M7 5V3h14v14h-2"/></svg>
        カード
      </button>
      <button data-view="shadow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        長文
      </button>
    </nav>
  </div>

  <!-- トースト -->
  <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 hidden-x">
    <div class="bg-gray-900 text-white text-sm font-semibold px-4 py-2 rounded-full shadow-lg"></div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/home.js"></script>
  <script src="js/speaking.js"></script>
  <script src="js/roleplay.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/shadow.js"></script>
  <script src="js/listen.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/freetalk.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/dict.js"></script>
  <script src="js/review.js"></script>
  <script src="js/smart.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/drill.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController && !refreshing) { refreshing = true; location.reload(); }
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((registration) => registration.update()).catch(() => {});
      });
    }
  </script>
</body>
</html>
